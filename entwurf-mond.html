<!doctype html><meta charset="utf-8"><title>Mondphasen Test</title>
<style>body{background:#0b0f14;color:#dde;font:13px system-ui;margin:16px}.b{position:relative;height:110px;width:420px;border-radius:12px;overflow:hidden;margin:0 0 6px;background:linear-gradient(180deg,#16284a,#2d476b)}.hg{position:absolute;inset:0}</style>
<div id="a"></div><script>
const hg=css=>`<div class="hg" style="${css}"></div>`;
const kreis=(x,y,r,innen,aussen,mitte="60%")=>`radial-gradient(circle ${r}px at ${x}% ${y}%,${innen},${aussen} ${mitte},transparent 100%)`;
  const SYNODE=29.530588853, NEUMOND=Date.UTC(2000,0,6,18,14);
  function mondPhase(t=Date.now()){
    const alter=(((t-NEUMOND)/864e5)%SYNODE+SYNODE)%SYNODE, phi=2*Math.PI*alter/SYNODE;
    return {phi,licht:(1-Math.cos(phi))/2};
  }
  function mond(x,y,stark,t){
    const {phi,licht}=mondPhase(t);
    if(licht<0.03) return "";
    const r=24, rx=(r*Math.abs(Math.cos(phi))).toFixed(2), zu=phi<Math.PI, sichel=Math.cos(phi)>0;
    const rand=zu?1:0, term=zu?(sichel?0:1):(sichel?1:0);
    const d=`M0,${-r} A${r},${r} 0 0 ${rand} 0,${r} A${rx},${r} 0 0 ${term} 0,${-r} Z`;
    const a=v=>(v*stark).toFixed(3), id="mh"+Math.round(phi*1000);
    const schein=stark*(0.3+0.7*licht);
    return hg(`background:${kreis(x,y,60,`rgba(190,205,225,${(.14*schein).toFixed(3)})`,`rgba(190,205,225,${(.04*schein).toFixed(3)})`,"45%")}`)+
      `<svg class="hg" style="width:100%;height:100%;overflow:visible"><svg x="${x}%" y="${y}%" overflow="visible">
        <defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs>
        <path d="${d}" fill="rgb(168,186,208)" fill-opacity="${a(.62)}"/>
        <g clip-path="url(#${id})" fill="rgb(92,112,138)">
          <circle cx="-5" cy="-6" r="7" fill-opacity="${a(.35)}"/><circle cx="6" cy="5" r="9" fill-opacity="${a(.28)}"/>
          <circle cx="-8" cy="9" r="5" fill-opacity="${a(.25)}"/></g></svg></svg>`;
  }

  function wuerfel(saat){ let z=saat>>>0;
    return ()=>{ z=(z+0x6D2B79F5)>>>0; let t=Math.imul(z^(z>>>15),1|z);
      t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

let h="";
for(const [n,tage] of [["Neumond +2",2],["Sichel zunehmend +4",4],["erstes Viertel +7,4",7.4],["zunehmend +11",11],["Vollmond +14,8",14.8],["abnehmend +19",19],["letztes Viertel +22,1",22.1],["Sichel abnehmend +26",26],["heute",null]]){
  const t=tage===null?Date.now():NEUMOND+tage*864e5+SYNODE*864e5*300;
  const p=mondPhase(t);
  h+=`<div>${n} · beleuchtet ${Math.round(p.licht*100)} %</div><div class="b">${mond(85,40,1,t)}</div>`;
}
document.getElementById("a").innerHTML=h;
</script>
