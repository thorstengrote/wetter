      ["Niederschlag",            `${n1(d.mm)}${NB}mm`],
      ["Niederschlagsstunden",    orDash(d.ph,v=>`${n0(v)}${NB}h`)],
      ["max. Regenrisiko",        pct(d.pp)],
      ["Regen / Schauer",         `${n1(d.rain)} / ${n1(d.showers)}${NB}mm`],
      ["Schneefall",              `${n1(d.snow)}${NB}cm`],
      ["Sonnenschein",            `${n1(d.sunh)} von ${n1(d.daylight)}${NB}h (${pct(ratio*100)})`],
      ["Sonnenaufgang",           d.sr||"–"],
      ["Sonnenuntergang",         d.ss||"–"],
      ["Strahlungssumme",         orDash(d.radsum,v=>`${n1(v)}${NB}MJ/m²`)],
      ["Tagesabschnitte",         (d.teile||[]).map(t=>`${t.key}: ${TAG_NAMEN[t.spec.sky]}`).join(" · ")||"–"],
      ["Wind höchstens",          `${n0(d.wmax)}${NB}km/h`],
      ["Böen höchstens",          `${n0(d.gmax)}${NB}km/h`],
      ["Windrichtung",            dirText(d.wdir)],
      ["UV-Index höchstens",      orDash(d.uv,n1)],
      ["Verdunstung",             orDash(d.et0,v=>`${n1(v)}${NB}mm`)],
      ["WMO-Code",               `${d.code} = ${wmoText(d.code)}`],
      ["Quelle",                  note]
    ],
    `${srcNote} · Tageswerte`,
    v?dayNarrative(v,d,false):null
  );
}

/* ---------- forecast ---------- */
/* Daily set is identical for both models so the day detail panel works the same
   for ICON days and for the trend days beyond day 7. */
const DAILY_VARS=
  "temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,"+
  "precipitation_probability_max,precipitation_sum,rain_sum,showers_sum,snowfall_sum,"+
  "precipitation_hours,weather_code,sunshine_duration,daylight_duration,sunrise,sunset,"+
  "shortwave_radiation_sum,et0_fao_evapotranspiration,wind_speed_10m_max,wind_gusts_10m_max,"+
  "wind_direction_10m_dominant";

const ICON_URL=
  `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
  `&models=icon_seamless`+
  `&current=temperature_2m,apparent_temperature,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m`+
  `&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,precipitation,`+
    `rain,showers,snowfall,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,`+
    `sunshine_duration,shortwave_radiation,terrestrial_radiation,global_tilted_irradiance,`+
    `relative_humidity_2m,dew_point_2m,`+
    `pressure_msl,visibility,wind_speed_10m,wind_gusts_10m,wind_direction_10m,wind_speed_80m,`+
    `cape,convective_inhibition,freezing_level_height,soil_temperature_0cm`+
  `&daily=${DAILY_VARS}`+
  /* Neigung und Ausrichtung der Module fuer global_tilted_irradiance. Aus der
     Messung vom 26.09.2026 geschaetzt, siehe SOLAR. */
  `&tilt=35&azimuth=-55`+
  `&forecast_days=7&timezone=Europe%2FBerlin`;

/* ICON carries no UV index, so the trend request supplies it for both panels.
   It also delivers the hourly series for days 8 to 14, which the day verdict
   needs in order to judge a day by its daylight hours instead of by a code
   that summarises all 24 hours. Full hourly series cost nothing extra:
   Open-Meteo weights a request by variable count and by spans beyond two
   weeks, not by the number of hours returned. */
const TREND_URL=
  `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
  `&models=best_match`+
  `&hourly=uv_index,temperature_2m,weather_code,precipitation,precipitation_probability,`+
    `cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,sunshine_duration,cape`+
  `&daily=${DAILY_VARS},uv_index_max`+
  `&forecast_days=14&timezone=Europe%2FBerlin`;

/*
  A day is judged by its waking hours, 05:00 to 23:00.

  Open-Meteo's daily weather_code reports the most severe weather of all 24
  hours, so 0.2 mm of drizzle at one in the morning turned a day with eight
  hours of sunshine into a rain day. The verdict below therefore ignores the
  daily code entirely and aggregates the hourly series over the window instead.
*/
const DAY_FROM=5, DAY_TO=22;          /* 05:00 up to and including 22:00 */
const WMO_STORM=[95,96,99];
const WMO_SNOW=[71,73,75,77,85,86];
const WMO_RAIN=[61,63,65,66,67,80,81,82];
const WMO_DRIZZLE=[51,53,55,56,57];
const WMO_FOG=[45,48];
const WET=[...WMO_DRIZZLE,...WMO_RAIN,...WMO_SNOW,...WMO_STORM];

/* hrs: one entry per hour of the day, {hour,code,precip,pop,cloud,sunSec,cape} */
function dayVerdict(hrs,daylightH){
  const win=hrs.filter(h=>h.hour>=DAY_FROM&&h.hour<=DAY_TO);
  const src=win.length?win:hrs;
  const v={
    hours:src,
    mm:0, wetHours:0, maxPop:0, sunH:0, maxCape:0,
    storm:false, snow:false, fog:false, cloudAvg:0
  };
  if(!src.length) return {...v,icon:"cloud",text:"keine Stundendaten",ratio:0};

  for(const h of src){
    const c=Number(h.code||0);
    v.mm+=Number(h.precip||0);
    if(Number(h.precip||0)>=0.1||WET.includes(c)) v.wetHours++;
    v.maxPop=Math.max(v.maxPop,Number(h.pop||0));
    v.sunH+=Number(h.sunSec||0)/3600;
    v.maxCape=Math.max(v.maxCape,Number(h.cape||0));
    v.cloudAvg+=wolkenWirkung(h);
    if(WMO_STORM.includes(c)) v.storm=true;
    if(WMO_SNOW.includes(c)) v.snow=true;
    if(WMO_FOG.includes(c)) v.fog=true;
  }
  v.cloudAvg/=src.length;
  /* sunshine is only possible while it is light, so the daylight span is the
     honest denominator */
  v.ratio=daylightH>0?Math.min(1,v.sunH/daylightH):0;

  /*
    Der Himmel entscheidet, der Niederschlag kommt dazu.

    Frueher gewann genau eine von neun Regeln, und Niederschlag stand in
    derselben Reihe wie Sonne und Wolken. Dadurch loeschte ein einzelner
    Regentropfen die gesamte Himmelsinformation: ein sonniger Tag mit einem
    Schauer am Nachmittag sah aus wie Dauerregen. Jetzt sind es zwei Achsen,
    die sich nicht gegenseitig verdraengen.
  */
  if(v.fog&&v.ratio<0.1){
    v.icon="fog"; v.text="trüb und neblig"; v.spec={fog:true}; v.sky=4; v.wet="";
  }else{
    const stufe=himmelStufe(v.ratio,v.cloudAvg);
    const art=nassArt(v.mm,v.wetHours,v.snow);
    v.sky=(art||v.storm)?Math.max(stufe,1):stufe;
    v.wet=art;
    v.spec={sky:v.sky,wet:art,storm:v.storm};
    v.text=TAG_NAMEN[v.sky]+(v.storm?" mit Gewitterneigung":(NASS_TEXT[art]||""));
    v.icon=nassName(art,v.storm)||(v.sky<=1?"clear":v.sky<=3?"partly":"cloud");
  }
  return v;
}

/* group the hours of a day into the parts of day people actually name */
const PARTS=[
  {key:"Morgen",     adv:"morgens",     from:5,  to:9},
  {key:"Vormittag",  adv:"vormittags",  from:10, to:12},
  {key:"Nachmittag", adv:"nachmittags", from:13, to:17},
  {key:"Abend",      adv:"abends",      from:18, to:22}
];

function partSummary(hrs,part){
  const win=hrs.filter(h=>h.hour>=part.from&&h.hour<=part.to);
  if(!win.length) return null;
  let mm=0,sun=0,cloud=0,wet=0;
  for(const h of win){
    mm+=Number(h.precip||0);
    sun+=Number(h.sunSec||0)/3600;
    cloud+=Number(h.cloud||0);
    if(Number(h.precip||0)>=0.1||WET.includes(Number(h.code||0))) wet++;
  }
  cloud/=win.length;
  const possible=win.filter(h=>h.isDay!==false).length||win.length;
  const sunFrac=possible>0?sun/possible:0;
  let sky;
  if(wet>=2||mm>=0.5) sky="nass";
  else if(sunFrac>=0.55) sky="sonnig";
  else if(sunFrac>=0.25) sky="wechselnd";
  else sky="bewölkt";
  return {...part,mm,sun,cloud,wet,sunFrac,sky,hours:win};
}

/* find the contiguous stretches in which precipitation is expected */
function wetSpans(hrs){
  const spans=[]; let cur=null;
  for(const h of hrs){
    const isWet=Number(h.precip||0)>=0.1||WET.includes(Number(h.code||0));
    if(isWet){
      if(!cur) cur={from:h.hour,to:h.hour,mm:0};
      cur.to=h.hour; cur.mm+=Number(h.precip||0);
    }else if(cur){ spans.push(cur); cur=null; }
  }
  if(cur) spans.push(cur);
  return spans;
}

/*
  Build the running text for one day. It is written from the hourly series of
  this location rather than fetched: DWD does publish regional forecast texts
  on opendata.dwd.de, but they cover all of North Rhine-Westphalia and are
  served without CORS headers, so a browser cannot read them.
*/
function dayNarrative(v,info,isToday){
  const parts=PARTS.map(p=>partSummary(v.hours,p)).filter(Boolean);
  const out=[];

  const span=`${Math.round(info.minT)} bis ${Math.round(info.maxT)}${NB}°C`;
  out.push(`${v.text.charAt(0).toUpperCase()+v.text.slice(1)} bei ${span}.`);

  /* only describe the course of the day when the parts actually differ */
  const skies=parts.map(p=>p.sky);
  if(new Set(skies).size>1){
    const chunks=[];
    let i=0;
    while(i<parts.length){
      let j=i;
      while(j+1<parts.length&&parts[j+1].sky===parts[i].sky) j++;
      const label=i===j?parts[i].adv:`${parts[i].adv} bis ${parts[j].adv}`;
      const word={nass:"nass",sonnig:"sonnig",wechselnd:"wechselnd bewölkt",bewölkt:"bewölkt"}[parts[i].sky];
      chunks.push(`${label} ${word}`);
      i=j+1;
    }
    const line=chunks.join(", ");
    out.push(line.charAt(0).toUpperCase()+line.slice(1)+".");
  }

  const spans=wetSpans(v.hours);
  if(!spans.length){
    out.push("Tagsüber trocken.");
  }else{
    const what=v.snow?"Schnee":"Regen";
    const txt=spans.map(sp=>sp.from===sp.to
      ? `gegen ${sp.from} Uhr`
      : `von ${sp.from} bis ${sp.to+1} Uhr`);
    out.push(`${what} ${txt.join(" und ")}, zusammen ${n1(v.mm)}${NB}mm.`);
  }

  if(v.maxCape>=1000) out.push("Gewitter sind wahrscheinlich.");
  else if(v.maxCape>=300) out.push("Einzelne Gewitter sind möglich.");

  const gust=Math.round(info.gmax||0), wind=Math.round(info.wmax||0);
  if(wind>0||gust>0){
    const dir=info.wdir!=null?` aus ${dirText(info.wdir).split(" ")[1]}`:"";
    out.push(gust>=45
      ? `Kräftiger Wind${dir} um ${wind}${NB}km/h mit Böen bis ${gust}${NB}km/h.`
      : `Wind${dir} um ${wind}${NB}km/h, Böen bis ${gust}${NB}km/h.`);
  }

  if(info.sr&&info.ss)
    out.push(`Sonnenaufgang ${info.sr}, Sonnenuntergang ${info.ss}, `+
             `${n1(v.sunH)} von ${n1(info.daylight)} Stunden mit Sonne.`);

  if(info.uv!=null&&info.uv>=6) out.push(`UV-Index bis ${n1(info.uv)}, Sonnenschutz sinnvoll.`);

  return out.join(" ");
}

/* pull one day out of an hourly series, in the shape dayVerdict expects */
/*
  Himmelsstufe eines Tages oder Tagesabschnitts.

  Sonne und Bewoelkung werden gewichtet zusammengefasst, statt nacheinander
  abgefragt. Die alte Kette hatte eine Klippe: oberhalb von 85 Prozent
  Bewoelkung kam der Sonnenanteil gar nicht mehr vor, dadurch landete ein Tag
  mit 87 Prozent Sonne bei "bedeckt", waehrend der Nachbartag mit 93 Prozent
  den Mix bekam. sunshine_duration zaehlt jede Stunde mit ueber 120 W/m2
  direkter Strahlung, und das schafft die Sonne auch durch duenne hohe
  Bewoelkung, deshalb darf keine der beiden Groessen allein entscheiden.
*/
const TAG_GEWICHT=0.6;
const TAG_SCHWELLEN=[0.85,0.68,0.45,0.22];
const TAG_NAMEN=["sonnig","überwiegend sonnig","wechselnd","überwiegend bewölkt","bedeckt"];
const NASS_TEXT={niesel:" mit etwas Regen",regen:" mit Regen",viel:" mit viel Regen",
                 schnee:" mit Schnee","schnee-viel":" mit viel Schnee"};

const himmelWert=(ratio,cloud)=>TAG_GEWICHT*ratio+(1-TAG_GEWICHT)*(1-cloud/100);
function himmelStufe(ratio,cloud){
  const w=himmelWert(ratio,cloud);
  for(let i=0;i<4;i++) if(w>=TAG_SCHWELLEN[i]) return i;
  return 4;
}
/* Nachts gibt es keinen Sonnenanteil, dort entscheidet die Bewoelkung allein. */
const wolkenStufe=c=>c<15?0:c<40?1:c<65?2:c<88?3:4;
function nassArt(mm,nasseStunden,schnee){
  if(schnee) return mm>=3?"schnee-viel":"schnee";
  if(mm>=5) return "viel";
  if(mm>=1.5) return "regen";
  if(mm>=0.4||nasseStunden>=3) return "niesel";
  return "";
}
function nassName(nass,blitz){
  if(blitz) return "storm";
  if(!nass) return "";
  if(nass.startsWith("schnee")) return "snow";
  return nass==="niesel"?"drizzle":"rain";
}

/* Drei Abschnitte, aus denen die Tageskachel ihre drei Symbole bekommt. */
const TAGESTEILE=[
  {key:"Vormittag",  von:6,  bis:11},
  {key:"Nachmittag", von:12, bis:17},
  {key:"Abend",      von:18, bis:23}
];
function teilUrteil(hrs,teil,srH,ssH){
  const win=hrs.filter(h=>h.hour>=teil.von&&h.hour<=teil.bis);
  if(!win.length) return null;
  let mm=0,sun=0,cloud=0,nass=0,schnee=false,blitz=false,hell=0;
  for(const h of win){
    const c=Number(h.code||0), m=Number(h.precip||0);
    mm+=m; sun+=Number(h.sunSec||0)/3600; cloud+=wolkenWirkung(h);
    if(m>=0.1||WET.includes(c)) nass++;
    if(WMO_SNOW.includes(c)) schnee=true;
    if(WMO_STORM.includes(c)) blitz=true;
    const mitte=h.hour+0.5;
    if(!(srH>=0&&ssH>=0)||(mitte>=srH&&mitte<=ssH)) hell++;
  }
  cloud/=win.length;
  const nacht=hell===0;
  const ratio=hell>0?Math.min(1,sun/hell):0;
  const stufe=nacht?wolkenStufe(cloud):himmelStufe(ratio,cloud);
  const art=nassArt(mm,nass,schnee);
  return {...teil,mm,cloud,ratio,nacht,
          spec:{sky:(art||blitz)?Math.max(stufe,1):stufe,wet:art,storm:blitz,night:nacht}};
}

/*
  Tief der Nacht, die an diesem Abend beginnt.

  temperature_2m_min gilt fuer den Kalendertag ab Mitternacht und stammt damit
  fast immer aus den Stunden vor dem Aufstehen, gehoert also zur Nacht davor.
  Wer abends auf die Wand schaut, will wissen, wie kalt es gleich wird.
  Gerechnet wird deshalb von Sonnenuntergang bis Sonnenaufgang am naechsten
  Morgen. Fehlt der Morgen danach, weil die Reihe endet, bleibt es beim
  Kalendertief.
*/
function nachtTief(H,tagIso,ssH,naechsterTagIso,naechstesSrH,rueckfall){
  if(!H||!H.time||!(ssH>=0)) return {wert:rueckfall,echt:false};
  let min=null;
  for(let k=0;k<H.time.length;k++){
    const t=H.time[k], tag=t.slice(0,10), std=Number(t.slice(11,13));
    const v=H.temperature_2m?.[k];
    if(v==null) continue;
    const drin = (tag===tagIso && std>=Math.floor(ssH))
              || (naechsterTagIso && tag===naechsterTagIso && std<=Math.ceil(naechstesSrH>=0?naechstesSrH:7));
    if(drin && (min===null||v<min)) min=v;
  }
  if(min===null) return {wert:rueckfall,echt:false};
  return {wert:min,echt:true};
}

function hoursOfDay(H,dayIso){
  const out=[];
  if(!H||!H.time) return out;
  for(let k=0;k<H.time.length;k++){
    if(H.time[k].slice(0,10)!==dayIso) continue;
    /* Summen und Code aus dem naechsten Zeitstempel, siehe blockAt. Sonst
       stand "Regen von 14 bis 16 Uhr" fuer Regen, der von 13 bis 15 fiel. */
    const n=Math.min(k+1,H.time.length-1);
    out.push({
      hour:Number(H.time[k].slice(11,13)),
      code:H.weather_code?.[n],
      precip:H.precipitation?.[n],
      pop:H.precipitation_probability?.[n],
      cloud:H.cloud_cover?.[k],
      low:H.cloud_cover_low?.[k], mid:H.cloud_cover_mid?.[k], high:H.cloud_cover_high?.[k],
      sunSec:H.sunshine_duration?.[n],
      temp:H.temperature_2m?.[k],
      cape:H.cape?.[k]
    });
  }
  return out;
}

function renderDays(icon,trend,uvDay){
  days.innerHTML="";
  for(const k of Object.keys(dayCache)) delete dayCache[k];
  const src=[];
  for(let i=0;i<7;i++){
    if(icon.daily.temperature_2m_max[i]==null) break;
    src.push({d:icon.daily,i,trend:false});
  }
  if(trend){
    const off=trend.daily.time.indexOf(icon.daily.time[0]);
    const base=off<0?0:off;
    for(let i=src.length;i<14;i++){
      const j=base+i;
      if(j>=trend.daily.time.length||trend.daily.temperature_2m_max[j]==null) break;
      src.push({d:trend.daily,i:j,trend:true});
    }
  }

  src.forEach((s,pos)=>{
    const d=s.d,i=s.i;
    const info={
      maxT:d.temperature_2m_max[i], minT:d.temperature_2m_min[i],
      appMax:d.apparent_temperature_max?.[i], appMin:d.apparent_temperature_min?.[i],
      sunh:Number(d.sunshine_duration?.[i]||0)/3600,
      daylight:Number(d.daylight_duration?.[i]||0)/3600,
      mm:Number(d.precipitation_sum?.[i]||0),
      pp:Number(d.precipitation_probability_max?.[i]||0),
      rain:Number(d.rain_sum?.[i]||0), showers:Number(d.showers_sum?.[i]||0),
      snow:Number(d.snowfall_sum?.[i]||0), ph:d.precipitation_hours?.[i],
      sr:(d.sunrise?.[i]||"").slice(11,16), ss:(d.sunset?.[i]||"").slice(11,16),
      radsum:d.shortwave_radiation_sum?.[i], et0:d.et0_fao_evapotranspiration?.[i],
      wmax:d.wind_speed_10m_max?.[i]??0, gmax:d.wind_gusts_10m_max?.[i]??0,
      wdir:d.wind_direction_10m_dominant?.[i],
      uv:(uvDay||{})[d.time[i]],
      code:d.weather_code?.[i]??0
    };

    /* judge the day from its own hourly series, 05:00 to 23:00 */
    const H=s.trend?trend?.hourly:icon.hourly;
    const hrs=hoursOfDay(H,d.time[i]);
    const v=dayVerdict(hrs,info.daylight);
    info.verdict=v;
    info.day=d.time[i];

    const stunde=t=>{ const m=/T(\d\d):(\d\d)/.exec(t||""); return m?Number(m[1])+Number(m[2])/60:-1; };
    const srH=stunde(d.sunrise?.[i]), ssH=stunde(d.sunset?.[i]);
    info.teile=TAGESTEILE.map(t=>teilUrteil(hrs,t,srH,ssH)).filter(Boolean);

    /* Tief der kommenden Nacht statt des Kalendertiefs, siehe nachtTief() */
    const naechster=d.time[i+1]||null;
    const nt=nachtTief(H,d.time[i],ssH,naechster,stunde(d.sunrise?.[i+1]),info.minT);
    info.nachtT=nt.wert; info.nachtEcht=nt.echt;

    const e=document.createElement("div");
    e.className="day"+(s.trend?" trend":"");
    /* Wind und Frost gehoeren an das mittlere der drei Symbole, damit sie
       einmal je Kachel erscheinen und nicht dreimal. */
    const beigaben={wind:windLevel(info.wmax,info.gmax),frost:frostLevel(info.nachtT)};
    const symbole = info.teile.length===3
      ? `<div class=teile>`+info.teile.map((t,k)=>
          `<div class=teil>${weatherIcon(k===1?{...t.spec,...beigaben}:t.spec)}</div>`).join("")+`</div>`
      : weatherIcon({...v.spec,...beigaben});

    e.innerHTML=
      `<div class=name>${pos===0?"Heute":dow(d.time[i])}</div>`+
      `<div class=icon>${symbole}</div>`+
      `<div class=temps>${tempSpan(info.maxT)}<span class=slash>/</span>${tempSpan(info.nachtT)}</div>`+
      werteBlock([
        ["drop",pct(info.pp),info.pp>=10?"rain":""],
        ["sun",`${n1(info.sunh)}${NB}h`,info.sunh>=1?"sun":""],
        ["sock",windText(info.wmax,info.gmax),windSignificant(info.wmax,info.gmax)?"wind":""]
      ]);

    const label=pos===0
      ? "Heute, "+new Date(d.time[i]+"T12:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})
      : new Date(d.time[i]+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit"});
    const note=s.trend?"Modellmix, Trend ab Tag 8":"DWD ICON";
    e.addEventListener("click",()=>dayDetail(label,info,note));
    dayCache[d.time[i]]={label,info,note};
    days.appendChild(e);
  });
}

/* ===================================================================
   Der Himmel hinter der Kopfzeile

   Nach dem Vorbild WetterOnline, am 27.09.2026 an vier Bildschirmfotos
   gemessen: helles, kraeftiges Blau, vor und nach Sonnenaufgang ein warmer
   Khaki-Dunst am Horizont, die Sonne als weisser weicher Fleck oben rechts,
   weiche Wolken auch hinter der Schrift. Alle Schrift ist weiss, und nur
   deshalb vertraegt der Himmel diese Helligkeit.

   Lesbarkeit, gemessen hinter jeder Zeile am gerenderten Bild: die hellen
   Himmel liegen bei 3,0 bis 4,0 zu 1, Regen, Gewitter und Nacht bei 5 bis
   10. WetterOnline selbst liegt bei 3,3 bis 5,3, ueber Wolken bei 2,6. Die
   unteren Stufen der hellen Paletten sind etwas dunkler als auf dem Handy,
   weil unten links die kleinste Zeile sitzt, das Datum.

   Gerechnet wird nur, wenn sich etwas geaendert hat, also hoechstens alle
   zehn Minuten. Die Wolken entstehen in einer kleinen Leinwand von 427 auf
   56 Punkten, das sind 24 000 Punkte und auf dem Tablet ein paar
   Millisekunden.
   =================================================================== */
const HIMMEL=(()=>{
  const PAL={
    vorAufgang: ["#4a6c90","#577a90","#718680","#7e8462"],
    nachAufgang:["#447cb1","#5b8bb0","#6c8a94","#737e70"],
    mittag:     ["#3b75ab","#427eb7","#5286b5","#5d88aa"],
    zirren:     ["#4a7fb3","#5988b2","#6589a6","#6a869c"],
    abend:      ["#3d6a9a","#627f9c","#7e7f7a","#8c785c"],
    nacht:      ["#16284a","#1d3254","#253d61","#2d476b"],
    bedeckt:    ["#5a6a7b","#667585","#707e8c","#798592"],
    regen:      ["#465565","#4f5e6e","#586676","#606d7b"],
    gewitter:   ["#2d3744","#35404e","#3f4a58","#485361"],
    nebel:      ["#5a636d","#636c75","#6b737b","#71787f"],
    schnee:     ["#5a6878","#627080","#67737f","#6c7784"]
  };
  const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const hx=v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0");
  const mische=(a,b,t)=>{ const A=rgb(a),B=rgb(b), k=Math.max(0,Math.min(1,t));
    return "#"+A.map((v,i)=>hx(v+(B[i]-v)*k)).join(""); };
  const mischeP=(p,q,t)=>p.map((f,i)=>mische(f,q[i],t));

  /* Tagesgang nach Sonnenhoehe, getrennt nach Morgen und Abend. Dazwischen
     wird gemischt, damit es keine Spruenge gibt, wenn eine Schwelle faellt. */
  const MORGEN=[[-12,PAL.nacht],[-3,PAL.vorAufgang],[4,PAL.nachAufgang],[18,PAL.mittag]];
  /* Abends nach dem WetterOnline-Foto vom 27.09.2026 19:38, Sonne -3,3 Grad:
     oben tiefblau, zum Horizont olivgelb. Entwurf entwurf-abend.html, Variante A. */
  const A_UNTERGANG=["#2c5585","#56748c","#7c7c6c","#8a7a50"];
  const A_BLAU     =["#163c62","#34566d","#5a6f66","#686f48"];
  const A_NAUTISCH =["#12294a","#1c3957","#2c4a5b","#3b5350"];
  const ABEND =[[-12,PAL.nacht],[-7,A_NAUTISCH],[-3.5,A_BLAU],[-0.8,A_UNTERGANG],[4,PAL.abend],[18,PAL.mittag]];
  function tagesgang(elev,morgens){
    const k=morgens?MORGEN:ABEND;
    if(elev<=k[0][0]) return k[0][1];
    for(let i=1;i<k.length;i++) if(elev<=k[i][0])
      return mischeP(k[i-1][1],k[i][1],(elev-k[i-1][0])/(k[i][0]-k[i-1][0]));
    return k[k.length-1][1];
  }

  const verlauf=p=>`linear-gradient(180deg,${p[0]} 0%,${p[1]} 35%,${p[2]} 70%,${p[3]} 100%)`;
  const hg=css=>`<div class="hg" style="${css}"></div>`;
  const kreis=(x,y,r,innen,aussen,mitte="60%")=>
    `radial-gradient(circle ${r}px at ${x}% ${y}%,${innen},${aussen} ${mitte},transparent 100%)`;

  /* Sonne und Mond stehen oben rechts, wie bei WetterOnline, und nicht dort,
     wo sie wirklich stehen. Im Tagesbereich lag der Fleck auf der Zeile mit
     den Sonnenstunden. Oben rechts stehen nur die kurzen Abendbalken. */
  const SX=95.5, SY=11;
  function sonne(x,y,stark){
    const f=a=>`rgba(255,255,255,${(a*stark).toFixed(3)})`;
    const flecke=[[0.22,5,.34],[0.36,3,.28],[0.50,6,.20]]
      .map(([t,r,a])=>kreis(x-t*7,y+t*70,r,f(a),f(a*0.4),"50%")).join(",");
    return hg(`background:${kreis(x,y,20,f(.97),f(.80),"45%")},
      ${kreis(x,y,58,f(.55),f(.20),"40%")},${kreis(x,y,150,f(.28),f(.08),"45%")},${flecke}`);
  }
  /* Mondphase aus dem Datum: Alter seit dem Neumond vom 6.1.2000 18:14 UTC,
     synodischer Monat 29,53 Tage. Genau auf etwa einen halben Tag, fuer das
     Bild reicht das. Zunehmend ist rechts hell, abnehmend links. */
  const SYNODE=29.530588853, NEUMOND=Date.UTC(2000,0,6,18,14);
  function mondPhase(t=Date.now()){
    const alter=(((t-NEUMOND)/864e5)%SYNODE+SYNODE)%SYNODE, phi=2*Math.PI*alter/SYNODE;
    return {phi,licht:(1-Math.cos(phi))/2};
  }
  function mond(x,y,stark){
    const {phi,licht}=mondPhase();
    if(licht<0.03) return "";
    const r=24, rx=(r*Math.abs(Math.cos(phi))).toFixed(2), zu=phi<Math.PI, sichel=Math.cos(phi)>0;
    const rand=zu?1:0, term=zu?(sichel?0:1):(sichel?1:0);
    const d=`M0,${-r} A${r},${r} 0 0 ${rand} 0,${r} A${rx},${r} 0 0 ${term} 0,${-r} Z`;
    const a=v=>(v*stark).toFixed(3), id="mh"+Math.round(phi*1000);
    const schein=stark*(0.3+0.7*licht);
    return hg(`background:${kreis(x,y,60,`rgba(190,205,225,${(.14*schein).toFixed(3)})`,`rgba(190,205,225,${(.04*schein).toFixed(3)})`,"45%")}`)+
      `<svg class="hg" style="width:100%;height:100%;overflow:visible"><svg x="${x}%" y="${y}%" overflow="visible">
        <defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs>
        <path d="${d}" fill="rgb(168,186,208)" fill-opacity="${a(.62)}"/>
        <g clip-path="url(#${id})" fill="rgb(92,112,138)">
          <circle cx="-5" cy="-6" r="7" fill-opacity="${a(.35)}"/><circle cx="6" cy="5" r="9" fill-opacity="${a(.28)}"/>
          <circle cx="-8" cy="9" r="5" fill-opacity="${a(.25)}"/></g></svg></svg>`;
  }

  function wuerfel(saat){ let z=saat>>>0;
    return ()=>{ z=(z+0x6D2B79F5)>>>0; let t=Math.imul(z^(z>>>15),1|z);
      t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  function sterne(n,saat,hoch,hell){
    const w=wuerfel(saat); let s="";
    for(let i=0;i<n;i++) s+=`<circle cx="${(w()*100).toFixed(1)}%" cy="${(w()*hoch).toFixed(1)}%"
      r="${(0.5+w()*0.9).toFixed(2)}" fill="#fff" opacity="${(0.15+w()*hell).toFixed(2)}"/>`;
    return `<svg class="hg">${s}</svg>`;
  }
  function rausch(saat){
    const h=(x,y)=>{ let v=(x*374761393+y*668265263+saat*1442695041)|0;
      v=Math.imul(v^(v>>>13),1274126177); return ((v^(v>>>16))>>>0)/4294967296; };
    const g=t=>t*t*(3-2*t);
    return (x,y)=>{ const xi=Math.floor(x),yi=Math.floor(y),u=g(x-xi),v=g(y-yi);
      const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);
      return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v; };
  }
  function fbm(n,x,y,okt=5){ let s=0,a=.5,f=1,t=0;
    for(let i=0;i<okt;i++){ s+=a*n(x*f,y*f); t+=a; a*=.5; f*=2.03; } return s/t; }
  /* art: "haufen" Quellwolken, "decke" geschlossen, "faden" Zirren oder Nebel */
  function wolken(art,deckung,saat,{hell=[255,255,255],dunkel=[196,206,218],max=.48}={}){
    const W=427,H=56, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    const ctx=cv.getContext("2d"), img=ctx.createImageData(W,H), n=rausch(saat), n2=rausch(saat+7);
    const sx=art==="faden"?150:art==="decke"?70:58, sy=art==="faden"?9:art==="decke"?26:24;
    const schwelle=art==="decke"?0.30:0.70-0.44*deckung/100;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      let d=fbm(n,x/sx,y/sy+(art==="faden"?x/400:0));
      if(art==="faden") d=d*0.75+0.25*fbm(n2,x/40,y/5,3);
      const t=Math.max(0,Math.min(1,(d-schwelle)/0.16)), dichte=t*t*(3-2*t);
      /* dicke Stellen grauer, wie die Unterseite einer Quellwolke */
      const k=Math.min(1,dichte*dichte*(art==="decke"?1:0.8)), o=(y*W+x)*4;
      for(let c=0;c<3;c++) img.data[o+c]=hell[c]+(dunkel[c]-hell[c])*k;
      img.data[o+3]=255*max*dichte;
    }
    ctx.putImageData(img,0,0);
    return hg(`background:url(${cv.toDataURL()}) 0 0/100% 100%;filter:blur(1.2px)`);
  }
  function striche(n,saat){
    const w=wuerfel(saat); let s="";
    for(let i=0;i<n;i++){ const x=w()*1300-10, y=w()*70, l=12+w()*18;
      s+=`<line x1="${x.toFixed(0)}" y1="${y.toFixed(1)}" x2="${(x-l*0.2).toFixed(0)}" y2="${(y+l).toFixed(1)}"
        stroke="#fff" stroke-width="${(0.6+w()*0.5).toFixed(2)}" stroke-opacity="${(0.08+w()*0.16).toFixed(2)}"/>`; }
    return `<svg class="hg" viewBox="0 0 1280 100" preserveAspectRatio="none">${s}</svg>`;
  }
  function flocken(n,saat){
    const w=wuerfel(saat); let s="";
    for(let i=0;i<n;i++) s+=`<circle cx="${(w()*100).toFixed(1)}%" cy="${(w()*100).toFixed(1)}%"
      r="${(0.8+w()*1.2).toFixed(2)}" fill="#fff" opacity="${(0.25+w()*0.45).toFixed(2)}"/>`;
    return `<svg class="hg">${s}</svg>`;
  }

  /* ---- aus den Werten dieser Stunde ein Bild ------------------- */
  function bild(w){
    const elev=Number(w.elev||0), mm=Math.max(0,Number(w.mm||0));
    const haufen=Math.max(0,Math.min(100,Number(w.haufen??w.deckung??0)));
    const schleier=Math.max(0,Math.min(100,Number(w.schleier||0)));
    const std=new Date().getHours(), morgens=std<13;
    /* Das Muster der Wolken wechselt jede Stunde, damit nicht jeden Tag
       dieselben Wolken an derselben Stelle stehen. */
    const saat=new Date().getDate()*31+std;
    const tag=elev>-1, nacht=elev<-6;

    let p=tagesgang(elev,morgens);
    if(tag&&schleier>=25) p=mischeP(p,PAL.zirren,0.6*schleier/100);
    p=mischeP(p,nacht?mischeP(PAL.bedeckt,PAL.nacht,0.6):PAL.bedeckt,Math.pow(haufen/100,1.4));
    if(w.nebel) p=PAL.nebel;
    if(w.schnee) p=mischeP(p,PAL.schnee,0.9);
    else if(w.gewitter) p=mischeP(p,PAL.gewitter,0.85);
    else if(mm>0.05) p=mischeP(p,PAL.regen,Math.min(1,mm/3));

    letzteLeise=leiseFarbe(p[2]);
    let html=hg(`background:${verlauf(p)}`);
    const offen=!w.nebel&&mm<=0.05&&!w.gewitter;
    /* Sterne und Mond nur, wo der Himmel frei ist */
    if(offen&&elev<-2&&haufen<60){
      if(elev<-6) html+=sterne(Math.round(110*(1-haufen/60)),17,90,.55);
      else html+=sterne(Math.round(34*(1-haufen/60)),5,55,.35);
    }
    /* Der Mond bleibt, bis die Sonne da ist, wie auf dem Foto von 07:23 */
    if(offen&&!tag&&haufen<70) html+=mond(SX,SY,1-haufen/100);
    /* Die Sonne steht abends und morgens etwas tiefer, verschwindet aber nie
       hinter den Horizont des Banners. */
    if(offen&&tag&&haufen<85){
      const y=SY+Math.max(0,Math.min(30,(12-elev)*2));
      html+=sonne(SX,y,Math.pow(1-haufen/100,0.8)*(schleier>=25?0.9:1));
      if(!morgens&&elev<10) html+=hg(`background:${kreis(SX,y+10,260,"rgba(255,214,150,.26)","rgba(255,200,130,.07)","45%")}`);
    }
    if(w.gewitter) html+=hg(`background:${kreis(62,20,230,"rgba(236,226,255,.40)","rgba(200,190,240,.12)","40%")}`);

    /* Wolken: Zirren als Faeden, Quellwolken als Haufen, ab 78 Prozent eine
       geschlossene Decke. Nachts sind Wolken dunkel und nicht weiss. */
    if(w.nebel){
      html+=wolken("faden",100,saat,{hell:[196,202,208],dunkel:[166,174,182],max:.28});
    }else if(haufen>=78||mm>0.05||w.gewitter||w.schnee){
      const farbe = w.gewitter?{hell:[120,130,146],dunkel:[70,80,96],max:.6}
                  : mm>0.05   ?{hell:[150,160,172],dunkel:[96,108,122],max:.55}
                  : nacht     ?{hell:[64,78,100],dunkel:[44,56,76],max:.55}
                  :            {hell:[176,186,198],dunkel:[120,132,146],max:.55};
      html+=wolken("decke",100,saat,farbe);
    }else if(haufen>=12){
      html+=wolken("haufen",haufen,saat,nacht?{hell:[74,90,114],dunkel:[52,64,86],max:.5}:{max:.48});
    }
    if(tag&&schleier>=25&&haufen<78&&!w.nebel) html+=wolken("faden",schleier,saat+3,{max:.18});
    if(mm>0.05&&!w.schnee) html+=striche(Math.round(Math.min(150,30*Math.pow(mm,0.7))),saat);
    if(w.schnee) html+=flocken(Math.round(Math.min(70,20+14*mm)),saat);
    return html;
  }

  /* Leise Farbe fuer Nebenschrift auf dem Himmel, etwa Pfeile und Zahlen im
     Solarblock und "morgen". Ein festes Grau hat nachts 3,7 zu 1 und mittags
     1,3 zu 1, also mal zu laut und mal unsichtbar. Stattdessen der Farbton
     des Himmels an der Stelle des Blocks, der 70-Prozent-Stufe, zum Weiss hin
     aufgehellt bis genau 2,2 zu 1. So wirkt sie ueberall gleich leise. */
  const LEISE=2.2;
  const kn=c=>{c/=255; return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4);};
  const lumH=h=>{const [r,g,b]=rgb(h).map(kn); return .2126*r+.7152*g+.0722*b;};
  const kontr=(a,b)=>{const x=Math.max(lumH(a),lumH(b)),y=Math.min(lumH(a),lumH(b)); return (x+.05)/(y+.05);};
  function leiseFarbe(grund){
    const g=rgb(grund); let lo=0,hi=1;
    for(let i=0;i<22;i++){ const m=(lo+hi)/2;
      if(kontr("#"+g.map(v=>hx(v+(255-v)*m)).join(""),grund)<LEISE) lo=m; else hi=m; }
    return "#"+g.map(v=>hx(v+(255-v)*hi)).join("");
  }
  let letzteLeise="#8b97a6";

  let letzte="";
  function setze(w){
    const kopf=document.getElementById("kopf");
    if(!kopf) return;
    const schluessel=JSON.stringify({...w,std:new Date().getHours()});
    if(schluessel===letzte) return;     /* nichts hat sich geaendert */
    letzte=schluessel;
    let halter=kopf.querySelector(".himmelhalter");
    if(!halter){
      halter=document.createElement("div");
      halter.className="himmelhalter";
      kopf.insertBefore(halter,kopf.firstChild);
    }
    halter.innerHTML=bild(w);
    kopf.style.setProperty("--leise",letzteLeise);
    kopf.classList.add("himmel");
  }
  return {setze};
})();

/* ===================================================================
   Velux

   Die Rollladen haengen an einem Velux-Gateway, das HomeKit spricht. Auf
   dem Tablet haelt hapwatch die verschluesselte Sitzung offen, hoert auf
   jede Bewegung und nimmt Fahrbefehle entgegen. wandsolar reicht /velux/
   an hapwatch durch, damit diese Seite denselben Ursprung behaelt.

   Ohne hapwatch bleibt der Knopf einfach verborgen. Am Rechner ist das der
   Normalfall.
   =================================================================== */
const VELUX=(()=>{
  /* Zeichnung. Ein fester Kasten, der Panzer faellt von oben herein. */
  const VB="0 0 22 24";
  const OEF={x:2.4,y:3.0,b:17.2,h:18.6};
  const LUFT="#8FD0FF";
  const F_AUF="#3ddc97", F_LUEFT="#ffd166", F_ZU="#9fb0c4";

  /* Der gezeichnete Panzer folgt der Stellung, laesst aber bei jeder
     Zwischenstellung mindestens sechs Einheiten Spalt. Bei Position 22
     waeren es gut vier, darin ist kein Wind mehr zu erkennen. */
  const zuAus=p=>p<=0?OEF.h:Math.min(OEF.h*(100-p)/100,OEF.h-6.0);

  /* Ein Keil: hinten schmal, vorne breit, vorne eine Spitze. Die Verjuengung
     ist der ganze Tiefeneindruck. Gleich dicke Striche wirken immer flach,
     egal wohin sie zeigen. */
  function keil(x0,y0,x1,y1,w0,w1,kopf){
    const dx=x1-x0, dy=y1-y0, n=Math.hypot(dx,dy);
    const ux=dx/n, uy=dy/n, px=-uy, py=ux;
    const P=(x,y)=>x.toFixed(2)+" "+y.toFixed(2);
    const sx=x1-ux*kopf, sy=y1-uy*kopf;
    return `<path d="M${P(x0+px*w0,y0+py*w0)}L${P(sx+px*w1,sy+py*w1)}`+
           `L${P(sx+px*w1*1.8,sy+py*w1*1.8)}L${P(x1,y1)}`+
           `L${P(sx-px*w1*1.8,sy-py*w1*1.8)}L${P(sx-px*w1,sy-py*w1)}`+
           `L${P(x0-px*w0,y0-py*w0)}Z"/>`;
  }

  /* Die Luft tritt hinter dem Fenster in den Schlitz und kommt nach vorne
     heraus. Im Bild heisst das: die Strahlen beginnen klein und tief im
     Schlitz, werden nach vorne breiter und laufen ueber die untere
     Rahmenecke hinaus. Seitliche Striche gleicher Staerke koennen das
     nicht zeigen, die bleiben immer in der Flaeche des Fensters. */
  function wind(zu){
    const spalt=OEF.h-zu;
    if(zu<OEF.h*0.3||spalt<2.6) return "";
    const m=OEF.y+zu+spalt/2;
    return `<g fill="${LUFT}">
      ${keil(12.8,m-1.0, 1.2,23.2, 0.20,0.95,2.1)}
      ${keil(13.6,m+0.6, 6.8,23.6, 0.16,0.68,1.7)}
      ${keil(11.6,m-1.9, 4.6,19.4, 0.12,0.40,1.1)}</g>`;
  }

  function zeichen(p,f,mitWind=true){
    const zu=zuAus(p);
    let l="";
    for(let y=OEF.y;y<OEF.y+zu-0.35;y+=2.6){
      const h=Math.min(2.1,OEF.y+zu-y);
      if(h>0.45) l+=`<rect x="${OEF.x}" y="${y.toFixed(2)}" width="${OEF.b}"
                       height="${h.toFixed(2)}" rx=".5" fill="${f}"/>`;
    }
    return `<svg viewBox="${VB}" style="display:block;width:100%;height:100%">
      <rect x="1.4" y="2.2" width="19.2" height="20.2" rx="2" fill="#0f151d"
            stroke="#55637a" stroke-width="1.2"/>
      ${l}${mitWind?wind(zu):""}</svg>`;
  }

  /* Die Zeilen der Flaeche. Alle heisst wirklich alle sieben, Rollladen und
     Dachrollladen. Ben sind seine beiden. Die Reihenfolge ist gesetzt. */
  const ZEILEN=[
    ["alle-rollladen","Alle",        true],
    ["ben",           "Ben",         true],
    ["levi",          "Levi",        false],
    ["schlafzimmer",  "Schlafzimmer",false],
    ["wohnzimmer",    "Wohnzimmer",  false],
    ["kueche",        "Küche",       false]
  ];
  /* Lueften ist zugleich Hitzeschutz: fast zu, aber ein Spalt bleibt. */
  const ZIEL=[["auf",100,F_AUF],["lueft",22,F_LUEFT],["zu",0,F_ZU]];

  let da=false, stand={}, lueftWert=22, holt=null;

  const hol=(weg,opt)=>fetch(weg,Object.assign({cache:"no-store"},opt||{}));

  /* Gibt es den Dienst? Einmal beim Laden fragen, danach nur noch den Stand. */
  async function pruefe(){
    try{
      const r=await hol("/velux/gruppen");
      if(!r.ok) return;
      const d=await r.json();
      if(d&&d.positionen&&d.positionen.lueftungsverdunklung!=null){
        lueftWert=Number(d.positionen.lueftungsverdunklung);
        ZIEL[1][1]=lueftWert;
      }
      da=true;
      const k=document.getElementById("veluxKnopf");
      /* Im Knopf ohne Windpfeile. Er ist eine Beschriftung, keine Anzeige,
         und die Karte darunter soll ruhig bleiben. */
      k.innerHTML=zeichen(25,"#c9d3de",false);
      k.hidden=false;
      holeStand();
      holt=setInterval(holeStand,60000);
    }catch(e){ /* kein hapwatch, dann eben kein Knopf */ }
  }

  async function holeStand(){
    try{
      const r=await hol("/velux/stand");
      if(!r.ok) return;
      const d=await r.json();
      stand=(d&&d.gruppen)||{};
      if(document.getElementById("vdetail").classList.contains("on")) male();
    }catch(e){ /* Stand bleibt, wie er war */ }
  }

  /* Welche der drei Stellungen trifft die gemessene Position? */
  function istStellung(pos){
    if(pos==null) return null;
    if(pos>=85) return "auf";
    if(pos<=8) return "zu";
    if(Math.abs(pos-lueftWert)<=14) return "lueft";
    return null;
  }

  function zeile([schluessel,name,gruppe]){
    const g=stand[schluessel]||{};
    const ist=istStellung(g.position);
    const t=ZIEL.map(([art,wert,farbe])=>
      `<div class="vtaste" data-gruppe="${schluessel}" data-richtung="${art}"
            ${ist===art?'data-ist="ja"':""}>
         <div class="vzeichen">${zeichen(wert,farbe)}</div></div>`).join("");
    return `<div class="vzeile${gruppe?" gruppe":""}">
      <div class="n">${name}</div><div class="vtasten">${t}</div></div>`;
  }

  function male(){
    const f=document.getElementById("vflaeche");
    /* Beim Neuzeichnen darf eine laufende Fahrt ihre Rueckmeldung behalten. */
    const laufend={};
    f.querySelectorAll(".vtaste[data-zustand]").forEach(t=>{
      laufend[t.dataset.gruppe+"|"+t.dataset.richtung]=t.dataset.zustand;
    });
    f.innerHTML=
      `<div class="vkopf">antippen zum Schließen</div>`+
      zeile(ZEILEN[0])+zeile(ZEILEN[1])+`<div class="vtrenner"></div>`+
      ZEILEN.slice(2).map(zeile).join("")+
      `<div class="vfehler" id="vfehler"></div>`;
    f.querySelectorAll(".vtaste").forEach(t=>{
      const z=laufend[t.dataset.gruppe+"|"+t.dataset.richtung];
      if(z) t.dataset.zustand=z;
      t.addEventListener("click",ev=>{ ev.stopPropagation(); fahre(t); });
    });
  }

  async function fahre(t){
    if(t.dataset.zustand==="faehrt") return;
    const f=document.getElementById("vfehler");
    if(f) f.textContent="";
    t.dataset.zustand="faehrt";
    try{
      const r=await hol("/velux/fahre",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({gruppe:t.dataset.gruppe,richtung:t.dataset.richtung})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.fehler||("Gateway antwortet "+r.status));
      t.dataset.zustand="fertig";
      setTimeout(()=>{ delete t.dataset.zustand; },2500);
      /* Die Rollladen brauchen gut zwanzig Sekunden. Danach stimmt der
         gemeldete Stand wieder, vorher nicht. */
      setTimeout(holeStand,25000);
    }catch(e){
      delete t.dataset.zustand;
      if(f) f.textContent="Ging nicht: "+e.message;
    }
  }

  function oeffne(){
    if(!da) return;
    male();
    document.getElementById("vdetail").classList.add("on");
    holeStand();
  }
  const schliesse=()=>document.getElementById("vdetail").classList.remove("on");

  return {pruefe,oeffne,schliesse};
})();

/* ===================================================================
   Solar

   Die Anlagenwerte stehen in solar.json neben dieser Seite. Ein Poller im
   Heimnetz schreibt sie dorthin. Die Seite selbst kann kein Modbus sprechen,
   und als HTTPS-Dokument darf sie auch kein HTTP-Ziel im LAN abrufen, der
   Browser blockiert das.

   Die Ertragsprognose rechnet die Seite selbst aus der Einstrahlung, die
   ohnehin schon von Open-Meteo kommt: 14 kWh Ertrag je kWh/m2, gemessen am
   23. und 25. September 2026 an dieser Anlage.

   Alles liegt in einem eigenen Gueltigkeitsbereich, damit keine Namen mit
   dem Rest der Seite kollidieren.
   =================================================================== */
const SOLAR=(()=>{
  /* Leistung je W/m2 auf der Modulebene.

     Die Module liegen nicht waagerecht, sondern um 35 Grad geneigt und 55
     Grad nach Osten gedreht. Das ist aus der Messung vom 26.09.2026
     geschaetzt: direkte und diffuse Strahlung von ICON auf eine schraege
     Flaeche umgerechnet und Neigung und Richtung so gesucht, dass die Kurve
     die gemessene trifft. Restfehler 0,36 gegen 11,2 bei waagerechter
     Rechnung, Tagessumme 47,7 gegen gemessen 47,5 kWh. Mit waagerechter
     Einstrahlung lag die Prognose morgens zu tief und nachmittags zu hoch.

     Ein Tag ist wenig, Neigung und Richtung sind aber Eigenschaften des
     Dachs und aendern sich nicht. Der Faktor kann es, er bekommt im Winter
     vermutlich eine Korrektur. */
  const FAKTOR=0.01249;          /* kW je W/m2, schraeg */
  const FAKTOR_WAAGERECHT=0.014; /* Rueckfall, falls die schraege Reihe fehlt */
  const AKKU_KWH=10.0, AKKU_MAX=5.0, WP=12.42;
  /* Tarife von Thorsten, Stand 25.09.2026. Der Arbeitspreis ist brutto.
     Die Einspeiseverguetung gilt 20 Jahre ab Inbetriebnahme und teilt sich
     nach Anlagengroesse: bis 10 kWp ein Satz, darueber ein niedrigerer.
     Bei 12,42 kWp und Inbetriebnahme im zweiten Halbjahr 2024 sind das
     8,03 und 6,95 Cent, gewichtet also 7,82 Cent.
     Der Grundpreis haengt nicht an der Erzeugung und steht deshalb nur
     nachrichtlich in den Zahlen, nicht in der Bilanz. */
  const VERGUETUNG=0.0782, ARBEITSPREIS=0.2455, GRUNDPREIS_JAHR=253.64;
  const VOLL_KW=10.0;            /* volle Balkenlaenge, die Grenze des Wechselrichters */
  const ALT_MS=25*60*1000;       /* aelter als das, dann keine Anzeige */

  const F_EIGEN="#63b3ff", F_AKKU="#4fd6c9", F_EIN="#3ddc97",
        F_BEZUG="#ff7b6b", F_HAUS="#e8eef5", F_SOC="#ffd166";

  /* Tagesgang des Hausverbrauchs. Wird fuer die Stunden gebraucht, die noch
     nicht gemessen sind. Grundlast, Morgenspitze, Abendspitze. */
  const HAUS=[.30,.28,.27,.27,.28,.36,.72,1.45,1.15,.82,.74,.80,
              1.10,.92,.78,.76,.84,1.25,2.10,2.30,1.55,1.02,.58,.38];

  let jetzt=null, mess={}, heuteKwh=0, standZeit=0;
  /* Die letzten drei Messungen, fuer den Flussbalken.

     Warum gemittelt: springt der Hausverbrauch, braucht der
     Batteriewechselrichter bis zu ein paar Minuten, um nachzuziehen, und
     solange deckt das Netz die Luecke. Ein Einzelwert friert so einen
     Anlaufmoment als roten Block auf der Wand ein, obwohl die Stunde am
     Ende kaum Bezug hat. Am 26.09.2026 gemessen: Stundenmittel 46 Watt
     Bezug, der Balken zeigte in dem Augenblick 790. Die App der Anlage
     mittelt ebenfalls und zeigt so etwas gar nicht erst.

     Nur der Balken wird gemittelt. Batterie, Stundenstreifen und die
     Zahlen der Detailseite bleiben der Augenblick. */
  const VERLAUF_N=3;
  let verlauf=[];
  let prog=new Array(24).fill(0), progM=new Array(24).fill(0);
  let progMorgen=0, progUeber=0, sonnenunter=0;
  /* Ist der Tag gelaufen, interessiert nicht mehr die Vergangenheit, sondern
     was morgen kommt. Zwei Stunden nach Sonnenuntergang schaltet der Streifen
     deshalb auf die Ladekurve des naechsten Tages um. */
  const NACHLAUF_MS=2*3600*1000;
  const morgenModus=()=>sonnenunter>0&&Date.now()>sonnenunter+NACHLAUF_MS
                        &&new Date().getHours()>=12;

  const z1=v=>Number(v||0).toFixed(1).replace(".",",");
  const z2=v=>Number(v||0).toFixed(2).replace(".",",");
  const z3=v=>Number(v||0).toFixed(Math.abs(v)<10?2:1).replace(".",",");

  /* --- Prognose aus der Einstrahlung ------------------------------ */
  function setzePrognose(H,sonne){
    if(!H||!H.time||!H.shortwave_radiation) return;
    const schraeg=Array.isArray(H.global_tilted_irradiance);
    const heute=isoDay(new Date());
    const morgen=isoDay(new Date(Date.now()+864e5));
    const ueber=isoDay(new Date(Date.now()+1728e5));
    const neu=new Array(24).fill(0), neuM=new Array(24).fill(0);
    let sM=0, sU=0;
    for(let i=0;i<H.time.length;i++){
      /* Strahlung ist bei Open-Meteo das Mittel der Stunde davor: der Wert
         mit 13:00 gilt fuer 12 bis 13 Uhr. Die Seite hatte ihn in die Stunde
         von 13 bis 14 gebucht, die Prognose lief also eine Stunde zu spaet.
         Nachgewiesen am 26.09.2026: mit der Verschiebung trifft die schraege
         Rechnung die Messung mit Restfehler 0,36, ohne sie ist das beste
         Ergebnis 11,5, und das bei unmoeglichen 60 Grad Neigung. */
      const beginn=new Date(new Date(H.time[i]).getTime()-3600000);
      const tag=isoDay(beginn), std=beginn.getHours();
      const kwv=Math.min(10, schraeg
        ? (H.global_tilted_irradiance[i]||0)*FAKTOR
        : (H.shortwave_radiation[i]||0)*FAKTOR_WAAGERECHT);
      if(tag===heute) neu[std]=kwv;
      else if(tag===morgen){ neuM[std]=kwv; sM+=kwv; }
      else if(tag===ueber) sU+=kwv;
    }
    prog=neu; progM=neuM; progMorgen=sM; progUeber=sU;
    if(sonne&&sonne[heute]) sonnenunter=sonne[heute].set;
  }

  /* --- Daten der Anlage -------------------------------------------

     Zuerst beim Tablet selbst nachfragen. Dort laeuft wandsolar, liest die
     Anlage ueber Modbus und liefert das Ergebnis auf 127.0.0.1:8099 aus.
     Das ist erlaubt, obwohl diese Seite ueber HTTPS kommt: localhost und
     127.0.0.1 gelten als vertrauenswuerdig und fallen nicht unter die
     Sperre fuer gemischte Inhalte.

     Antwortet dort nichts, wird solar.json neben der Seite gelesen. Das ist
     der Weg fuer jeden anderen Browser und fuer die Arbeit am Rechner.
  */
  /* Gleicher Ursprung zuerst: auf dem Tablet liefert wandsolar die Seite
     selbst aus, dann zeigt "solar.json" genau dorthin. Der zweite Eintrag
     ist nur noch fuer den Fall, dass die Seite von woanders kommt. */
  const QUELLEN=["solar.json","http://127.0.0.1:8099/solar.json"];
  async function holeDaten(){
    for(const q of QUELLEN){
      try{
        const ab=new AbortController();
        const uhr=setTimeout(()=>ab.abort(),2500);
        const r=await fetch(q+(q.includes("?")?"&":"?")+"t="+Date.now(),
                            {cache:"no-store",signal:ab.signal});
        clearTimeout(uhr);
        if(!r.ok) continue;
        const d=await r.json();
        if(!d||!d.jetzt) continue;
        /* Nur wirklich neue Messungen in den Verlauf, sonst zaehlt
           dieselbe doppelt, wenn die Seite schneller fragt als gemessen
           wird. */
        const neuZeit=d.zeit?new Date(d.zeit).getTime():Date.now();
        if(!verlauf.length||neuZeit!==standZeit){
          verlauf.push(d.jetzt);
          if(verlauf.length>VERLAUF_N) verlauf.shift();
        }
        jetzt=d.jetzt;
        mess=d.stunden||{};
        heuteKwh=Number(d.heute_kwh||0);
        standZeit=d.zeit?new Date(d.zeit).getTime():Date.now();
        break;
      }catch(e){ /* naechste Quelle */ }
    }
    zeichne();
  }

  const frisch=()=>jetzt&&(Date.now()-standZeit)<ALT_MS;

  /* Der Mittelwert der letzten Messungen. Ohne Verlauf der Augenblick. */
  function gemittelt(){
    if(verlauf.length<2) return jetzt||{};
    const m={};
    for(const f of ["pv","haus","akku","netz","soc"])
      m[f]=verlauf.reduce((a,e)=>a+Number(e[f]||0),0)/verlauf.length;
    return m;
  }

  /* --- Der Tag, gemessen und gerechnet ---------------------------- */
  function schritt(pv,haus,soc){
    const ausHaus=Math.min(pv,haus), rest=pv-haus;
    let akku=0, ein=0, bez=0;
    if(rest>0){
      akku=Math.min(rest,AKKU_MAX,Math.max(0,(100-soc)/100*AKKU_KWH));
      ein=rest-akku;
    }else{
      const ab=Math.min(-rest,AKKU_MAX,Math.max(0,(soc-5)/100*AKKU_KWH));
      akku=-ab; bez=-rest-ab;
    }
    return {pv,haus,ausHaus,akku,ein,bez};
  }

  /* Der naechste Tag, ganz gerechnet. Damit der Ladezustand am Morgen
     stimmt, laeuft die Rechnung erst durch den Rest des heutigen Abends:
     der Akku entlaedt sich ueber Nacht, mit ihm faengt morgen frueh die
     Kurve an. Gemessen ist an diesem Tag naturgemaess nichts. */
  function tagMorgen(){
    const jetztStd=new Date().getHours();
    let soc=jetzt?Number(jetzt.soc||0):20;
    for(let h=jetztStd;h<24;h++){
      const e=schritt(prog[h]||0,HAUS[h],soc);
      soc=Math.max(0,Math.min(100,soc+e.akku/AKKU_KWH*100));
    }
    const out=[];
    for(let h=0;h<24;h++){
      const e=schritt(progM[h]||0,HAUS[h],soc);
      soc=Math.max(0,Math.min(100,soc+e.akku/AKKU_KWH*100));
      out.push({...e,h,socEnde:soc,gemessen:false});
    }
    return out;
  }

  function tag(){
    const jetztStd=new Date().getHours();
    const soc0=jetzt?Number(jetzt.soc||0):20;
    /* Rueckwaerts vom jetzigen Ladezustand laesst sich der Morgen nicht
       rekonstruieren. Fuer die Vergangenheit nehmen wir die gemessenen
       Fluesse, fuer die Zukunft rechnen wir ab dem jetzigen Stand weiter. */
    const out=[];
    let soc=soc0;
    for(let h=0;h<24;h++){
      const m=mess[String(h)];
      if(h<jetztStd&&m){
        out.push({h,pv:+m.pv||0,haus:+m.haus||0,
                  ausHaus:Math.min(+m.pv||0,+m.haus||0),
                  akku:+m.akku||0, ein:Math.max(0,+m.netz||0),
                  bez:Math.max(0,-(+m.netz||0)), socEnde:null, gemessen:true});
      }else if(h<jetztStd){
        /* Stunde liegt zurueck, aber es gibt keine Messung. Gezeichnet wird
           die Vorhersage, gezaehlt wird sie nicht. Die alte Fassung teilte
           hier den ganzen Fehlbetrag dem Netz zu und behauptete damit
           Netzbezug, den niemand gemessen hat. Am 26.09. waren das 0,85 kWh
           in den Stunden 0 bis 2, die in "vom Netz" mitliefen. */
        const pv=prog[h]||0, haus=HAUS[h];
        out.push({h,pv,haus,ausHaus:Math.min(pv,haus),akku:0,ein:0,bez:0,
                  socEnde:null,gemessen:false,unbekannt:true});
      }else{
        const e=schritt(prog[h]||0,HAUS[h],soc);
        soc=Math.max(0,Math.min(100,soc+e.akku/AKKU_KWH*100));
        const eintrag={...e,h,socEnde:soc,gemessen:false};
        if(h===jetztStd&&m){
          /* Die laufende Stunde. Grau steht die Vorhersage fuer die ganze
             Stunde, gruen waechst darin, was bisher wirklich erzeugt wurde.
             Gerechnet wird als Arbeit: der bisherige Mittelwert mal dem Teil
             der Stunde, der schon vorbei ist. Am Ende der Stunde stehen
             beide auf derselben Skala, und man sieht, ob sie gehalten hat,
             was sie versprach, oder darueber hinausging. */
          const anteil=Math.min(1,new Date().getMinutes()/60);
          eintrag.teil=Math.max(0,(+m.pv||0)*anteil);
          eintrag.teilU=(+m.pv||0)-(+m.haus||0);
        }
        out.push(eintrag);
      }
    }
    /* Ladezustand der Vergangenheit ruecklaeufig aus den Akkufluessen.

       Erst schreiben, dann zurueckrechnen. socEnde ist der Stand am Ende
       der Stunde und wird dort auch gezeichnet. Die letzte volle Stunde
       endet praktisch jetzt, ihr Ende ist also der jetzige Stand. Was
       waehrend einer Stunde in den Akku floss, zieht man ab, um an ihren
       Anfang zu kommen, und der ist das Ende der Stunde davor.

       Vorher stand die Reihenfolge andersherum, jede Stunde bekam den Stand
       ihres Anfangs, und die Linie lief eine Stunde hinterher. Am 26.09. um
       22:06 endete sie deshalb bei 55 %, waehrend die Kennzahl daneben 33 %
       zeigte. */
    let s=soc0;
    for(let h=jetztStd-1;h>=0;h--){
      const e=out[h];
      if(!e||!e.gemessen) break;   /* ohne Messung keine Linie */
      e.socEnde=s;
      s=Math.max(0,Math.min(100,s-e.akku/AKKU_KWH*100));
    }
    if(out[jetztStd]) out[jetztStd].socEnde=soc0;
    return out;
  }

  function bilanz(ST){
    let pv=0,haus=0,eigen=0,laden=0,entladen=0,ein=0,bez=0,bisher=0,spitze=0,luecke=0;
    for(const e of ST){
      if(e.unbekannt){ luecke++; continue; }
      pv+=e.pv; haus+=e.haus; eigen+=e.ausHaus;
      if(e.akku>0) laden+=e.akku; else entladen+=-e.akku;
      ein+=e.ein; bez+=e.bez;
      if(e.gemessen) bisher+=e.pv;
      /* Die laufende Stunde zaehlt mit dem, was in ihr schon erzeugt wurde.
         Sonst stand um 08:25 "Erzeugt 0,0 kWh", waehrend die Anlage seit
         einer Stunde lieferte. */
      else if(e.teil>0) bisher+=e.teil;
      spitze=Math.max(spitze,e.pv);
    }
    if(heuteKwh>bisher) bisher=heuteKwh;
    return {pv,haus,eigen,laden,entladen,ein,bez,bisher,spitze,luecke,
            quote:pv>0?(pv-ein)/pv*100:0,
            autarkie:haus>0?(haus-bez)/haus*100:0,
            erloes:ein*VERGUETUNG, ersparnis:(eigen+entladen)*ARBEITSPREIS,
            kosten:bez*ARBEITSPREIS};
  }

  /* --- Sinnbilder -------------------------------------------------- */
  const MINI={
    haus:`<path d="M1 9.2V4.4L5 1.1l4 3.3v4.8z" fill="currentColor"/>`,
    akku:`<rect x="2.4" y="2.3" width="5.2" height="6.9" rx="1.1" fill="currentColor"/>
          <rect x="3.9" y="1" width="2.2" height="1.5" rx=".5" fill="currentColor"/>`,
    /* Der Euro traegt ein Vorzeichen: Minus kostet, Plus bringt ein. */
    euro:`<text x="5" y="8.1" text-anchor="middle" font-size="10.2" font-weight="750"
                fill="currentColor">&#8364;</text>`,
    "euro+":`<text x="5" y="8.2" text-anchor="middle" font-size="9.3" font-weight="750"
                fill="currentColor">+&#8364;</text>`,
    "euro-":`<text x="5" y="8.2" text-anchor="middle" font-size="9.3" font-weight="750"
                fill="currentColor">&#8722;&#8364;</text>`,
    strom:`<path d="M6.3 .7 2.3 5.9h2.6L4.0 9.3 7.9 4.0H5.4z" fill="currentColor"/>`,
    /* Ein Solarmodul: schraeg gestellte Flaeche mit Zellen und Staender */
    pv:`<path d="M.9 7.2 2.4 1.9h6.6L10.5 7.2z" fill="currentColor"/>
        <path d="M4.6 1.9 4.1 7.2M6.8 1.9 7.3 7.2M1.6 4.6h8.2" stroke="#101720" stroke-width=".55" fill="none"/>
        <path d="M5.7 7.2v1.7M4 8.9h3.4" stroke="currentColor" stroke-width=".9" stroke-linecap="round" fill="none"/>`
  };
  const mini=(a,f,g=10)=>`<svg width="${g}" height="${g}" viewBox="0 0 10 10"
    style="display:block;color:${f};flex:0 0 auto">${MINI[a]}</svg>`;

  /* Aufrechte Batterie, ohne Zahl. Gruen ab 50 Prozent. */
  /* Aufrechte Batterie, ohne Zahl. Gruen ab 50 Prozent.

     Eine einzige Fuge g fuer alles: zwischen den Zellen, am Boden, an den
     Seiten und oben. Vorher lagen zwischen den Zellen 1,6 Pixel dunkle
     Linie, am Boden reichte die Fuellung aber bis an die Kontur, und die
     Zellen sahen ungleich eingefasst aus. Jetzt ist jede Zelle ein eigenes
     Kaestchen und fuellt sich von unten. */
  function batterie(soc,laedt,b=24,h=44){
    const kappe=Math.max(3,h*0.075), rand=1.6, g=1.6;
    const x0=1+rand/2+g, x1=b-1-rand/2-g;
    const y0=kappe+rand/2+g, y1=h-1-rand/2-g;
    const n=5, zh=(y1-y0-(n-1)*g)/n, v=Math.max(0,Math.min(100,soc))/100*n;
    const farbe=soc>=50?"#3ddc97":soc>=25?"#ffd166":"#ff7b6b";
    let zellen="";
    for(let i=0;i<n;i++){
      const unten=y1-i*(zh+g), voll=Math.max(0,Math.min(1,v-i));
      if(voll<=0) continue;
      const hh=zh*voll;
      zellen+=`<rect x="${x0.toFixed(2)}" y="${(unten-hh).toFixed(2)}" width="${(x1-x0).toFixed(2)}"
                     height="${hh.toFixed(2)}" rx="1" fill="${farbe}"/>`;
    }
    const k=h/68;
    const blitz=laedt?`<path transform="translate(${b/2} ${h/2+kappe/2}) scale(${k.toFixed(3)})"
        d="M3 -10l-7 11h4.5l-2 8.5 7-11.2h-4.5z" fill="#0d131b" opacity=".85"/>`:"";
    return `<svg width="${b}" height="${h}" viewBox="0 0 ${b} ${h}" style="display:block">
      <rect x="${(b/2-b*0.19).toFixed(2)}" y="0" width="${(b*0.38).toFixed(2)}" height="${kappe+1}" rx="1.4" fill="#5b6b7d"/>
      <rect x="1" y="${kappe}" width="${b-2}" height="${h-kappe-1}" rx="${(b*0.15).toFixed(2)}"
            fill="#1b232e" stroke="#6b7a8c" stroke-width="${rand}"/>
      ${zellen}${blitz}</svg>`;
  }

  /* Eine Saeule je Stunde. Links vom Strich gemessen, rechts gerechnet.
     Gruen heisst, dass dort mehr erzeugt wird als das Haus braucht. */
  const SVON=5,SBIS=21,SBH=8,SAB=3;
  const SB=(SBIS-SVON)*(SBH+SAB)+SBH;
  function streifen(ST,hoehe=44,morgen=false){
    let s="";
    for(let t=SVON;t<=SBIS;t++){
      const e=ST[t], v=e.pv, hh=Math.max(1.5,(v/10)*(hoehe-6));
      const x=(t-SVON)*(SBH+SAB);
      /* Farbe sagt etwas ueber Gemessenes, sonst nichts. Gruen heisst: diese
         Stunde ist gelaufen und hat mehr erzeugt, als das Haus gebraucht hat.
         Eine Vorhersage hat noch gar nichts geladen und bleibt deshalb grau,
         egal wie viel sie verspricht. */
      const u=v-e.haus;
      const f=!e.gemessen ? "#5b6b7d" : u>1.0 ? "#3ddc97" : u>0 ? "#9ad9b5" : "#5b6b7d";
      s+=`<rect x="${x}" y="${(hoehe-hh).toFixed(1)}" width="${SBH}" height="${hh.toFixed(1)}"
               rx="2" fill="${f}" opacity="${e.gemessen?1:.30}"/>`;
      /* Erst das Gewachsene, dann der Umriss der Vorhersage darueber. So
         bleibt sichtbar, wo die Stunde versprochen hatte, auch wenn der
         gruene Balken schon darueber hinausgewachsen ist. */
      if(e.teil>0.02){
        const th=Math.max(1.5,(e.teil/10)*(hoehe-6));
        const tf=e.teilU>1.0?"#3ddc97":e.teilU>0?"#9ad9b5":"#8b97a6";
        s+=`<rect x="${x}" y="${(hoehe-th).toFixed(1)}" width="${SBH}"
                 height="${th.toFixed(1)}" rx="2" fill="${tf}"/>`;
      }
      if(!e.gemessen) s+=`<rect x="${x}" y="${(hoehe-hh).toFixed(1)}" width="${SBH}"
               height="${hh.toFixed(1)}" rx="2" fill="none" stroke="#c5ced8"
               stroke-width="1" stroke-opacity="${e.teil>0.02?".8":".45"}"/>`;
    }
    /* Kein Jetzt-Strich mehr. Wo die gemessenen Saeulen aufhoeren und die
       grauen anfangen, ist die Gegenwart, das zeigt der Streifen schon. Beim
       naechsten Tag steht statt des Strichs ein Wort, sonst haelt man die
       graue Kurve fuer den verpatzten heutigen Tag. */
    if(morgen) s+=`<text x="0" y="8" font-size="8.5" font-weight="700"
                style="fill:var(--leise,#8b97a6)" letter-spacing=".3">morgen</text>`;
    return `<svg width="${SB}" height="${hoehe}" viewBox="0 0 ${SB} ${hoehe}"
                 style="display:block">${s}</svg>`;
  }

  /* Wohin der Strom geht, oder woher er kommt. Der Pfeil zeigt die Richtung,
     ein roter Rahmen erscheint nur, wenn wirklich Netzstrom fliesst.

     Symbol und Balken kommen getrennt zurueck. Das Symbol steht unter der
     Batterie, der Balken ist so breit wie der Stundenstreifen darueber. */
  function wohin(gesamt=SB,h=19){
    const g=gemittelt();
    const pv=Number(g.pv||0), haus=Number(g.haus||0);
    const netz=Number(g.netz||0), akku=Number(g.akku||0);
    const bez=Math.max(0,-netz), ein=Math.max(0,netz);
    const knapp=pv+0.02<haus, teuer=bez>0.02;
    const b=gesamt;
    let teile, endIkon, endFarbe;
    if(knapp){
      teile=[[Math.min(pv,haus),"#ffd166","strom"],
             [bez,F_BEZUG,"euro-"]];
      endIkon="haus"; endFarbe=F_EIGEN;
    }else{
      teile=[[Math.min(pv,haus),F_EIGEN,"haus"],
             [ein,F_EIN,"euro+"]];
      endIkon="pv"; endFarbe=F_SOC;
    }
    /* Die Laenge ist die Leistung, voll heisst VOLL_KW. Damit sagt der Balken
       nicht nur wohin, sondern auch wie viel. Die feinen Striche geben der
       Laenge einen Bezug, sonst hiesse ein kurzer Balken nur "wenig". */
    const summe=teile.reduce((a,[v])=>a+v,0);
    const nutz=summe>0.02 ? Math.max(3,Math.min(1,summe/VOLL_KW)*b) : 0;

    let skala="";
    for(let kwv=2;kwv<VOLL_KW;kwv+=2)
      skala+=`<line x1="${(b*kwv/VOLL_KW).toFixed(1)}" y1="0"
                    x2="${(b*kwv/VOLL_KW).toFixed(1)}" y2="${h}"
                    stroke="#3a4756" stroke-width="1"/>`;

    const gr=Math.min(13,h-4), sk=gr/10;
    let x=0,s="";
    for(const [v,f,a] of teile){
      const w=summe>0 ? v/summe*nutz : 0;
      if(w<0.6) continue;
      s+=`<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${h}" fill="${f}"/>`;
      if(w>=gr+4) s+=`<g transform="translate(${(x+w/2-gr/2).toFixed(1)} ${(h/2-gr/2).toFixed(1)})
                          scale(${sk.toFixed(2)})" color="#101720" opacity=".92">${MINI[a]}</g>`;
      x+=w;
    }
    /* Der Rahmen umfasst nur den Balken, nicht die leere Bahn dahinter */
    const rahmen=teuer&&nutz>4?`<rect x=".6" y=".6" width="${(nutz-1.2).toFixed(1)}"
                              height="${h-1.2}" rx="3.4"
                              fill="none" stroke="${F_BEZUG}" stroke-width="1.2" opacity=".9"/>`:"";
    /* Das Symbol ist ein Knoten, jeder Strom erscheint genau einmal. Der Akku
       laeuft nur ueber den senkrechten Pfeil und ist deshalb nicht im Strahl.
       Der waagerechte Pfeil traegt, was wirklich in den Strahl geht oder aus
       ihm kommt. So gehen die Zahlen auf: mittags 6,4 = 1,5 in den Akku plus
       4,9 in den Strahl. Vorher stand abends zweimal dieselbe 1,0 da, einmal
       am Akku und einmal im Strahl. Ist ein Strom null, fehlt sein Pfeil.
       Pfeile drehen mit der Richtung, das Vorzeichen steht trotzdem. */
    const vz=v=>(v>=0?"+":"\u2212")+Math.abs(v).toFixed(1).replace(".",",");
    const G="#8b97a6";
    const pfW=rechts=>`<svg width="8" height="5" viewBox="0 0 8 5" style="display:block"><path d="${rechts
      ?"M.5 2.5h6.4M5 .8 6.9 2.5 5 4.2":"M7.5 2.5H1.1M3 .8 1.1 2.5 3 4.2"}" fill="none" stroke="${G}" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const pfS=hoch=>`<svg class="pfz" viewBox="0 0 5 7"><path d="${hoch
      ?"M2.5 6.6V.4M.9 2.1 2.5 .4 4.1 2.1":"M2.5 .4v6.2M.9 4.9 2.5 6.6 4.1 4.9"}" fill="none" stroke="${G}" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const summe0=teile.reduce((a,[v])=>a+v,0), wert=knapp?-summe0:summe0;
    const symbol=mini(endIkon,endFarbe,endIkon==="pv"?17:16);
    const quer=summe0>0.05?`<div class="kn-quer"><span class="kn">${vz(wert)}</span>${pfW(wert>=0)}</div>`:"";
    const senk=Math.abs(akku)>0.05?`<span class="kn">${pfS(akku>0)}${vz(akku)}</span>`:"";
    const balken=`<svg width="${b}" height="${h}" viewBox="0 0 ${b} ${h}"
           style="display:block;border-radius:4px;overflow:hidden">
        <rect x="0" y="0" width="${b}" height="${h}" fill="#222c38"/>${skala}${s}${rahmen}</svg>`;
    return {symbol,quer,senk,balken};
  }

  /* --- Der Block in der Kopfzeile ---------------------------------- */
  function zeichne(){
    const el=document.getElementById("solar");
    const kopf=document.getElementById("kopf");
    if(!el) return;
    if(!frisch()){ el.hidden=true; kopf.classList.add("ohne-solar"); return; }
    el.hidden=false; kopf.classList.remove("ohne-solar");
    /* Batterie und Flussbalken zeigen immer das Jetzt. Nur der Streifen
       wechselt abends auf den naechsten Tag. */
    const m=morgenModus();
    const ST=m?tagMorgen():tag();
    /* Zwei Spalten, zwei Zeilen. Oben Batterie und Stundenstreifen, gleich
       hoch, damit die Unterkante der Batterie auf der Grundlinie der Balken
       steht. Unten Symbol und Strahl, der Strahl so breit wie der Streifen. */
    const w=wohin();
    el.innerHTML=`<div class="solarraster">
      <div class="sr-links">${batterie(Number(jetzt.soc||0), Number(jetzt.akku||0)>0.05)}</div>
      <div></div><div>${streifen(ST,44,m)}</div>
      <div class="sr-links">${w.symbol}</div>
      <div class="sr-links">${w.quer}</div><div>${w.balken}</div>
      ${w.senk?`<div class="kn-senk">${w.senk}</div>`:""}</div>`;
    /* Akkupfeil samt Zahl mittig auf die Achse und mittig in die Fuge */
    const sk=el.querySelector(".kn-senk");
    if(sk){
      const r=el.querySelector(".solarraster"), R=r.getBoundingClientRect();
      const a=r.children[0].querySelector("svg").getBoundingClientRect();
      const y=r.children[3].querySelector("svg").getBoundingClientRect();
      sk.style.left=(a.left-R.left+a.width/2-sk.offsetWidth/2).toFixed(2)+"px";
      sk.style.top=(a.bottom-R.top+(y.top-a.bottom-sk.offsetHeight)/2).toFixed(2)+"px";
    }
    if(document.getElementById("sdetail").classList.contains("on")) detailZeigen();
  }

  return {setzePrognose,holeDaten,zeichne,
          detail:()=>detailZeigen(), frisch,
          _intern:{tag,bilanz,prog:()=>prog,progMorgen:()=>progMorgen,
                   progUeber:()=>progUeber,jetzt:()=>jetzt,
                   farben:{F_EIGEN,F_AKKU,F_EIN,F_BEZUG,F_HAUS,F_SOC},
                   z1,z2,z3,WP,VERGUETUNG,ARBEITSPREIS}};

  /* --- Detailansicht ----------------------------------------------- */
  function detailZeigen(){
    const d=document.getElementById("sdetail");
    d.innerHTML=detailHtml();
    d.classList.add("on");
  }

  function detailHtml(){
    const ST=tag(), z=bilanz(ST), l=jetzt;
    const jetztStd=new Date().getHours();
    const rest=ST.filter(e=>!e.gemessen&&e.h>=jetztStd).reduce((a,e)=>a+e.pv,0);
    const fenster=ST.filter(e=>e.ein>=1.5).map(e=>e.h);
    const fensterText=fenster.length
      ? `${fenster[0]}–${fenster[fenster.length-1]} Uhr, ${fenster.length} Stunden über 1,5 kW`
      : "heute kein nennenswerter Überschuss";
    const kpi=(t,gr,kl,fa)=>`<div class="kpi"><div class="t">${t}</div>
      <div class="z"${fa?` style="color:${fa}"`:""}>${gr}</div><div class="n">${kl}</div></div>`;
    const eh=`<span style='font-size:14px;color:#8b97a6'>`;
    return `<span class="schliessen">antippen zum Schließen</span>
      <h4>Solar heute</h4>
      <div class="unter">${new Date().toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"})}
        · ${z1(WP)} kWp · SUN2000-10KTL-M1 mit 10 kWh Speicher${(()=>{
        /* Die Kennzahlen summieren den ganzen Tag. Solange er laeuft, ist der
           Rest davon Prognose, und das soll dastehen. Es steht in dieser Zeile
           und nicht in einer eigenen, sonst wird die Seite hoeher als der
           Schirm. */
        const offen=ST.some(e=>!e.gemessen&&!e.unbekannt&&e.h>=jetztStd&&e.pv>0.05);
        const t=[];
        if(offen) t.push(`bis ${new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} gemessen, danach Prognose`);
        if(z.luecke) t.push(`${z.luecke} ${z.luecke===1?"Stunde":"Stunden"} ohne Messung nicht mitgezählt`);
        return t.length?" · <b style='color:#c5ced8;font-weight:600'>"+t.join(" · ")+"</b>":"";
      })()}</div>
      <div class="kpis">
        ${kpi("Erzeugt",z1(z.bisher)+" "+eh+"kWh</span>","Prognose heute "+z1(z.pv)+" kWh",F_SOC)}
        ${kpi("Noch erwartet",z1(rest)+" "+eh+"kWh</span>",fensterText)}
        ${kpi("Eigenverbrauch",Math.round(z.quote)+" "+eh+"%</span>",
              "eingespeist "+z1(z.ein)+" kWh",F_EIGEN)}
        ${kpi("Autarkie",Math.round(z.autarkie)+" "+eh+"%</span>",
              "vom Netz "+z1(z.bez)+" kWh",F_EIN)}
        ${kpi("Bilanz",z2(z.erloes+z.ersparnis-z.kosten)+" "+eh+"€</span>",
              "Erlös "+z2(z.erloes)+" · gespart "+z2(z.ersparnis))}
      </div>
      <div class="sgrid">
        <div class="sblock">
          <div class="t">Tagesverlauf · links gemessen, rechts gerechnet</div>
          ${tagesChart(ST)}
          <div class="leg">
            <span><i style="background:${F_EIGEN}"></i>ins Haus</span>
            <span><i style="background:${F_AKKU}"></i>in den Akku</span>
            <span><i style="background:${F_AKKU};opacity:.55"></i>aus dem Akku</span>
            <span><i style="background:${F_EIN}"></i>ins Netz</span>
            <span><i style="background:${F_BEZUG};opacity:.62"></i>aus dem Netz</span>
            <span><i style="background:${F_HAUS}"></i>Verbrauch</span>
            <span><i style="background:${F_SOC}"></i>Ladezustand</span>
          </div>
        </div>
        <div class="sblock">
          <div class="t">Zahlen</div>
            <div class="paare">
              <div class="k">Leistung jetzt</div><div class="v">${z3(l.pv)} kW</div>
              <div class="k">Hausverbrauch jetzt</div><div class="v">${z3(l.haus)} kW</div>
              <div class="k">Spitze heute</div><div class="v">${z3(z.spitze)} kW</div>
              <div class="k">Ladezustand</div><div class="v">${Math.round(l.soc)} %</div>
              <div class="k">Akku geladen / entladen</div><div class="v">${z1(z.laden)} / ${z1(z.entladen)} kWh</div>
              <div class="k">Hausverbrauch heute</div><div class="v">${z1(z.haus)} kWh</div>
              <div class="k">Netzbezug</div><div class="v">${z1(z.bez)} kWh · ${z2(z.kosten)} €</div>
              <div class="k">Morgen erwartet</div><div class="v">${z1(progMorgen)} kWh</div>
              <div class="k">Übermorgen erwartet</div><div class="v">${z1(progUeber)} kWh</div>
              <div class="k">Grundpreis</div><div class="v">${z2(GRUNDPREIS_JAHR/365)} € am Tag</div>
              <div class="k">Stand der Messung</div><div class="v">${new Date(standZeit).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</div>
          </div>
        </div>

        <div class="sblock">
          <div class="t">Überschuss je Stunde in kW · wann sich Verschieben lohnt</div>
          <div style="margin-block:auto">${band(ST,560,50)}</div>
        </div>
        <div class="sblock">
          <div class="t">Wohin und woher, über den ganzen Tag</div>
          ${balken(z)}
        </div>
      </div>
      <div class="quelle">Anlage über Modbus am SDongle · Vorhersage aus der Einstrahlung
        von Open-Meteo auf die Modulebene, 35° geneigt, 55° nach Osten,
        ${z1(FAKTOR*1000)} kWh je kWh/m² · Vergütung
        ${z1(VERGUETUNG*100)} ct, Arbeitspreis ${Math.round(ARBEITSPREIS*100)} ct je kWh</div>`;
  }

  function tagesChart(ST,b=560,h=186){
    const VON=4,BIS=22,MAX=10,pL=26,pR=34,pT=9,pB=17;
    const iw=b-pL-pR, ih=h-pT-pB;
    const x=t=>pL+(t-VON)/(BIS-VON)*iw;
    const y=v=>pT+ih-(Math.max(0,v)/MAX)*ih;
    const ys=p=>pT+ih-(p/100)*ih;
    const std=[]; for(let t=VON;t<BIS;t++) std.push(ST[t]);
    const stufen=(u,o)=>{
      let d="";
      for(let i=0;i<o.length;i++)
        d+=(i?"L":"M")+x(VON+i).toFixed(1)+" "+y(o[i]).toFixed(1)
          +"L"+x(VON+i+1).toFixed(1)+" "+y(o[i]).toFixed(1);
      for(let i=o.length-1;i>=0;i--)
        d+="L"+x(VON+i+1).toFixed(1)+" "+y(u[i]).toFixed(1)
          +"L"+x(VON+i).toFixed(1)+" "+y(u[i]).toFixed(1);
      return d+"Z";
    };
    const s0=std.map(()=>0), s1=std.map(e=>e.ausHaus);
    const s2=std.map(e=>e.ausHaus+Math.max(0,e.akku)), s3=std.map(e=>e.pv);
    /* Unter der Hauslinie: was nicht direkt aus der Sonne kam, kam aus dem
       Akku oder aus dem Netz. Vorher war die ganze Flaeche zwischen PV und
       Haus rot und hiess "aus dem Netz". Abends, wenn der Akku das Haus
       traegt, behauptete der Graph damit Netzbezug, den es nie gab, und
       widersprach der eigenen Kennzahl darueber. Am 26.09. zeichnete er
       ueber den Tag 9,34 kWh Bezug, gemessen waren es 3,17, und fuer 18
       bis 22 Uhr 6,41 gegen tatsaechlich 0,16. */
    const uAkku=std.map(e=>Math.min(e.pv,e.haus));
    const oAkku=std.map((e,i)=>Math.min(e.haus,uAkku[i]+Math.max(0,-e.akku)));
    const oNetz=std.map((e,i)=>Math.max(oAkku[i],e.haus));
    let netz="",achse="";
    for(let v=2;v<=8;v+=2)
      netz+=`<line x1="${pL}" y1="${y(v)}" x2="${b-pR}" y2="${y(v)}" stroke="#233040" stroke-width="1"/>
             <text x="${pL-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="#6c7b8c">${v}</text>`;
    for(let t=VON;t<=BIS;t+=3)
      achse+=`<text x="${x(t)}" y="${h-4}" text-anchor="middle" font-size="9" fill="#6c7b8c">${t}</text>`;
    for(const p of [0,50,100])
      achse+=`<text x="${b-pR+5}" y="${ys(p)+3.5}" font-size="9" fill="#a08a45">${p===100?"100 %":p}</text>`;
    let hl="",sl="";
    for(let i=0;i<std.length;i++){
      hl+=(i?"L":"M")+x(VON+i).toFixed(1)+" "+y(std[i].haus).toFixed(1)
         +"L"+x(VON+i+1).toFixed(1)+" "+y(std[i].haus).toFixed(1);
      if(std[i].socEnde!=null)
        sl+=(sl?"L":"M")+x(VON+i+1).toFixed(1)+" "+ys(std[i].socEnde).toFixed(1);
    }
    const nowH=new Date().getHours()+new Date().getMinutes()/60;
    const jx=x(Math.max(VON,Math.min(BIS,nowH)));
    return `<svg width="${b}" height="${h}" viewBox="0 0 ${b} ${h}"
                 style="display:block;width:100%;height:auto">
      ${netz}
      <path d="${stufen(s0,s1)}" fill="${F_EIGEN}" opacity=".78"/>
      <path d="${stufen(s1,s2)}" fill="${F_AKKU}" opacity=".78"/>
      <path d="${stufen(s2,s3)}" fill="${F_EIN}" opacity=".70"/>
      <path d="${stufen(uAkku,oAkku)}" fill="${F_AKKU}" opacity=".40"/>
      <path d="${stufen(oAkku,oNetz)}" fill="${F_BEZUG}" opacity=".42"/>
      <path d="${hl}" fill="none" stroke="${F_HAUS}" stroke-width="1.5" opacity=".85"/>
      <path d="${sl}" fill="none" stroke="${F_SOC}" stroke-width="1.4"
            stroke-dasharray="4 3" opacity=".9"/>
      <line x1="${jx.toFixed(1)}" y1="${pT}" x2="${jx.toFixed(1)}" y2="${pT+ih}"
            stroke="#e8eef5" stroke-width="1" stroke-opacity=".5"/>
      <text x="${pL-5}" y="${pT+7}" text-anchor="end" font-size="9" fill="#6c7b8c">kW</text>
      ${achse}</svg>`;
  }

  function band(ST,b=560,h=40){
    const VON=5,BIS=21,n=BIS-VON+1,zw=b/n;
    const stufe=v=>v<.2?["#1d2634","#55637a"]:v<1?["#2a5c48","#b9d8c9"]
                   :v<2.5?["#2f8f68","#0d131b"]:v<4?["#3ddc97","#0d131b"]:["#8df4c8","#0d131b"];
    let s="";
    for(let i=0;i<n;i++){
      const t=VON+i,e=ST[t],[f,tf]=stufe(e.ein);
      s+=`<rect x="${(i*zw+.7).toFixed(1)}" y="0" width="${(zw-1.4).toFixed(1)}"
               height="${h-14}" rx="3" fill="${f}" opacity="${e.gemessen?1:.55}"/>`;
      if(e.ein>=.2)
        s+=`<text x="${(i*zw+zw/2).toFixed(1)}" y="${(h-14)/2+4.5}" text-anchor="middle"
                  font-size="10.5" font-weight="700" fill="${tf}">${z1(e.ein)}</text>`;
      if(t%3===0||t===VON)
        s+=`<text x="${(i*zw+zw/2).toFixed(1)}" y="${h-1}" text-anchor="middle"
                  font-size="9" fill="#6c7b8c">${t}</text>`;
    }
    const nowH=new Date().getHours()+new Date().getMinutes()/60;
    const jx=(Math.max(VON,Math.min(BIS+1,nowH))-VON)*zw;
    s+=`<line x1="${jx.toFixed(1)}" y1="-1" x2="${jx.toFixed(1)}" y2="${h-13}"
              stroke="#e8eef5" stroke-width="1" stroke-opacity=".55"/>`;
    return `<svg width="${b}" height="${h}" viewBox="0 0 ${b} ${h}"
                 style="display:block;width:100%;height:auto">${s}</svg>`;
  }

  function balken(z,b=520){
    const reihe=(titel,summe,teile)=>{
      let x=0,s="";
      for(const [v,f,a] of teile){
        const w=summe>0?v/summe*b:0;
        if(w<0.6) continue;
        s+=`<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="20" fill="${f}"/>`;
        if(w>=17) s+=`<g transform="translate(${(x+w/2-5.5).toFixed(1)} 4.5) scale(1.1)"
                          color="#101720" opacity=".9">${MINI[a]}</g>`;
        x+=w;
      }
      const zahlen=teile.filter(([v])=>v>0.05)
        .map(([v,f])=>`<span style="color:${f}">${z1(v)}</span>`).join(" · ");
      return `<div style="margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;font-size:11.5px;color:#8b97a6">
          <span>${titel}</span><span style="font-weight:700;color:#e8eef5">${z1(summe)} kWh</span></div>
        <svg width="${b}" height="20" viewBox="0 0 ${b} 20"
             style="display:block;width:100%;height:auto;border-radius:4px;overflow:hidden;margin:3px 0 2px">
          <rect x="0" y="0" width="${b}" height="20" fill="#222c38"/>${s}</svg>
        <div style="font-size:11px;font-variant-numeric:tabular-nums">${zahlen}</div></div>`;
    };
    return reihe("Erzeugung geht nach",z.pv,
             [[z.eigen,F_EIGEN,"haus"],[z.laden,F_AKKU,"akku"],[z.ein,F_EIN,"euro+"]])
         + reihe("Verbrauch kommt aus",z.haus,
             [[z.eigen,F_SOC,"strom"],[z.entladen,F_AKKU,"akku"],[z.bez,F_BEZUG,"euro-"]]);
  }
})();

function renderOutlook(){
  const now=new Date();
  const target=isoDay(outlookDate(now));
  const entry=dayCache[target];
  /* keep whatever is on screen if the cache has not caught up yet, and let the
     next refresh fill it in */
  if(!entry){ if(!outlookKey) summary.textContent="Prognose lädt…"; return; }
  outlookKey=target;

  const info=entry.info, v=info.verdict;
  const word=target===isoDay(now)?"Heute":"Morgen";
  summary.textContent=`${word} ${v.text}, ${Math.round(info.minT)}–${Math.round(info.maxT)}\u00a0°C`;

  todaySub.innerHTML=
    `<span class="inl">${mi("drop")}Regenrisiko bis ${pct(v.maxPop)}, ${n1(v.mm)}${NB}mm</span>`+
    ` · <span class="inl" style="color:var(--yellow)">${mi("sun")}${n1(v.sunH)}${NB}h Sonne</span>`;

  /* Gewitter nur dann erwaehnen, wenn es etwas zu erwaehnen gibt. Der Satz
     "kein auffaelliges Gewitterpotenzial" stand an dreihundert Tagen im Jahr
     da, hat nichts gesagt und die Zeile umbrechen lassen. */
  const thunder=v.maxCape>=1000?"Gewitterpotenzial erhöht"
    :(v.maxCape>=300?"Gewitter nicht ausgeschlossen":"");
  todayExtra.innerHTML=
    `<span class="inl">${mi("up")}${info.sr||"–"}</span> · <span class="inl">${mi("down")}${info.ss||"–"}</span>`+
    ` · <span class="inl">${mi("sock")}Wind bis ${Math.round(info.wmax)} km/h, Böen ${Math.round(info.gmax)} km/h</span>`+
    (thunder?` · <span class="inl" style="color:var(--yellow)">${mi("bolt")}${thunder}</span>`:"");
}

/*
  Everything that helps to explain a failed update, in one photographable
  panel: what broke, how the environment looked, and the recent history.
*/
function showDiagnostics(){
  const now=Date.now();
  const hhmmss=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const ago=t=>{
    const s=Math.round((now-t)/1000);
    if(s<90) return s+" s her";
    if(s<5400) return Math.round(s/60)+" min her";
    return (s/3600).toFixed(1)+" h her";
  };

  let streak=0;
  for(let i=diagEvents.length-1;i>=0;i--){
    if(diagEvents[i].kind==="ok") break;
    streak++;
  }
  const firstT=diagEvents.length?diagEvents[0].t:0;
  const c=navigator.connection||{};
  const pairs=[
    ["Zustand", lastError?"Fehler":"in Ordnung"],
    ["letzter Fehler", lastError?`${lastError.msg} (${ago(lastError.t)})`:"keiner"],
    ["letzter Erfolg", lastGoodAt?`${hhmmss(lastGoodAt)} (${ago(lastGoodAt)})`:"noch keiner"],
    ["Fehlversuche in Folge", String(streak)],
    ["Open-Meteo heute", (()=>{ const k=omStand(); return `${Math.round(k.summe)} von ${OM_BUDGET}, Karte ${Math.round(k.karte)}`+(Date.now()<k.ruheBis?`, Pause bis ${new Date(k.ruheBis).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}`:""); })()],
    ["Browser online", navigator.onLine===false?"nein":"ja"],
    ["Verbindung", [c.effectiveType,c.downlink!=null?c.downlink+" Mbit/s":null,c.rtt!=null?c.rtt+" ms":null].filter(Boolean).join(" · ")||"nicht gemeldet"],
    ["Seite geladen", document.lastModified],
    ["Adresse", location.href.replace(/^https?:\/\//,"")],
    ["Aktualisierung", `Prognose alle ${REFRESH_MS/60000} min, Karte zur vollen Stunde`],
    ["Protokoll", diagEvents.length
      ? `${diagEvents.length} Einträge ab ${new Date(firstT).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`
      : "leer"]
  ];

  const rows=pairs.map(([k,v])=>`<div class="k">${k}</div><div class="v">${v}</div>`).join("");
  const log=diagEvents.slice(-24).map(ev=>{
    const t=hhmmss(ev.t).padStart(8," ");
    const src=(ev.src||"?").padEnd(9," ");
    const kind=(ev.kind||"?").padEnd(5," ");
    const ms=ev.ms!=null?String(ev.ms).padStart(6," ")+" ms":"        ";
    const off=ev.on===false?"  [offline]":"";
    if(ev.n>1){
      const von=new Date(ev.t0||ev.t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
      return `<div class="e-ok">${t}  ${src}${kind}${ms}  ${ev.n}× ok, seit ${von}${off}</div>`;
    }
    return `<div class="e-${ev.kind}">${t}  ${src}${kind}${ms}  ${ev.msg||""}${off}</div>`;
  }).join("")||'<div>noch keine Einträge</div>';

  diagBody.innerHTML=
    `<h4>Diagnose · Aktualisierung</h4>`+
    `<div class="rows" style="grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr)">${rows}</div>`+
    `<div class="evlog">${log}</div>`+
    `<div class="src">Zeit · Quelle · Art · Dauer · Meldung${buildStamp()}</div>`;
  diag.classList.add("on");
  clearTimeout(diagTimer);
  diagTimer=setTimeout(()=>diag.classList.remove("on"),120000);
}
