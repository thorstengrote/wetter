<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wetter Uedorf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090c11">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#090c11;
  --panel:#121821;
  --panel2:#1a2230;
  --panel3:#202b3a;
  --fg:#f7f9fb;
  --muted:#aeb8c5;
  --line:#3a4657;
  --blue:#6ec8ff;
  --yellow:#ffd45c;
  --orange:#ffb27f;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden
}
body{padding:12px 16px 10px}
/*
  Eine Breite und eine Symbolgroesse fuer Stunden- wie Tageskacheln. Vorher
  war das Symbol in der Stundenkachel 38 Pixel gross und auf der Tageskachel
  48, dieselbe Wetterlage wirkte dadurch je nach Kachel unterschiedlich
  wichtig.
*/
:root{--kachel:calc((100vw - 108px)/12); --wsize:clamp(44px,8vh,104px)}
#app{
  height:100%;
  display:grid;
  grid-template-rows:auto 36fr 64fr;
  gap:9px
}
header{
  background:linear-gradient(180deg,#171f2a,#111821);
  border:1px solid #4a586b;
  border-radius:15px;
  padding:10px 14px;
  display:grid;
  grid-template-columns:185px 1fr auto;
  gap:18px;
  align-items:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.025) inset
}
.place{font-size:21px;font-weight:700}
.clock{font-size:38px;font-weight:750;line-height:1}
.date{font-size:12px;color:var(--muted);margin-top:3px}
.date .stand{color:#8b97a6}
.date .stale{color:#ff8a8a;font-weight:650}
#stand{cursor:pointer;-webkit-user-select:none;user-select:none}
.diag .evlog{
  margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
  line-height:1.5;max-height:46vh;overflow:auto
}
.diag .evlog div{white-space:nowrap}
.diag .evlog .e-ok{color:#8fcf9a}
.diag .evlog .e-netz{color:#ff9e9e}
.diag .evlog .e-http{color:#ffc46b}
.diag .evlog .e-api{color:#ffc46b}
.diag .evlog .e-json{color:#ffc46b}
.current{display:flex;align-items:center;gap:12px}
.current .icon{display:flex;align-items:center}
.current .icon .wicon{width:58px;height:58px;max-height:100%;display:block}
.current .temp{font-size:34px;font-weight:750}
.current .details{font-size:13px;line-height:1.5;color:#c9d2dc}
.today{text-align:right;max-width:690px;cursor:pointer;-webkit-user-select:none;user-select:none;
  border-radius:10px;padding:4px 7px;margin:-4px -7px}
.today:active{background:rgba(255,255,255,.06)}
.today .summary{font-size:17px;font-weight:700}
.today .sub{font-size:12px;color:#c5ced8;margin-top:3px}
.today .extra{font-size:12px;color:#c5ced8;margin-top:4px}

/* One label system for every secondary value on the page.
   Same size, same weight, same icon box, never wraps, never absent.
   Grey means unremarkable, colour means worth a look. */
.lbl{
  font-size:10px;line-height:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-variant-numeric:tabular-nums;
  color:#8b97a6
}
.lbl.rain{color:var(--blue)}
.lbl.sun{color:var(--yellow)}
.lbl.wind{color:#ffb86b}
.mi{width:11px;height:11px;flex:0 0 auto}
.mi.sock{width:14px;height:10px}
.inl{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.inl .mi{width:12px;height:12px}
.inl .mi.sock{width:15px;height:11px}

.box{
  background:#0f151d;
  border:1px solid #3e4a5b;
  border-radius:15px;
  padding:9px 9px 7px;
  min-height:0;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 0 1px rgba(255,255,255,.02) inset
}
.title{
  flex:0 0 auto;
  font-size:12px;
  color:#c5cfdb;
  margin:0 0 6px 2px;
  letter-spacing:.25px
}
.hourly-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  touch-action:pan-x;
}
.hourly-scroll::-webkit-scrollbar{display:none}
.hours{
  height:100%;
  display:flex;
  gap:4px;
  width:max-content;
}
.hour{
  width:var(--kachel);
  flex:0 0 var(--kachel);
  background:linear-gradient(180deg,var(--panel3),var(--panel2));
  border:1px solid #46546a;
  border-radius:8px;
  padding:6px 1px 4px;
  text-align:center;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  align-items:center;
  min-width:0
}
.hour.night{background:linear-gradient(180deg,#161d29,#111722);border-color:#364254}
.hour .t{font-size:11px;color:#d5dce4;font-weight:600;font-variant-numeric:tabular-nums}
.hour .icon{line-height:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hour .icon .wicon{width:var(--wsize);height:var(--wsize);max-width:100%;max-height:100%;display:block}
.hour .deg{font-size:16px;font-weight:750;line-height:20px;font-variant-numeric:tabular-nums}

/* Tap any tile to see every value the model delivers for it. */
/* the card takes the height of its content and centres itself, instead of
   stretching to a fixed share of the screen and leaving half of it black */
.diag{
  position:fixed;z-index:1000;left:4.5%;right:4.5%;top:50%;
  transform:translateY(-50%);max-height:93%;overflow:auto;
  background:rgba(7,11,17,.975);border:1px solid #5b6b81;border-radius:14px;
  padding:15px 24px 13px;display:none;
  font-size:15px;line-height:1.7;color:#e6ecf3
}
.diag.on{display:block}
.diag h4{margin:0;font-size:21px;font-weight:750;color:#fff}
.diag .why{margin:2px 0 11px;color:var(--yellow);font-weight:650;font-size:14px}
.diag .rows{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);
  gap:2px 22px;align-content:start
}
.diag .k{color:#9dabbb;white-space:nowrap}
.diag .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diag .src{margin-top:10px;font-size:11px;color:#7d8896}
.diag .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 34px;margin-top:6px}
/* a line of 60 to 70 characters reads comfortably; the full column would run
   past 100 and force the eye to hunt for the next line */
.diag .story{font-size:17px;line-height:1.65;color:#dfe6ef;max-width:64ch}
.diag .rows.two{grid-template-columns:auto minmax(0,1fr)}
.diag .close{position:absolute;right:16px;top:12px;color:#9dabbb;font-size:11px}

/*
  Stunden- und Tagesleiste stehen auf demselben Zwoelferraster: die Karte
  belegt fuenf Spalten, die sieben Tage je eine. Dadurch steht jede
  Tageskachel genau unter einer Stundenkachel. Die elf Pixel Zuschlag gleichen
  den Rand der Kaesten aus, der breiter ist als der Kachelabstand.
*/
.bottom-grid{display:grid;grid-template-columns:calc(5*var(--kachel) + 14px) minmax(0,1fr);
             gap:6px;min-height:0}
.linkezelle{display:flex;gap:2px;min-width:0;min-height:0}
.linkezelle .radarbox{flex:1 1 auto;min-width:0}
/* Ohne Titelzeile ist der Kasten nur noch ein Rahmen um die Karte, der Rand
   darf deshalb schmal sein. Was hier wegfaellt, bekommt die Karte. */
.radarbox{
  background:#0f151d;border:1px solid #3e4a5b;border-radius:13px;
  padding:3px;min-height:0;overflow:hidden;position:relative;
  display:flex;flex-direction:column
}
.radar-stage{
  flex:1 1 auto;min-height:0;position:relative;border-radius:10px;
  background:#101720;overflow:hidden;border:1px solid #334155
}
#cloudMap{width:100%;height:100%;background:#111820}
/* smooth-scaled interpolated field instead of visible grid squares */
.cloudfield{image-rendering:auto;filter:blur(1.5px)}
.radar-time{
  position:absolute;z-index:800;left:10px;bottom:9px;background:rgba(5,8,12,.88);
  border:1px solid #536276;border-radius:7px;padding:4px 8px;
  font-size:12px;font-weight:700;color:#fff
}
.radar-legend{
  position:absolute;z-index:800;right:10px;bottom:9px;background:rgba(5,8,12,.82);
  border-radius:6px;padding:4px 7px;font-size:9px;color:#d5dee8
}
.radar-msg{
  position:absolute;z-index:801;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(5,8,12,.92);border:1px solid #536276;border-radius:8px;
  padding:7px 10px;font-size:11px;color:#fff;display:none;text-align:center;max-width:80%
}
.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.70)!important}
.days-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  touch-action:pan-x;
}
.days-scroll::-webkit-scrollbar{display:none}
.days{
  height:100%;
  display:flex;
  gap:4px;
  width:max-content;
}
.day{
  width:var(--kachel);
  flex:0 0 var(--kachel);
  background:linear-gradient(180deg,#222d3d,#1a2230);
  border:1px solid #4b5a70;
  border-radius:11px;
  padding:7px 3px;
  text-align:center;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  align-items:center;
  min-width:0
}
.day.trend{opacity:.72;border-style:dashed}
.day .name{font-size:13px;font-weight:750;color:#f5f7f9}
.day .icon{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.day .icon{position:relative}
.day .icon .wicon{width:var(--wsize);height:var(--wsize);max-width:100%;max-height:100%;display:block}
.day .temps{font-size:15px;font-weight:750;line-height:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.day .lbl{gap:2.5px;letter-spacing:-.15px}

/* Drei Tagesabschnitte untereinander: Vormittag, Nachmittag, Abend. */
.teile{display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center}
.teile .wicon{width:var(--wsize);height:var(--wsize);display:block}
.day .temps .slash{color:#7a8798}

/*
  Alle Wertzeilen einer Kachel in einem Raster. Einzeln zentrierte Zeilen
  standen treppenartig versetzt, weil die Werte verschieden breit sind.
*/
.werte{display:grid;grid-template-columns:auto auto;column-gap:3.5px;align-items:center;
       justify-content:center;font-size:11px;color:#9fb0c4;white-space:nowrap;
       letter-spacing:-.15px;line-height:1.45}
.werte .i{display:flex;align-items:center;justify-content:center;line-height:0}
.werte .v{text-align:left;font-variant-numeric:tabular-nums}
.werte .rain{color:var(--blue)} .werte .sun{color:var(--yellow)} .werte .wind{color:var(--orange)}
.werte .mi{width:11px;height:11px;display:block}
.werte .mi.sock{width:14px;height:10px}

/* Legendenspalte: senkrechte Woerter, ausserhalb des Scrollbereichs. */
.day.legende{background:none;border:none;box-shadow:none;flex:0 0 17px;width:17px;
             padding:7px 0;opacity:.95}
.day.legende .name,.day.legende .temps,.day.legende .werte{visibility:hidden}
.day.legende .teile{width:100%}
.day.legende .zeile{height:var(--wsize);display:flex;align-items:center;justify-content:center;
                    font-size:9px;font-weight:700;color:#93a0b0;letter-spacing:.3px;
                    white-space:nowrap;writing-mode:vertical-rl}

/* shown until the page runs without browser chrome; any tap takes it there,
   and this is a real target so a deliberate tap cannot miss */
#hint{
  position:fixed;z-index:1200;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(12,18,26,.97);border:1px solid #6d7f96;border-radius:14px;
  padding:18px 30px;font-size:18px;font-weight:700;color:#e6ecf3;
  text-align:center;line-height:1.45;
  box-shadow:0 10px 40px rgba(0,0,0,.55);
  cursor:pointer;-webkit-user-select:none;user-select:none
}
#hint small{display:block;margin-top:5px;font-size:12.5px;font-weight:500;color:#9dabbb}
#hint[hidden]{display:none}
</style>
</head>
<body>
<div id="app">
<header>
  <div>
    <div class="place">Uedorf</div>
    <div class="clock" id="clock">--:--</div>
    <div class="date"><span id="date"></span><span id="stand"></span></div>
  </div>

  <div class="current">
    <div class="icon" id="nowIcon">--</div>
    <div class="temp" id="nowTemp">--&deg;</div>
    <div class="details" id="nowDetails">lade Wetter&hellip;</div>
  </div>

  <div class="today" id="today" role="button">
    <div class="summary" id="summary">Heute: lade Prognose&hellip;</div>
    <div class="sub" id="todaySub"></div>
    <div class="extra" id="todayExtra"></div>
  </div>
</header>

<section class="box">
  <div class="hourly-scroll" id="hourlyScroll"><div class="hours" id="hours"></div></div>
</section>

<section class="bottom-grid">
  <div class="linkezelle">
    <div class="radarbox">
      <div class="radar-stage">
        <div id="cloudMap"></div>
        <div class="radar-time" id="radarTime">Wolken laden&hellip;</div>
        <div class="radar-legend" id="radarLegend">grau = Wolken &middot; blau/gelb/rot = Niederschlag</div>
        <div class="radar-msg" id="radarMsg"></div>
      </div>
    </div>
    <!-- Feste Legende fuer die drei Tagesabschnitte. Sie steht ausserhalb des
         Scrollbereichs und bleibt beim Wischen durch 14 Tage stehen. Der
         Aufbau spiegelt eine Tageskachel, damit die Woerter genau neben den
         Symbolen sitzen. -->
    <div class="day legende" aria-hidden="true">
      <div class="name">&nbsp;</div>
      <div class="icon"><div class="teile">
        <div class="zeile">Vormittag</div>
        <div class="zeile">Nachmittag</div>
        <div class="zeile">Abend</div>
      </div></div>
      <div class="temps">0&deg;/0&deg;</div>
      <div class="werte"><span class="i"></span><span class="v">0</span>
        <span class="i"></span><span class="v">0</span>
        <span class="i"></span><span class="v">0</span></div>
    </div>
  </div>
  <div class="box">
    <div class="days-scroll" id="daysScroll"><div class="days" id="days"></div></div>
  </div>
</section>

<div id="hint" role="button" hidden>Vollbild starten<small>hier oder irgendwo tippen</small></div>
<div class="diag" id="diag"><span class="close">antippen zum Schlie&szlig;en</span><div id="diagBody"></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const LAT=50.76,LON=7.00,REFRESH_MS=600000;

/*
  Wettersymbole werden zusammengesetzt, nicht aus einer festen Liste gewaehlt.

  Zwei Achsen, die sich nicht gegenseitig verdraengen: der Himmel in fuenf
  Stufen von klar bis bedeckt, und was herunterfaellt. Vorher gewann genau ein
  Name aus acht, deshalb loeschte ein einzelner Regentropfen die gesamte
  Himmelsinformation und ein sonniger Tag mit einem Schauer sah aus wie
  Dauerregen. Wind und Frost sitzen als Zeichen im selben Bild.

  Aufruf entweder mit einem alten Namen ("clear", "rain", ...) oder mit
  {sky, wet, storm, night, wind, frost}.
*/
const SKY_SUN=`<circle cx="32" cy="32" r="10" fill="#FFD65A"/>
  <g stroke="#FFD65A" stroke-width="3" stroke-linecap="round">
    <path d="M32 7v7M32 50v7M7 32h7M50 32h7M14.3 14.3l5 5M44.7 44.7l5 5M49.7 14.3l-5 5M19.3 44.7l-5 5"/>
  </g>`;
const SKY_MOON=`<g transform="translate(-6 0)"><path d="M40 14 A18 18 0 1 0 40 50 A22 22 0 0 1 40 14 Z" fill="#E9EEF6"/></g>`;
const SKY_STARS=`<g fill="#C9D6EA"><circle cx="48" cy="16" r="2"/><circle cx="55" cy="27" r="1.5"/><circle cx="44" cy="30" r="1.2"/></g>`;
const SKY_CLOUD_D=`M18 45h28c8 0 14-5 14-12s-6-12-13-12c-2 0-4 .4-5.7 1.3C38.4 16.8 33.2 14 27.5 14 19 14 12 21 12 29.5v.6C6.8 31.3 3 35.8 3 41c0 2.5.8 4.8 2.3 6.8C8 44.7 12.5 45 18 45z`;
const SKY_CLOUD =`<path d="${SKY_CLOUD_D}" fill="#E8EDF3"/>`;
const SKY_CLOUD_G=`<path d="${SKY_CLOUD_D}" fill="#B8C2CF"/>`;
const SKY_FOG=`<g stroke="#C7D0DA" stroke-width="3" stroke-linecap="round">
    <path d="M10 42h44M14 49h36M19 56h26"/></g>`;
const SKY_BOLT=`<path d="M34 42h10l-8 10h6L29 63l4-13h-7z" fill="#FFD65A"/>`;

/* Staerke ueber Laenge und Zahl der Striche, nicht ueber die Farbe: aus vier
   Metern ist Laenge lesbar, ein Blauton nicht. */
function nassStriche(art){
  const P={niesel:{n:3,lang:5,dick:3,farbe:"#8FD8FF"},
           regen:{n:3,lang:9,dick:4,farbe:"#65C7FF"},
           viel:{n:4,lang:12,dick:4.5,farbe:"#65C7FF"}}[art];
  if(!P) return "";
  const breite=P.n===4?36:26, start=32-breite/2;
  let d="";
  for(let i=0;i<P.n;i++) d+=`M${start+i*(breite/(P.n-1))} 48l-${(P.lang*0.38).toFixed(1)} ${P.lang}`;
  return `<g stroke="${P.farbe}" stroke-width="${P.dick}" stroke-linecap="round"><path d="${d}"/></g>`;
}
function nassFlocken(viel){
  const n=viel?5:3, breite=viel?42:26, start=32-breite/2, r=viel?3.6:4.4;
  let d="";
  for(let i=0;i<n;i++){
    const x=start+i*(breite/(n-1)), y=51+(i%2)*3;
    d+=`M${x} ${y-r}v${2*r}M${x-r} ${y}h${2*r}`;
  }
  return `<g stroke="#D9F2FF" stroke-width="${viel?2.4:3}" stroke-linecap="round"><path d="${d}"/></g>`;
}
/*
  Windsack statt Wimpel: das Zeichen vom Flugplatz, mit der Streifung schon
  eingebaut. Weiss und grau bei Wind, weiss und rot bei Sturm. Duenne dunkle
  Kontur, sonst verschwindet er auf einer hellen Wolke.
*/
function windsack(stufe){
  if(!stufe) return "";
  const zweite=stufe>=2?"#FF5B4E":"#AEB8C5";
  const x0=3.6,x1=23.4, h=x=>5.6-3.6*(x-x0)/(x1-x0);
  let baender="";
  for(let i=0;i<4;i++){
    const a=x0+(x1-x0)*i/4, b=x0+(x1-x0)*(i+1)/4;
    baender+=`<path d="M${a.toFixed(2)} ${(7-h(a)).toFixed(2)}L${b.toFixed(2)} ${(7-h(b)).toFixed(2)}`+
             `L${b.toFixed(2)} ${(7+h(b)).toFixed(2)}L${a.toFixed(2)} ${(7+h(a)).toFixed(2)}Z"`+
             ` fill="${i%2?zweite:"#FFFFFF"}" stroke="#222B38" stroke-width=".55"/>`;
  }
  return `<g><path d="M2.0 1.0v18.4" stroke="#222B38" stroke-width="3.3" stroke-linecap="round"/>`+
    `<path d="M2.0 1.0v18.4" stroke="#E8EDF3" stroke-width="1.9" stroke-linecap="round"/>`+
    baender+`<path d="M3.6 1.4L3.6 12.6" stroke="#E8EDF3" stroke-width="1.2" stroke-linecap="round"/></g>`;
}
function frostKristall(stufe){
  if(!stufe) return "";
  const farbe=stufe>=2?"#5FB7FF":"#9EC9E8";
  return `<g stroke="${farbe}" stroke-width="1.7" stroke-linecap="round">
    <path d="M9 1.6v14.8M2.6 5.3l12.8 7.8M15.4 5.3L2.6 13.1"/>
    <path d="M6.9 3.4 9 5.1l2.1-1.7M6.9 14.6 9 12.9l2.1 1.7
             M3.3 7.9 3.0 5.5l2.4.1M14.7 7.9l.3-2.4-2.4.1
             M3.3 10.5 3.0 12.9l2.4-.1M14.7 10.5l.3 2.4-2.4-.1" stroke-width="1.3"/></g>`;
}

/* Lage von Sonne und Wolke je Himmelsstufe. Die Wolke waechst und schiebt
   sich vor die Sonne, statt dass ein Symbol das andere ersetzt. */
const SKY_LAGE=[
  {sonne:[0,0,1],      wolke:null},
  {sonne:[-1,-3,.88],  wolke:[20,22,.52]},
  {sonne:[-2,-3,.80],  wolke:[7,8,.82]},
  {sonne:[-1,0,.60],   wolke:[1,2,.98]},
  {sonne:null,         wolke:[0,1,1]}
];
const svgG=(t,inhalt)=>t?`<g transform="translate(${t[0]} ${t[1]}) scale(${t[2]})">${inhalt}</g>`:inhalt;
/* Der Niederschlag haengt am Wolkenrand und folgt der Wolke in Groesse und
   Lage, sonst haengen die Tropfen bei kleiner Wolke in der Luft. */
function nassLage(w){
  const [tx,ty,sc]=w, mitteX=31.5*sc+tx, unten=47.5*sc+ty, ds=Math.max(.66,sc);
  return [mitteX-32*ds, unten+1.5-48*ds, ds];
}

const LEGACY={
  clear:{sky:0}, partly:{sky:2}, cloud:{sky:4},
  night_clear:{sky:0,night:true}, night_partly:{sky:2,night:true},
  fog:{fog:true}, drizzle:{sky:3,wet:"niesel"}, rain:{sky:4,wet:"regen"},
  snow:{sky:4,wet:"schnee"}, storm:{sky:4,wet:"regen",storm:true}
};

function weatherIcon(spec, cls="wicon"){
  if(typeof spec==="string") spec=LEGACY[spec]||{sky:2};
  const common=`class="${cls}" viewBox="0 0 64 64" aria-hidden="true"`;
  if(spec.fog) return `<svg ${common}>${svgG([0,-2,.95],SKY_CLOUD_G)}${svgG([0,-2,.95],SKY_FOG)}</svg>`;

  let stufe=Math.max(0,Math.min(4,Number(spec.sky||0)));
  const nass=spec.wet||"", blitz=!!spec.storm;
  if(nass||blitz) stufe=Math.max(stufe,1);         /* es braucht eine Wolke */
  const L=SKY_LAGE[stufe], teile=[];
  if(L.sonne){
    if(spec.night){ teile.push(SKY_STARS); teile.push(svgG(L.sonne,SKY_MOON)); }
    else teile.push(svgG(L.sonne,SKY_SUN));
  }
  if(L.wolke) teile.push(svgG(L.wolke,(nass||blitz)?SKY_CLOUD_G:SKY_CLOUD));
  if(L.wolke&&(nass||blitz)){
    const lg=nassLage(L.wolke);
    if(nass==="schnee"||nass==="schnee-viel") teile.push(svgG(lg,nassFlocken(nass==="schnee-viel")));
    else if(nass) teile.push(svgG(lg,nassStriche(nass)));
    if(blitz) teile.push(svgG(lg,SKY_BOLT));
  }
  if(spec.frost) teile.push(`<g transform="translate(0 0) scale(.95)">${frostKristall(spec.frost)}</g>`);
  if(spec.wind)  teile.push(`<g transform="translate(37 0) scale(1.05)">${windsack(spec.wind)}</g>`);
  return `<svg ${common}>${teile.join("")}</svg>`;
}

/*
  Windstufe fuer den Windsack im Symbol, an der Beaufortskala und den
  Warnstufen des DWD orientiert. Die Wertzeile faerbt sich schon ab 35 km/h in
  Boeen ein, das ist fuer ein Zeichen am Symbol zu frueh.
*/
function windLevel(speed,gust){
  speed=Number(speed||0); gust=Number(gust||0);
  if(gust>=55||speed>=34) return 2;
  if(gust>=38||speed>=24) return 1;
  return 0;
}
/* Frost wie der Wind in zwei Stufen: Bodenfrost und echter Frost. */
function frostLevel(tmin){
  tmin=Number(tmin);
  if(!isFinite(tmin)) return 0;
  if(tmin<0) return 2;
  if(tmin<=3) return 1;
  return 0;
}
/* Temperaturfarbe: warm nach rot, mild nach gruen, kalt nach blau. Stufen
   statt weichem Verlauf, sonst sind benachbarte Werte nicht zu trennen. */
function tempFarbe(t){
  t=Number(t);
  if(!isFinite(t)) return "var(--text)";
  if(t>=30) return "#FF3B30";
  if(t>=25) return "#FF6A3D";
  if(t>=20) return "#FF9A3C";
  if(t>=16) return "#E8C13C";
  if(t>=5)  return "#4CC76A";
  if(t>=0)  return "#5FD0C8";
  if(t>=-8) return "#58B0FF";
  return "#8E9BFF";
}
const tempSpan=v=>`<span style="color:${tempFarbe(v)}">${deg(v)}</span>`;

const ICON_LABEL={
  clear:"sonnig", partly:"sonnig mit Wolken", cloud:"bedeckt",
  night_clear:"klare Nacht", night_partly:"Nacht, teils Wolken",
  fog:"neblig", drizzle:"Nieselregen", rain:"Regen", snow:"Schnee", storm:"Gewitter"
};

function wmoText(c){
  c=Number(c);
  if(c===0)return"klar";
  if(c===1)return"überwiegend klar";
  if(c===2)return"teils bewölkt";
  if(c===3)return"bedeckt";
  if([45,48].includes(c))return"Nebel";
  if([51,53,55].includes(c))return"Nieselregen";
  if([56,57].includes(c))return"gefrierender Niesel";
  if([61,63,65].includes(c))return"Regen";
  if([66,67].includes(c))return"gefrierender Regen";
  if([71,73,75,77].includes(c))return"Schnee";
  if([80,81,82].includes(c))return"Regenschauer";
  if([85,86].includes(c))return"Schneeschauer";
  if([95,96,99].includes(c))return"Gewitter";
  return"unbekannt ("+c+")";
}

/*
  Icon selection.

  Cloud cover percentages alone are a bad predictor of "do I see the sun".
  Open-Meteo/ICON regularly reports 80-100 % total cover for an hour that also
  carries 60 minutes of sunshine duration and 550 W/m2 of shortwave radiation.
  So for daylight hours the sky symbol is derived from how much solar energy
  actually reaches the ground, measured against the clear-sky maximum
  (terrestrial_radiation is the extraterrestrial value; ~0.78 of it arrives on a
  clean, cloud-free day). Cloud cover only caps the "fully sunny" case.
  At night there is no radiation signal, so total cloud cover is all we have.
*/
const CLEAR_SKY_FACTOR=0.78;

function skyDecision(o){
  const code=Number(o.code||0);
  const precip=Number(o.precip||0), pop=Number(o.pop||0);
  const toa=Number(o.toa||0), swrad=Number(o.swrad||0);
  const tot=Number(o.tot||0);
  /* the hour counts as daylight when its midpoint lies between sunrise and
     sunset; radiation is only the fallback when those times are missing */
  const day=typeof o.isDay==="boolean"?o.isDay:toa>15;

  const clearSky=toa>0?CLEAR_SKY_FACTOR*toa:0;
  const ratio=clearSky>0?Math.min(1.25,swrad/clearSky):0;
  const sunFrac=Math.max(0,Math.min(1,Number(o.sunSec||0)/3600));
  const brightness=Math.max(ratio,sunFrac*0.55);

  /*
    Himmelsstufe 0 bis 4 aus der Bewoelkung, nach oben korrigiert, wenn die
    Strahlung trotz gemeldeter Wolken hoch ist. Damit bekommen auch die
    Stundenkacheln die fuenf Abstufungen statt nur klar, Mix und bedeckt.
  */
  let stufe = tot<15?0 : tot<40?1 : tot<65?2 : tot<88?3 : 4;
  if(day&&brightness>=0.70&&stufe>1) stufe=1;
  const d={ratio,sunFrac,brightness,clearSky,day,stufe};

  /* Der Name bleibt fuer die Beschriftung erhalten, dazu kommt die Vorschrift
     fuer das zusammengesetzte Symbol. */
  const mit=(icon,spec,why)=>({...d,icon,spec:{sky:stufe,night:!day,...spec},why});

  if([95,96,99].includes(code))                 return mit("storm",  {wet:"regen",storm:true}, "WMO-Code "+code+" = Gewitter");
  if([71,73,75,77,85,86].includes(code))        return mit("snow",   {wet:precip>=3?"schnee-viel":"schnee"}, "WMO-Code "+code+" = Schnee");
  if([61,63,65,66,67,80,81,82].includes(code))  return mit("rain",   {wet:precip>=2.5?"viel":"regen"}, "WMO-Code "+code+" = Regen");
  if(precip>=0.3)                               return mit("rain",   {wet:precip>=2.5?"viel":"regen"}, n1(precip)+NB+"mm Niederschlag");
  if([51,53,55,56,57].includes(code)||precip>0) return mit("drizzle",{wet:"niesel"}, "leichter Niederschlag ("+n1(precip)+NB+"mm)");
  if([45,48].includes(code))                    return mit("fog",    {fog:true}, "WMO-Code "+code+" = Nebel");
  if(pop>=75)                                   return mit("rain",   {wet:"regen"}, "Regenrisiko "+pop+" %");

  if(!day){
    if(tot<25)  return mit("night_clear", {sky:0}, "Nacht, "+Math.round(tot)+" % Bewölkung");
    if(tot<75)  return mit("night_partly",{sky:2}, "Nacht, "+Math.round(tot)+" % Bewölkung");
    return        mit("cloud",            {sky:4}, "Nacht, "+Math.round(tot)+" % Bewölkung");
  }

  /* near sunrise and sunset the long atmospheric path depresses the radiation
     ratio, so a nearly cloud-free sky is trusted on cloud cover alone */
  if(tot<25)
    return mit("clear", {}, `nur ${Math.round(tot)} % Bewölkung`);
  if(brightness>=0.70&&tot<50)
    return mit("clear", {}, `Helligkeit ${(brightness*100).toFixed(0)} % vom Klarhimmel, nur ${Math.round(tot)} % Bewölkung`);
  if(brightness>=0.40||tot<75)
    return mit("partly",{}, `Helligkeit ${(brightness*100).toFixed(0)} % vom Klarhimmel bei ${Math.round(tot)} % Bewölkung`);
  return   mit("cloud", {}, `nur ${(brightness*100).toFixed(0)} % Helligkeit bei ${Math.round(tot)} % Bewölkung`);
}

/*
  Which day does the header talk about?

  Until eight in the evening it is the current day. After that the day is
  practically over and the header switches to the next one. It stays there
  through the night without a second rule: at one in the morning the calendar
  day has already advanced, so the day being described is the current date
  again.
*/
const OUTLOOK_SWITCH_HOUR=20;
const isoDay=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
function outlookDate(now=new Date()){
  const t=new Date(now);
  if(now.getHours()>=OUTLOOK_SWITCH_HOUR) t.setDate(t.getDate()+1);
  return t;
}

let outlookKey="";

function tick(){
  let n=new Date();
  clock.textContent=n.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  date.textContent=n.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit"});
  /* switch the header to the next day the moment the hour arrives, rather than
     waiting for the ten minute refresh */
  if(outlookKey&&isoDay(outlookDate(n))!==outlookKey) renderOutlook();
}
tick();
setInterval(tick,1000);

function hh(s){return s.slice(11,16)}
function dow(s){
  return new Date(s+"T12:00").toLocaleDateString("de-DE",{weekday:"short"})
}

/*
  Every small label on the page uses this icon set. They are inline SVG rather
  than text glyphs because the tablet font has no umbrella or sun character and
  silently substituted an arrow and an asterisk. All of them paint in
  currentColor, so an icon can never drift away from the colour of its row.
*/
function mi(kind){
  const a='viewBox="0 0 16 16" aria-hidden="true"';
  if(kind==="drop") return `<svg class="mi" ${a}><path d="M8 1.5c2.7 3.4 4.1 5.7 4.1 7.5a4.1 4.1 0 0 1-8.2 0C3.9 7.2 5.3 4.9 8 1.5z" fill="currentColor"/></svg>`;
  if(kind==="sun")  return `<svg class="mi" ${a}><circle cx="8" cy="8" r="3.1" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 .8v2.1M8 13.1v2.1M.8 8h2.1M13.1 8h2.1M2.9 2.9l1.5 1.5M11.6 11.6l1.5 1.5M13.1 2.9l-1.5 1.5M4.4 11.6l-1.5 1.5"/></g></svg>`;
  if(kind==="sock") return `<svg class="mi sock" viewBox="0 0 20 14" aria-hidden="true"><path d="M2.3 1.2v11.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M3.7 2.4 L17.4 4.7 L14.7 10.2 L3.7 8.6 Z" fill="currentColor" opacity=".9"/></svg>`;
  if(kind==="up")   return `<svg class="mi" ${a}><path d="M8 3.2 3.6 8.4h8.8z" fill="currentColor"/><path d="M2.6 12.4h10.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  if(kind==="down") return `<svg class="mi" ${a}><path d="M8 9.2 3.6 4h8.8z" fill="currentColor"/><path d="M2.6 12.4h10.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  if(kind==="bolt") return `<svg class="mi" ${a}><path d="M9.4 1 3.8 9h3.3l-1 6 6.1-8.6H8.7z" fill="currentColor"/></svg>`;
  return "";
}

/* German number formatting, with a narrow no-break space before every unit so a
   value and its unit can never be split across two lines. */
const NB="\u202f";
const n1=v=>Number(v||0).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const n0=v=>Math.round(Number(v||0)).toLocaleString("de-DE");
const n1p=v=>Number(v||0).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1,useGrouping:false});
const COMPASS=["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function dirText(d){
  if(d==null) return "–";
  const x=((Number(d)%360)+360)%360;
  return `${Math.round(x)}° ${COMPASS[Math.round(x/22.5)%16]}`;
}
const orDash=(v,fn)=>v==null?"–":fn(v);
const pct=v=>Math.round(Number(v||0))+NB+"%";
const deg=v=>Math.round(Number(v||0))+"°";

/* one label row: icon, value, and a colour only when the value is notable */
/*
  Alle Wertzeilen einer Kachel in einem einzigen Raster.

  Einzeln zentrierte Zeilen standen treppenartig versetzt, weil "0 %",
  "10,9 h" und "14/40" verschieden breit sind. Hier richten sich beide Spalten
  nach ihrem breitesten Inhalt, dadurch steht Zeichen unter Zeichen und Ziffer
  unter Ziffer, und zentriert wird nur der Block als Ganzes.
*/
function werteBlock(zeilen){
  return `<div class="werte">`+zeilen.map(([kind,text,akzent])=>{
    const k=akzent?" "+akzent:"";
    return `<span class="i${k}">${mi(kind)}</span><span class="v${k}">${text}</span>`;
  }).join("")+`</div>`;
}
function windSignificant(speed,gust){
  speed=Number(speed||0); gust=Number(gust||0);
  return gust>=35||speed>=20;
}
/* Always speed and gust, always the same shape. The unit lives in the panel
   title, not on 21 individual cards. */
function windText(speed,gust){
  return Math.round(Number(speed||0))+"/"+Math.round(Number(gust||0));
}

/* ---------- detail panel ---------- */
let diagTimer=null;
let srcNote="DWD ICON via Open-Meteo";
let lastGood="";
let lastError=null;
let lastGoodAt=0;

/*
  Event log for diagnosis.

  The friendly message in the header stays short, but a wall tablet gives no
  way to open a console, so every fetch records what happened. Tapping the
  message opens the raw record, which can be photographed and read back.
  The log survives a reload because it lives in localStorage.
*/
const DIAG_KEY="wetter.diag.v1", DIAG_MAX=60;
let diagEvents=[];
try{ diagEvents=JSON.parse(localStorage.getItem(DIAG_KEY)||"[]")||[]; }catch(e){ diagEvents=[]; }

function diagPush(ev){
  ev.t=Date.now();
  ev.on=navigator.onLine!==false;
  const last=diagEvents[diagEvents.length-1];
  /*
    Successful fetches are the overwhelming majority: two every ten minutes
    plus one per hour for the map. Logging each of them would push a night-time
    failure out of the buffer before morning. A run of successes from the same
    source is therefore folded into one entry with a counter, so the log keeps
    reaching back days while every failure stays individually visible.
  */
  if(ev.kind==="ok"&&last&&last.kind==="ok"){
    if(last.src!==ev.src) last.src="Abrufe";
    if(!last.t0) last.t0=last.t;
    last.t=ev.t; last.ms=ev.ms; last.n=(last.n||1)+1; last.on=ev.on;
  }else{
    diagEvents.push(ev);
  }
  while(diagEvents.length>DIAG_MAX) diagEvents.shift();
  try{ localStorage.setItem(DIAG_KEY,JSON.stringify(diagEvents)); }catch(e){}
}

/* classify a failed request instead of letting every problem look the same */
async function fetchJson(url,label){
  const t0=Date.now();
  let r;
  try{
    r=await fetch(url,{cache:"no-store"});
  }catch(e){
    const m=`${e.name||"Error"}: ${e.message||"fetch abgebrochen"}`;
    diagPush({src:label,kind:"netz",msg:m,ms:Date.now()-t0});
    throw new Error(`${label}: ${m}`);
  }
  if(!r.ok){
    const m=`HTTP ${r.status}${r.statusText?" "+r.statusText:""}`;
    diagPush({src:label,kind:"http",msg:m,ms:Date.now()-t0,status:r.status});
    throw new Error(`${label}: ${m}`);
  }
  let j;
  try{
    j=await r.json();
  }catch(e){
    diagPush({src:label,kind:"json",msg:"Antwort unlesbar: "+e.message,ms:Date.now()-t0});
    throw new Error(`${label}: Antwort unlesbar`);
  }
  const probe=Array.isArray(j)?j[0]:j;
  if(probe&&probe.error){
    const m=String(probe.reason||"API meldet Fehler");
    diagPush({src:label,kind:"api",msg:m,ms:Date.now()-t0});
    throw new Error(`${label}: ${m}`);
  }
  diagPush({src:label,kind:"ok",msg:"geladen",ms:Date.now()-t0});
  return j;
}
/* prepared days, keyed by ISO date, so the header can reuse a day card's
   figures without recomputing them */
const dayCache={};

/* Which build is this tablet actually running? document.lastModified carries
   the Last-Modified header of this file, so the stamp needs no build step and
   cannot drift. It settles the question of whether a reload picked up a deploy
   or the browser served an old tab. */
function buildStamp(){
  try{
    const d=new Date(document.lastModified);
    if(isNaN(d)) return "";
    return " · Build "+d.toLocaleString("de-DE",
      {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  }catch(e){ return ""; }
}

function showDetail(title,why,pairs,note,narrative){
  const rows=pairs.map(([k,v])=>`<div class="k">${k}</div><div class="v">${v}</div>`).join("");
  diagBody.innerHTML=
    `<h4>${title}</h4>`+
    (narrative
      /* running text and figures side by side, so a wide panel stays readable */
      ? `<div class="split"><div class="story">${narrative}</div><div class="rows two">${rows}</div></div>`
      : (why?`<div class="why">${why}</div>`:`<div class="why">&nbsp;</div>`)+`<div class="rows">${rows}</div>`)+
    `<div class="src">${note}${buildStamp()}</div>`;
  diag.classList.add("on");
  clearTimeout(diagTimer);
  diagTimer=setTimeout(()=>diag.classList.remove("on"),40000);
}
diag.addEventListener("click",()=>{diag.classList.remove("on");clearTimeout(diagTimer)});
today.addEventListener("click",()=>showOutlookDetail());
stand.addEventListener("click",ev=>{ ev.stopPropagation(); showDiagnostics(); });

/*
  Both strips scroll sideways and nothing ever scrolled them back. A swipe
  ahead to tomorrow therefore survived every ten-minute refresh: the tiles are
  rebuilt inside a single synchronous block, so the browser never re-clamps
  scrollLeft and the old offset outlives its content. On a wall tablet that
  looks exactly like a stale forecast. Each strip now returns to the start
  once nobody has touched it for two minutes, which leaves a deliberate swipe
  alone while someone is still reading it.
*/
const STRIP_IDLE=120000;
[hourlyScroll,daysScroll].forEach(el=>{
  let touched=0;
  const mark=()=>{touched=Date.now()};
  ["pointerdown","touchstart","wheel"].forEach(t=>el.addEventListener(t,mark,{passive:true}));
  setInterval(()=>{
    if(el.scrollLeft<=0||Date.now()-touched<STRIP_IDLE) return;
    try{ el.scrollTo({left:0,behavior:"smooth"}); }
    catch(e){ el.scrollLeft=0; }
  },15000);
});
