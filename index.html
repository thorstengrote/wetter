/*
  Wie oft Prognose und Trend geholt werden.

  Open-Meteo erlaubt 10 000 Abrufe am Tag. Am 27.09.2026 war das Limit um
  19:09 erschoepft. Nachts kamen 41 Abrufe in der Stunde an, nach der Uhr
  waeren es 12 gewesen. Wahrscheinlich der Neuladen bei jedem Sichtbarwerden der Seite,
  der nicht nachsah, wann zuletzt geladen wurde. Jetzt geht jeder Anstoss
  ausser dem Nachversuch ueber faellig(). Zwischen 1 und 5 Uhr schaut niemand
  auf die Wand, dann reicht einmal in der Stunde.
*/
const NACHT_VON=1, NACHT_BIS=5;
const istNacht=()=>{ const h=new Date().getHours(); return h>=NACHT_VON&&h<NACHT_BIS; };
let letzterAbruf=0;
function faellig(){
  const abstand=istNacht()?60*60000:REFRESH_MS;
  return Date.now()-letzterAbruf>=abstand-60000;
}
function ladeWennFaellig(){ if(faellig()) loadWeather(); }

async function loadWeather(){
  letzterAbruf=Date.now();
  try{

    const [d,trend]=await Promise.all([
      fetchJson(ICON_URL,"Prognose"),
      fetchJson(TREND_URL,"Trend").catch(()=>null)
    ]);

    const H=d.hourly;

    /* UV comes from the trend model, keyed by timestamp and by date */
    const uvHour={}, uvDay={};
    if(trend){
      (trend.hourly?.time||[]).forEach((t,k)=>{
        const v=trend.hourly.uv_index?.[k];
        if(v!=null) uvHour[t]=v;
      });
      (trend.daily?.time||[]).forEach((t,k)=>{
        const v=trend.daily.uv_index_max?.[k];
        if(v!=null) uvDay[t]=v;
      });
    }

    const sunMap={};
    (d.daily.time||[]).forEach((day,k)=>{
      const a=d.daily.sunrise?.[k], b=d.daily.sunset?.[k];
      if(a&&b) sunMap[day]={rise:new Date(a).getTime(),set:new Date(b).getTime()};
    });
    const isDayHour=iso=>{
      const s=sunMap[iso.slice(0,10)];
      if(!s) return null;
      const mid=new Date(iso).getTime()+1800000;
      return mid>=s.rise&&mid<=s.set;
    };

    /* Was eine Stunde zusammenfasst, gilt bei Open-Meteo fuer die Stunde vor
       dem Zeitstempel: Niederschlag, seine Wahrscheinlichkeit, der Wettercode,
       Sonnenschein und Strahlung. Die Kachel "15 Uhr" meint aber 15 bis 16
       Uhr, und das Symbol "jetzt" die laufende Stunde. Deshalb kommen diese
       Werte aus dem naechsten Zeitstempel. Temperatur, Wolken und Wind sind
       Augenblickswerte und bleiben, wo sie sind.
       Geprueft Mai bis September 2026 gegen drei DWD-Stationen: der
       Niederschlag passt zur Stunde davor mit r = 0,69, zur Stunde danach
       mit 0,33; beim Wettercode 31 statt 34 Prozent Fehlalarme. */
    const naechst=i=>Math.min(i+1,H.time.length-1);
    const blockAt=i=>({
      time:H.time[i], temp:H.temperature_2m[i], code:H.weather_code[naechst(i)],
      app:H.apparent_temperature?.[i],
      tot:H.cloud_cover?.[i]??0, low:H.cloud_cover_low?.[i]??0,
      mid:H.cloud_cover_mid?.[i]??0, high:H.cloud_cover_high?.[i]??0,
      precip:H.precipitation?.[naechst(i)]??0, pop:H.precipitation_probability?.[naechst(i)]??0,
      rain:H.rain?.[naechst(i)]??0, showers:H.showers?.[naechst(i)]??0, snow:H.snowfall?.[naechst(i)]??0,
      sunSec:H.sunshine_duration?.[naechst(i)]??0, swrad:H.shortwave_radiation?.[naechst(i)]??0,
      toa:H.terrestrial_radiation?.[naechst(i)]??0,
      rh:H.relative_humidity_2m?.[i], dew:H.dew_point_2m?.[i],
      pmsl:H.pressure_msl?.[i], vis:H.visibility?.[i],
      wind:H.wind_speed_10m?.[i]??0, gust:H.wind_gusts_10m?.[i]??0,
      wdir:H.wind_direction_10m?.[i], wind80:H.wind_speed_80m?.[i],
      cape:H.cape?.[i]??0, cin:H.convective_inhibition?.[i]??0,
      frz:H.freezing_level_height?.[i], soil:H.soil_temperature_0cm?.[i],
      uv:uvHour[H.time[i]],
      isDay:isDayHour(H.time[i]),
      elev:sonnenhoeheStunde(H.time[i])
    });

    /* current conditions use the matching hourly block, so header and hour row agree */
    const c=d.current;
    let nowIdx=H.time.findIndex(t=>t.slice(0,13)===c.time.slice(0,13));
    if(nowIdx<0) nowIdx=0;
    const nowBlk=blockAt(nowIdx);
    const nowDec=skyDecision(nowBlk);

    /* Vorschrift statt altem Namen: "clear" zeichnete immer die pralle Sonne,
       auch wenn die Stufe schon eine kleine Wolke vorsah. Banner und
       Stundenkachel zeigten dieselbe Stunde dadurch verschieden. */
    /* Der Himmel hinter der Kopfzeile folgt dieser Stunde, nicht dem Tag.
       Die Zeile rechts fasst den Tag zusammen, der Hintergrund zeigt, was
       gerade draussen ist. */
    {
      HIMMEL.setze({
        elev:    nowBlk.elev,
        deckung: wolkenWirkung(nowBlk),
        /* Haufenwolken kommen nur aus tiefen und mittleren Schichten. Hohe
           Wolken sind Zirren, ein Schleier, und werden auch so gezeichnet.
           Sonst malt der Himmel fuer einen Zirrenschleier dicke Quellwolken. */
        haufen:  wolkenWirkung({low:nowBlk.low, mid:nowBlk.mid, high:0}),
        schleier:Number(nowBlk.high||0),
        mm:      (nowBlk.precip||0),
        schnee:  (nowBlk.snow||0)>0.05,
        nebel:   nowDec.icon==="fog",
        gewitter:nowDec.icon==="storm"
      });
    }
    nowIcon.innerHTML=weatherIcon(nowDec.spec||nowDec.icon);
    nowTemp.textContent=Math.round(c.temperature_2m)+"°";
    nowDetails.innerHTML=
      `${specLabel(nowDec.spec,nowDec.icon)||wmoText(c.weather_code)}<br>`+
      `gefühlt ${deg(c.apparent_temperature)} · ${nurHoheWolken(nowBlk)?"Zirren":"Wolken"} ${pct(c.cloud_cover)}`+
      `${nowDec.day?` · Sonne ${pct(nowDec.brightness*100)}`:""}<br>`+
      `<span class="inl">${mi("sock")}Wind ${Math.round(c.wind_speed_10m)} km/h, Böen ${Math.round(c.wind_gusts_10m??0)} km/h</span>`;

    /* the tiles are built first: the header reuses one of them */
    renderDays(d,trend,uvDay);
    renderOutlook();
    SOLAR.setzePrognose(H,sunMap);
    SOLAR.zeichne();

    const ts=H.time;
    let start=ts.findIndex(t=>new Date(t).getTime()>=Date.now()-1800000);
    if(start<0) start=0;

    hours.innerHTML="";
    for(let i=start;i<Math.min(start+48,ts.length);i++){
      const blk=blockAt(i);
      const dec=skyDecision(blk);
      const e=document.createElement("div");
      e.className="hour"+(dec.day?"":" night");
      e.innerHTML=
        `<div class=t>${hh(ts[i])}</div>`+
        `<div class=icon>${weatherIcon(dec.spec||dec.icon)}</div>`+
        `<div class=deg>${tempSpan(blk.temp)}</div>`+
        werteBlock([
          ["drop",pct(blk.pop),Number(blk.pop||0)>=10?"rain":""],
          ["sock",windText(blk.wind,blk.gust),windSignificant(blk.wind,blk.gust)?"wind":""]
        ]);
      const label=new Date(ts[i]).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit"})+
        ", "+hh(ts[i])+" Uhr";
      e.addEventListener("click",()=>hourDetail(label,blk,dec));
      hours.appendChild(e);
    }

    srcNote=trend
      ? "DWD ICON via Open-Meteo, Tage 8–14 Modellmix · Karte OpenStreetMap"
      : "DWD ICON via Open-Meteo · Karte OpenStreetMap";
    lastGood=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    lastGoodAt=Date.now(); lastError=null;
    nachversuchNr=0; clearTimeout(nachversuch);
    stand.innerHTML=` · <span class="stand">Stand ${lastGood}</span>`+
      (updatePending?` · <span class="stand">Update wartet</span>`:"");

  }catch(e){
    console.error(e);
    lastError={msg:e.message||String(e),t:Date.now()};
    /* the tiles still hold the last good values, so say how old they are
       instead of only reporting a failure; the wording stays plain, the
       detail sits one tap away */
    stand.innerHTML=lastGood
      ? ` · <span class="stand">Stand ${lastGood}</span> · <span class="stale">nicht aktualisiert</span>`
      : ' · <span class="stale">keine Verbindung zum Wetterdienst</span>';
    planeNachversuch();
  }
}

/*
  Nachversuche nach einem Fehlschlag.

  Open-Meteo antwortet gelegentlich mit 503, und zwar innerhalb von gut hundert
  Millisekunden. Gemessen am 25.09.2026: jeder Fehlschlag lag auf der vollen
  Sekunde des Zehnminutentakts, jeder Erfolg ein bis zwei Sekunden daneben. Das
  sieht nach einer Lastspitze aus, die entsteht, weil viele Abrufe gleichzeitig
  auf die runde Minute fallen.

  Ohne Nachversuch stand die Wand danach zehn Minuten lang auf "keine
  Verbindung", obwohl ein zweiter Versuch Sekunden spaeter durchgegangen waere.
  Drei Nachversuche mit wachsendem Abstand und einem Zufallsanteil, damit sie
  nicht wieder alle gleichzeitig kommen.
*/
const NACHVERSUCHE=[4000,20000,90000];
let nachversuch=null, nachversuchNr=0;
function planeNachversuch(){
  if(nachversuchNr>=NACHVERSUCHE.length) return;
  const k=omStand(); if(Date.now()<k.ruheBis||k.summe>=OM_BUDGET-10) return;
  const warten=NACHVERSUCHE[nachversuchNr++]+Math.random()*3000;
  clearTimeout(nachversuch);
  nachversuch=setTimeout(loadWeather,warten);
}

/*
  Spatial cloud/rain development around Uedorf.
  Not radar: this is ICON's gridded forecast sampled at a coarse point grid and
  then bilinearly interpolated into a small raster, so it reads as a continuous
  field instead of the visible squares of the earlier versions. Frames are
  pre-rendered once per fetch, so the animation itself costs nothing.
*/
let cloudMap=null, cloudOverlay=null, cloudMarkers=[], cloudFrames=[], cloudIdx=0, cloudTimer=null;
const CLOUD_HOURS=7;
/*
  19 x 10 over the padded viewport gives roughly 12 km cells instead of the
  26 km this started with. 25 x 13 was tried first and was a planning mistake:
  325 points times 25 hourly fetches is 8125 of a 10000 request daily budget,
  which leaves no room for page reloads, and one afternoon of testing exhausted
  the quota. 190 points times 25 fetches is 4750, about half the budget.
*/
const GRID_X=19, GRID_Y=10;
const LAT_SPAN_FB=1.30, LON_SPAN_FB=2.15;  /* only used if the map has no size yet */
const GRID_PAD=0.12;   /* raster margin beyond the visible map */
const EDGE_FADE=0.05;  /* alpha taper, ends well inside that off-screen margin */
const SS=8;   /* raster stays 145 x 73 px, so the canvas cost is unchanged */
let gridBox=null;

/*
  The raster has to cover more ground than the map shows.
  Until v20 it was a fixed 2.15 x 1.30 degree box, while the map at zoom 7.9
  shows about 3.57 x 1.08 degrees. The western data edge therefore fell inside
  the picture at lon 5.925 and drew a dead straight vertical line across the
  map near Aachen, which looked like a weather front. The box is now derived
  from the map viewport and padded, and the alpha fades out inside that padding,
  so a data edge can never reach the visible area.
*/
function computeGridBox(){
  let s=LAT-LAT_SPAN_FB/2, n=LAT+LAT_SPAN_FB/2,
      w=LON-LON_SPAN_FB/2, e=LON+LON_SPAN_FB/2;
  try{
    const b=cloudMap.getBounds();
    const dLat=b.getNorth()-b.getSouth(), dLon=b.getEast()-b.getWest();
    if(dLat>0.05&&dLon>0.05){
      s=b.getSouth()-dLat*GRID_PAD; n=b.getNorth()+dLat*GRID_PAD;
      w=b.getWest() -dLon*GRID_PAD; e=b.getEast() +dLon*GRID_PAD;
    }
  }catch(err){ /* keep the fallback box */ }
  return {s,n,w,e};
}

/*
  Farben der Karte, drei getrennte Bedeutungen, die sich nicht ueberschneiden:
  Wolken weiss bis grau, Regen in Blau von hell bis dunkel, Gewitter von Gelb
  ueber Rot bis Lila. Vorher lief der Regen durch den ganzen Regenbogen, und
  starker Regen war genauso gelb und rot wie ein Gewitter.
*/
const mischRGB=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*Math.max(0,Math.min(1,t)));
function stufeRGB(v,stufen){
  if(v<=stufen[0][0]) return stufen[0][1];
  for(let i=1;i<stufen.length;i++)
    if(v<=stufen[i][0]) return mischRGB(stufen[i-1][1],stufen[i][1],
      (v-stufen[i-1][0])/(stufen[i][0]-stufen[i-1][0]));
  return stufen[stufen.length-1][1];
}
/* Die helle Seite ist ein lichtes Grau, kein Weiss. Auf den hellen Kacheln
   von OpenStreetMap verschwindet reines Weiss, und duenne Wolken waren dann
   gar nicht mehr zu sehen. */
const WOLKE_HELL=[214,221,230], WOLKE_DUNKEL=[104,113,127];
const REGEN_STUFEN=[[0.1,[176,214,255]],[0.5,[118,178,250]],[1,[70,140,236]],
                    [2,[42,104,212]],[4,[30,74,178]],[8,[22,46,128]]];
const STURM_STUFEN=[[1,[255,214,74]],[2,[255,150,46]],[3,[232,64,58]],[4,[150,60,205]]];
function rainRGB(mm){
  const v=Number(mm||0);
  return v<0.1?null:stufeRGB(v,REGEN_STUFEN);
}
/*
  DWD-Radar fuer die ersten zwei Stunden.

  ICON sieht Regen nur an 19 mal 10 Punkten, also als weiche Flecken. Das
  Radarkomposit des DWD hat 1 km und kommt alle fuenf Minuten, dazu eine
  Vorhersage bis knapp zwei Stunden. Fuer jetzt, +1 h und +2 h kommt der
  Regen deshalb aus dem Radar, fuer jetzt die Gewitter aus der gemessenen
  Blitzdichte. Wolken und alles ab der dritten Stunde bleiben ICON.

  Der DWD liefert fertige Bilder in seinen Farben. Jede Farbe steht fuer eine
  Klasse, abgelesen aus seiner Legende am 27.09.2026, und wird in unsere
  Farben zurueckgerechnet. Faellt der DWD aus, bleibt der Regen von ICON.
*/
const hexRGB=h=>[0,2,4].map(i=>parseInt(h.substr(i,2),16));
const RADAR_KLASSEN=[["33ffff",.15],["1acc9a",.3],["019934",.7],["4db31b",1.5],["99cc01",2.5],["cce601",4],
  ["ffff01",6.25],["ffc401",8.75],["ff8901",12.5],["ff4501",22.5],["fe0000",37.5],["e5004c",60],
  ["cc0098",87.5],["6600cb",125],["0000fe",175]].map(([h,v])=>[hexRGB(h),v]);
/* Blitzdichte in 1/min je 100 km2, abgebildet auf die Gewitterstufen */
const BLITZ_KLASSEN=[["fcffc1",1],["fbff5c",1.3],["dffc26",1.7],["a0d626",2],["45c379",2.4],["00d6d8",2.8],
  ["11a1d6",3.1],["0702fc",3.4],["9232b7",3.7],["da28c6",4],["e70d0c",4],["880e0d",4],["4f0e0d",4]]
  .map(([h,v])=>[hexRGB(h),v]);
function dwdKlasse(r,g,b,liste){
  let best=null,d0=1e9;
  for(const [c,v] of liste){ const d=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2; if(d<d0){d0=d;best=v;} }
  return d0<900?best:null;          /* Abdeckungsrand und Grau bleiben leer */
}
const iso5=d=>d.toISOString().slice(0,19)+"Z";
async function dwdBild(layer,zeit,faerbe){
  const b=cloudMap.getBounds(), sz=cloudMap.getSize(), W=Math.round(sz.x), H=Math.round(sz.y);
  const p1=L.CRS.EPSG3857.project(b.getSouthWest()), p2=L.CRS.EPSG3857.project(b.getNorthEast());
  const url="https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.3.0&request=GetMap"+
    `&layers=dwd:${layer}&styles=&crs=EPSG:3857&bbox=${p1.x},${p1.y},${p2.x},${p2.y}`+
    `&width=${W}&height=${H}&format=image/png&transparent=true&time=${iso5(zeit)}&format_options=antialias:none`;
  const img=await new Promise((ok,nein)=>{ const i=new Image(); i.crossOrigin="anonymous";
    const u=setTimeout(()=>nein(new Error("DWD antwortet nicht")),20000);
    i.onload=()=>{clearTimeout(u);ok(i);}; i.onerror=()=>{clearTimeout(u);nein(new Error("DWD-Bild fehlt"));}; i.src=url; });
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const cx=cv.getContext("2d"); cx.drawImage(img,0,0);
  const d=cx.getImageData(0,0,W,H), px=d.data; let treffer=0;
  for(let o=0;o<px.length;o+=4){
    if(px[o+3]<128){ px[o+3]=0; continue; }
    const f=faerbe(px[o],px[o+1],px[o+2]);
    if(!f){ px[o+3]=0; continue; }
    px[o]=f[0]; px[o+1]=f[1]; px[o+2]=f[2]; px[o+3]=Math.round(f[3]*255); treffer++;
  }
  cx.putImageData(d,0,0);
  return {url:cv.toDataURL(),bounds:b,treffer};
}
const radarFarbe=(r,g,b)=>{ const mm=dwdKlasse(r,g,b,RADAR_KLASSEN); if(mm==null) return null;
  const c=rainRGB(mm); return [c[0],c[1],c[2],Math.min(.82,.26+Math.sqrt(mm)*.40)]; };
const blitzFarbe=(r,g,b)=>{ const st=dwdKlasse(r,g,b,BLITZ_KLASSEN); if(st==null) return null;
  const c=stufeRGB(st,STURM_STUFEN); return [c[0],c[1],c[2],Math.min(.9,.55+.1*st)]; };

/* Die ersten drei Bilder der Karte bekommen das Radar. Die letzte Analyse
   liegt fuenf bis zehn Minuten zurueck, die Vorhersage reicht knapp zwei
   Stunden, deshalb +115 statt +120 Minuten. */
const RADAR_VERSATZ=[0,60,115];
async function radarAnreichern(frames){
  const t0=new Date(); t0.setUTCSeconds(0,0);
  t0.setUTCMinutes(Math.floor(t0.getUTCMinutes()/5)*5-5);
  for(let h=0;h<Math.min(frames.length,RADAR_VERSATZ.length);h++){
    const f=frames[h];
    try{
      const zeit=new Date(t0.getTime()+RADAR_VERSATZ[h]*60000);
      const r=await dwdBild("Radar_rv_product_1x1km_ger",zeit,radarFarbe);
      let bl=null;
      if(h===0) bl=await dwdBild("Blitzdichte",t0,blitzFarbe).catch(()=>null);
      /* ICON-Regen raus, das Radar ersetzt ihn. Gewitter von ICON bleiben
         fuer +1 h und +2 h, fuer jetzt gibt es die gemessenen Blitze. */
      const leer=new Float32Array(f.cloud.length);
      f.url=renderFrame(f.cloud,leer,h===0&&bl?leer:f.sturm);
      if(h===0&&bl) f.storms=[];
      f.radar=r; f.blitz=bl;
    }catch(e){
      diagPush({src:"Radar",kind:"netz",msg:e.message,ms:0});
    }
  }
}

/*
  Regen ab Uhrzeit, fuer die Plakette unter der Temperatur.

  Das Radar ueber Uedorf alle fuenf Minuten, von jetzt bis knapp zwei
  Stunden. Je Zeitpunkt ein Bild von 5 mal 5 Pixeln, das sind 3 km um den
  Ort herum; zaehlt der staerkste Pixel. Dazu die Blitze im Umkreis von
  30 km aus der gemessenen Blitzdichte. Steht nichts an, bleibt die
  Plakette weg.
*/
const NOWCAST_KM=3, BLITZ_KM=30;
async function kleinesBild(layer,zeit,km,px){
  const dLat=km/111.32, dLon=km/(111.32*Math.cos(LAT*Math.PI/180));
  const url="https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.3.0&request=GetMap"+
    `&layers=dwd:${layer}&styles=&crs=EPSG:4326&bbox=${LAT-dLat},${LON-dLon},${LAT+dLat},${LON+dLon}`+
    `&width=${px}&height=${px}&format=image/png&transparent=true&time=${iso5(zeit)}&format_options=antialias:none`;
  const img=await new Promise((ok,nein)=>{ const i=new Image(); i.crossOrigin="anonymous";
    const u=setTimeout(()=>nein(new Error("DWD antwortet nicht")),15000);
    i.onload=()=>{clearTimeout(u);ok(i);}; i.onerror=()=>{clearTimeout(u);nein(new Error("DWD-Bild fehlt"));}; i.src=url; });
  const cv=document.createElement("canvas"); cv.width=px; cv.height=px;
  const cx=cv.getContext("2d"); cx.drawImage(img,0,0);
  return cx.getImageData(0,0,px,px).data;
}
const RICHTUNG=["N","NO","O","SO","S","SW","W","NW"];
async function nowcast(){
  const el=document.getElementById("nowcast"); if(!el) return;
  try{
    const t0=new Date(); t0.setUTCSeconds(0,0); t0.setUTCMinutes(Math.floor(t0.getUTCMinutes()/5)*5-5);
    const schritte=[]; for(let m=0;m<=115;m+=5) schritte.push(new Date(t0.getTime()+m*60000));
    const werte=await Promise.all(schritte.map(z=>kleinesBild("Radar_rv_product_1x1km_ger",z,NOWCAST_KM,5)
      .then(d=>{ let mx=0; for(let o=0;o<d.length;o+=4) if(d[o+3]>=128){ const v=dwdKlasse(d[o],d[o+1],d[o+2],RADAR_KLASSEN); if(v!=null&&v>mx) mx=v; } return mx; })
      .catch(()=>null)));
    /* Blitze: naechster Pixel im Umkreis */
    let blitz=null;
    try{ const n=61, d=await kleinesBild("Blitzdichte",t0,BLITZ_KM,n);
      for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const o=(y*n+x)*4; if(d[o+3]<128) continue;
        if(dwdKlasse(d[o],d[o+1],d[o+2],BLITZ_KLASSEN)==null) continue;
        const dx=(x-(n-1)/2)*2*BLITZ_KM/(n-1), dy=((n-1)/2-y)*2*BLITZ_KM/(n-1), km=Math.hypot(dx,dy);
        if(km<=BLITZ_KM&&(!blitz||km<blitz.km)) blitz={km,dir:RICHTUNG[Math.round(((Math.atan2(dx,dy)*180/Math.PI)+360)%360/45)%8]}; }
    }catch(e){}
    const uhr=d=>d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    const nass=v=>v!=null&&v>=0.1;
    let text="", art="regen";
    if(blitz){ art="gewitter"; text=blitz.km<3?"Gewitter":`Gewitter ${Math.round(blitz.km)} km ${blitz.dir}`; }
    else if(nass(werte[0])){
      const ende=werte.findIndex(v=>v!=null&&!nass(v));
      text=ende>0?`bis ${uhr(schritte[ende])}`:"hält an";
    }else{
      const ab=werte.findIndex(nass);
      if(ab>0){ const bis=werte.findIndex((v,i)=>i>ab&&v!=null&&!nass(v));
        text=bis>0?`${uhr(schritte[ab])}–${uhr(schritte[bis])}`:`ab ${uhr(schritte[ab])}`; }
    }
    if(!text){ el.hidden=true; return; }
    el.className="pille"+(art==="gewitter"?" gewitter":"");
    el.innerHTML=(art==="gewitter"?mi("bolt"):mi("drop"))+text;
    el.hidden=false;
  }catch(e){ el.hidden=true; diagPush({src:"Nowcast",kind:"netz",msg:e.message,ms:0}); }
}

/* Gewitterstufe eines Punkts: nur wo ICON ein Gewitter rechnet, also Code
   95, 96 oder 99. CAPE allein zeigt nur, dass eines entstehen koennte, und
   lag Mai bis September 2026 an der Haelfte der Tage daneben. Die Staerke
   kommt aus der Regenmenge, Hagel (96, 99) ist immer die hoechste Stufe. */
function sturmStufe(code,mm){
  if(![95,96,99].includes(code)) return 0;
  if(code>=96) return 4;
  /* Stetig statt in Stufen: 0 mm ist 1, 2 mm ist 2, 5 mm ist 3, ab 15 mm
     ist 4. Mit harten Stufen zeichnete das grobe Raster eckige Kerne. */
  const m=Math.max(0,Number(mm||0));
  return m<2?1+m/2 : m<5?2+(m-2)/3 : Math.min(4,3+(m-5)/10);
}
/* Ein Blitz je Gewittergebiet, an seiner staerksten Stelle. ICON meldet ein
   Gewitter oft auf vielen Nachbarpunkten zugleich, und ein Blitz auf jedem
   ergab ein Raster aus zwanzig Blitzen. Zwei Blitze stehen mindestens drei
   Rasterfelder auseinander, also gut 35 km. */
function blitzOrte(sturm,pts){
  const kand=[];
  for(let o=0;o<sturm.length;o++) if(sturm[o]>=1) kand.push(o);
  kand.sort((a,b)=>sturm[b]-sturm[a]);
  const wahl=[];
  for(const o of kand){
    const x=o%GRID_X, y=Math.floor(o/GRID_X);
    if(wahl.every(w=>Math.hypot(w.x-x,w.y-y)>=3)) wahl.push({x,y,o});
  }
  return wahl.filter(w=>pts[w.o]).map(w=>({lat:pts[w.o].lat,lon:pts[w.o].lon,stufe:sturm[w.o]}));
}
function cloudFrameLabel(iso,idx){
  const t=new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  if(radarLegend&&!radarLegend.dataset.done){
    radarLegend.innerHTML=`weiß bis grau = Wolken · Blau = Regen · Gelb bis Lila = Gewitter`;
    radarLegend.dataset.done="1";
  }
  return idx===0?`Jetzt / ${t}`:`+${idx} h · ${t}`;
}
function makeGrid(box){
  const pts=[];
  const dLat=(box.n-box.s)/(GRID_Y-1), dLon=(box.e-box.w)/(GRID_X-1);
  for(let y=0;y<GRID_Y;y++){
    const lat=box.s+y*dLat;
    for(let x=0;x<GRID_X;x++) pts.push({lat,lon:box.w+x*dLon,x,y});
  }
  return {pts,dLat,dLon};
}
function bilinear(f,W,H,fx,fy){
  const x0=Math.max(0,Math.min(W-1,Math.floor(fx))), x1=Math.min(W-1,x0+1);
  const y0=Math.max(0,Math.min(H-1,Math.floor(fy))), y1=Math.min(H-1,y0+1);
  const tx=fx-x0, ty=fy-y0;
  const a=f[y0*W+x0], b=f[y0*W+x1], c=f[y1*W+x0], e=f[y1*W+x1];
  return (a*(1-tx)+b*tx)*(1-ty)+(c*(1-tx)+e*tx)*ty;
}
/* raised-cosine taper, 1 in the interior, 0 at the very border */
function taper(t){
  if(t>=EDGE_FADE) return 1;
  if(t<=0) return 0;
  return 0.5-0.5*Math.cos(Math.PI*t/EDGE_FADE);
}
/* rasterise one hour into a data URL; image rows run north -> south */
function renderFrame(cloud,precip,sturm){
  const W=(GRID_X-1)*SS+1, H=(GRID_Y-1)*SS+1;
  const cv=document.createElement("canvas");
  cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d");
  const img=ctx.createImageData(W,H);
  for(let py=0;py<H;py++){
    /* grid row 0 is the southern edge, image row 0 is the northern edge */
    const gy=(GRID_Y-1)-py/SS;
    const ey=taper(Math.min(py,H-1-py)/(H-1));
    for(let px=0;px<W;px++){
      const gx=px/SS;
      const edge=Math.min(ey,taper(Math.min(px,W-1-px)/(W-1)));
      const cc=Math.max(0,Math.min(100,bilinear(cloud,GRID_X,GRID_Y,gx,gy)));
      const mm=Math.max(0,bilinear(precip,GRID_X,GRID_Y,gx,gy));
      const st=sturm?Math.max(0,bilinear(sturm,GRID_X,GRID_Y,gx,gy)):0;
      /* Wolken: duenn und weiss, dicht und grau. Die Deckkraft waechst mit. */
      let [r,g,b]=mischRGB(WOLKE_HELL,WOLKE_DUNKEL,Math.pow(cc/100,1.3));
      /* Dichte Wolken deutlich grauer und deckender als duenne, sonst sieht
         man auf der Karte nicht, wo es wirklich zu ist. */
      let a=cc<3?0:0.06+Math.pow(cc/100,1.1)*0.50;
      const rc=rainRGB(mm);
      if(rc){
        const ra=Math.min(.82,.26+Math.sqrt(mm)*0.40);
        r=r*(1-ra)+rc[0]*ra; g=g*(1-ra)+rc[1]*ra; b=b*(1-ra)+rc[2]*ra;
        a=Math.max(a,ra);
      }
      /* Gewitter zuletzt, es liegt ueber allem. Unter einer halben Stufe ist
         es nur der Rand der Glaettung und bleibt weg. */
      /* Weicher Einstieg zwischen 0,3 und 1, sonst schneidet die Schwelle
         einen Zacken in den Rand der Zelle. */
      const ein=Math.max(0,Math.min(1,(st-0.3)/0.7)), weich=ein*ein*(3-2*ein);
      if(weich>0){
        const sc=stufeRGB(Math.max(1,st),STURM_STUFEN), sa=weich*Math.min(.9,.55+0.1*st);
        r=r*(1-sa)+sc[0]*sa; g=g*(1-sa)+sc[1]*sa; b=b*(1-sa)+sc[2]*sa;
        a=Math.max(a,sa);
      }
      const o=(py*W+px)*4;
      img.data[o]=r; img.data[o+1]=g; img.data[o+2]=b;
      img.data[o+3]=Math.round(a*edge*255);
    }
  }
  ctx.putImageData(img,0,0);
  return cv.toDataURL("image/png");
}
function clearMarkers(){
  for(const m of cloudMarkers) cloudMap.removeLayer(m);
  cloudMarkers=[];
}
function drawCloudFrame(idx){
  if(!cloudMap||!cloudFrames.length) return;
  cloudIdx=((idx%cloudFrames.length)+cloudFrames.length)%cloudFrames.length;
  const f=cloudFrames[cloudIdx];
  const bounds=[[f.box.s,f.box.w],[f.box.n,f.box.e]];
  if(!cloudOverlay){
    cloudOverlay=L.imageOverlay(f.url,bounds,{opacity:1,interactive:false,className:"cloudfield"}).addTo(cloudMap);
  }else{
    cloudOverlay.setUrl(f.url);
    cloudOverlay.setBounds(L.latLngBounds(bounds));
  }
  /* Radar und Blitze als eigene Schichten ueber dem ICON-Bild */
  for(const k of ["radarEbene","blitzEbene"]) if(window[k]){ cloudMap.removeLayer(window[k]); window[k]=null; }
  if(f.radar) window.radarEbene=L.imageOverlay(f.radar.url,f.radar.bounds,{interactive:false,className:"radarbild"}).addTo(cloudMap);
  if(f.blitz) window.blitzEbene=L.imageOverlay(f.blitz.url,f.blitz.bounds,{interactive:false,className:"radarbild"}).addTo(cloudMap);
  clearMarkers();
  for(const st of f.storms){
    const m=L.marker([st.lat,st.lon],{
      interactive:false,
      /* Das Gewittersymbol der Stundenkacheln, Wolke mit Blitz und Regen. Der
         einzelne Blitz sah aus wie das Stromsymbol im Solarblock. */
      icon:L.divIcon({className:"",html:`<div style="width:30px;height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))">${weatherIcon({sky:4,wet:"regen",storm:true},"kartensymbol")}</div>`,iconSize:[30,30],iconAnchor:[15,15]})
    }).addTo(cloudMap);
    cloudMarkers.push(m);
  }
  radarTime.textContent=cloudFrameLabel(f.time,cloudIdx)+(f.radar?" · Radar":"");
}
/*
  The field is hourly, so a reload inside the same hour would fetch numbers that
  are already known. Caching them makes a reload free, which matters because a
  reload otherwise costs one request per grid point and that is what exhausted
  the daily quota during development.
*/
const CACHE_KEY="wetter.cloudfield.v2";   /* v2: Schichten und Wettercode */
function cacheKeyNow(box){
  const h=new Date().toISOString().slice(0,13);
  return `${h}|${box.s.toFixed(3)},${box.n.toFixed(3)},${box.w.toFixed(3)},${box.e.toFixed(3)}`;
}
function readCache(box){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const c=JSON.parse(raw);
    return c&&c.key===cacheKeyNow(box)&&Array.isArray(c.data)?c.data:null;
  }catch(e){ return null; }
}
function writeCache(box,data){
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify({key:cacheKeyNow(box),data})); }catch(e){}
}

async function loadCloudForecast(){
  try{
    radarMsg.style.display="none";
    radarTime.textContent="Wolken laden…";
    gridBox=computeGridBox();
    const {pts}=makeGrid(gridBox);
    const lats=pts.map(p=>p.lat.toFixed(4)).join(",");
    const lons=pts.map(p=>p.lon.toFixed(4)).join(",");
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}`+
      /* Sieben Variablen kosten so viel wie drei: Open-Meteo rechnet erst ab
         mehr als zehn mehrfach. Die Schichten braucht die Wolkenfarbe, den
         Wettercode das Gewitter. Eine Stunde mehr, weil Niederschlag und
         Code zur Stunde vor dem Zeitstempel gehoeren. */
      `&models=icon_seamless&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,`+
      `precipitation,weather_code,cape`+
      `&forecast_hours=${CLOUD_HOURS+1}&timezone=Europe%2FBerlin`;

    let j=readCache(gridBox);
    let fromCache=!!j;
    if(!j){
      j=await fetchJson(url,"Karte");
      if(!Array.isArray(j)) j=[j];
      if(!j.length) throw new Error("Karte: keine Wolkendaten");
      /* keep only what the raster needs, so the cache stays small */
      j=j.map(p=>({hourly:{
        time:p.hourly.time,
        cloud_cover:p.hourly.cloud_cover,
        cloud_cover_low:p.hourly.cloud_cover_low,
        cloud_cover_mid:p.hourly.cloud_cover_mid,
        cloud_cover_high:p.hourly.cloud_cover_high,
        precipitation:p.hourly.precipitation,
        weather_code:p.hourly.weather_code,
        cape:p.hourly.cape
      }}));
      writeCache(gridBox,j);
    }
    if(fromCache) console.info("Wolkenfeld aus dem Puffer der laufenden Stunde");

    const n=Math.min(CLOUD_HOURS,(j[0].hourly?.time?.length||1)-1);
    const frames=[];
    for(let h=0;h<n;h++){
      const cloud=new Float32Array(GRID_X*GRID_Y);
      const precip=new Float32Array(GRID_X*GRID_Y);
      const sturm=new Float32Array(GRID_X*GRID_Y);
      for(let k=0;k<Math.min(j.length,pts.length);k++){
        const p=pts[k], o=p.y*GRID_X+p.x, hh=j[k].hourly||{};
        /* Wolken als Augenblickswert zur vollen Stunde, gewichtet nach
           Schichten wie ueberall auf der Seite. Niederschlag und Code aus dem
           naechsten Zeitstempel, denn der beschreibt die Stunde davor. */
        cloud[o]=wolkenWirkung({tot:hh.cloud_cover?.[h],low:hh.cloud_cover_low?.[h],
                                mid:hh.cloud_cover_mid?.[h],high:hh.cloud_cover_high?.[h]});
        const mm=Number(hh.precipitation?.[h+1]??0), code=Number(hh.weather_code?.[h+1]??0);
        precip[o]=mm;
        sturm[o]=sturmStufe(code,mm);
      }
      const storms=blitzOrte(sturm,pts);
      frames.push({time:j[0].hourly.time[h],url:renderFrame(cloud,precip,sturm),storms,box:gridBox,cloud,sturm});
    }
    if(!frames.length) throw new Error("keine Wolken-Frames");
    await radarAnreichern(frames);
    cloudFrames=frames;

    cloudIdx=0;
    drawCloudFrame(0);
    clearInterval(cloudTimer);
    cloudTimer=setInterval(()=>drawCloudFrame(cloudIdx+1),1400);
  }catch(e){
    console.error("Cloud forecast",e);
    lastError={msg:e.message||String(e),t:Date.now()};
    /* a wall display should keep the last good film rather than go blank */
    if(cloudFrames.length){
      radarTime.textContent="Stand nicht aktuell";
    }else{
      radarMsg.style.display="block";
      radarMsg.textContent="Wolkenprognose nicht verfügbar: "+e.message;
      radarTime.textContent="Wolkenfehler";
    }
  }
}
/* The field is hourly, so a reload only pays off just after the hour rolls
   over. That keeps the frame labels honest and leaves the request budget for
   resolution. */
function scheduleCloudReload(){
  const now=new Date();
  const wait=(60-now.getMinutes())*60000-now.getSeconds()*1000+90000;
  /* Nachts bleibt der letzte Film stehen, die Bilder tragen ihre Uhrzeit.
     Das spart vier Ladungen zu je 190 Abrufen. */
  setTimeout(()=>{ if(!istNacht()) loadCloudForecast(); scheduleCloudReload(); },Math.max(60000,wait));
}

function initCloudMap(){
  try{
    if(typeof L==="undefined") throw new Error("Kartenbibliothek nicht geladen");
    cloudMap=L.map("cloudMap",{
      zoomControl:false,attributionControl:true,dragging:false,scrollWheelZoom:false,
      doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false
    }).setView([LAT,LON],7.9);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19,attribution:"© OpenStreetMap"
    }).addTo(cloudMap);

    L.circleMarker([LAT,LON],{
      radius:5,weight:2,color:"#ffffff",fillColor:"#ff3b30",fillOpacity:1
    }).addTo(cloudMap).bindTooltip("Uedorf",{permanent:true,direction:"right",offset:[7,0]});

    cloudMap.attributionControl.addAttribution("Radar © DWD");
    nowcast(); setInterval(nowcast,300000);
    loadCloudForecast();
    scheduleCloudReload();
    /* Das Radar erneuert sich alle fuenf Minuten, ICON nur stuendlich */
    setInterval(async()=>{ if(!cloudFrames.length) return;
      await radarAnreichern(cloudFrames); drawCloudFrame(cloudIdx); },600000);
    /* the viewport changes when the page enters fullscreen or the tablet
       rotates, and the raster is cut for the viewport it was built from */
    let resizeTimer=null;
    addEventListener("resize",()=>{
      clearTimeout(resizeTimer);
      resizeTimer=setTimeout(()=>{ try{cloudMap.invalidateSize();}catch(e){} loadCloudForecast(); },1200);
    });
  }catch(e){
    radarMsg.style.display="block";
    radarMsg.textContent="Wolkenkarte nicht verfügbar: "+e.message;
  }
}
setTimeout(initCloudMap,250);

/*
  Wall-tablet kiosk mode. One tap asks for fullscreen, locks landscape and takes
  a screen wake lock so the tablet stops dimming. All three are optional APIs on
  an older Android build, so each one is attempted on its own and a refusal is
  simply ignored. The button hides itself once the page runs without browser
  chrome, which is also the case when it was launched from the home screen.
*/
let wakeLock=null;
async function acquireWakeLock(){
  if(wakeLock||!("wakeLock" in navigator)) return;
  try{
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release",()=>{wakeLock=null});
  }catch(e){ wakeLock=null; }
}
function chromeless(){
  try{
    /* in landscape the viewport height matches the screen's shorter side
       once no status bar and no browser toolbar are left */
    const shorter=Math.min(screen.width,screen.height);
    return window.innerHeight>=shorter-4;
  }catch(e){ return false; }
}
function kioskActive(){
  if(document.fullscreenElement) return true;
  if(chromeless()) return true;
  try{
    return window.matchMedia("(display-mode: fullscreen)").matches
        || window.matchMedia("(display-mode: standalone)").matches;
  }catch(e){ return false; }
}
/* the hint is the only affordance left; any tap does the job */
const HINT_HTML='Vollbild starten<small>hier oder irgendwo tippen</small>';
function syncKioskBtn(){
  const off=kioskActive()||!document.documentElement.requestFullscreen;
  hint.hidden=off;
  if(!off) hint.innerHTML=HINT_HTML;
}

/*
  Firefox has no Wake Lock API and grants fullscreen only from a real user
  gesture, so the page cannot go fullscreen on load. It arms a one-shot capture
  listener on "click": pointerdown and touchstart do not count as an activation
  triggering event in Firefox, and calling preventDefault on them additionally
  suppressed the follow-up click. The first click anywhere goes fullscreen and
  is swallowed so it does not also open a tile, every later click behaves
  normally. Any coordinate works, which is what makes it drivable from an
  automation app.
*/
let firstClick=null;
function armFirstTouch(){
  if(firstClick){
    document.removeEventListener("click",firstClick,true);
    firstClick=null;
  }
  if(kioskActive()||!document.documentElement.requestFullscreen) return;
  firstClick=ev=>{
    ev.stopPropagation();
    goKiosk();
  };
  document.addEventListener("click",firstClick,true);
}
async function goKiosk(){
  let refused=null;
  try{
    if(!document.fullscreenElement&&document.documentElement.requestFullscreen)
      await document.documentElement.requestFullscreen({navigationUI:"hide"});
  }catch(e){ refused=e&&e.message?e.message:"abgelehnt"; }
  try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock("landscape"); }catch(e){}
  await acquireWakeLock();
  if(refused&&!kioskActive()){
    hint.innerHTML=`Vollbild abgelehnt<small>${refused}<br>nochmal tippen</small>`;
    armFirstTouch();
    return;
  }
  syncKioskBtn();
}
document.addEventListener("fullscreenchange",()=>{syncKioskBtn();armFirstTouch()});
/* the wake lock is dropped whenever the page goes to the background */
document.addEventListener("visibilitychange",()=>{if(!document.hidden)acquireWakeLock()});
syncKioskBtn();
armFirstTouch();
addEventListener("resize",()=>{syncKioskBtn();armFirstTouch()});
addEventListener("orientationchange",()=>{syncKioskBtn();armFirstTouch()});
if(kioskActive()) acquireWakeLock();

/*
  Self update.

  The ten minute refresh fetches data; it cannot replace the page's own code.
  A reload can, but it drops fullscreen: measured on the wall tablet, the
  status and navigation bars come back the moment the document is replaced.
  So the page reloads itself only inside a night window, and the tablet's
  automation taps once shortly afterwards to restore fullscreen.

  Cost: one conditional request per hour against GitHub Pages, nothing against
  the weather API.
*/
/* Reload between two and three, so the tablet's automation, which taps at
   three, finds a freshly loaded page and restores fullscreen right after. */
const UPDATE_WINDOW_FROM=2, UPDATE_WINDOW_TO=3;
const BUILD_AT_LOAD=document.lastModified;
let updatePending=false;

async function checkForUpdate(){
  try{
    const r=await fetch(location.pathname+"?v="+Date.now(),{method:"HEAD",cache:"no-store"});
    if(!r.ok) return;
    const lm=r.headers.get("last-modified");
    if(!lm) return;
    const remote=new Date(lm).getTime(), mine=new Date(BUILD_AT_LOAD).getTime();
    if(isFinite(remote)&&isFinite(mine)&&remote>mine){
      updatePending=true;
      console.info("neue Fassung liegt bereit, Stand",lm);
    }
  }catch(e){ /* offline is not an error worth showing */ }
}

function maybeApplyUpdate(){
  if(!updatePending) return;
  const h=new Date().getHours();
  if(h>=UPDATE_WINDOW_FROM&&h<UPDATE_WINDOW_TO) location.reload();
}

setInterval(checkForUpdate,60*60*1000);
setInterval(maybeApplyUpdate,5*60*1000);
setTimeout(checkForUpdate,30000);

loadWeather();
/* Zufallsanteil von bis zu einer Minute, damit der Abruf nicht dauerhaft auf
   derselben runden Sekunde liegt wie bei allen anderen. */
setInterval(ladeWennFaellig,REFRESH_MS+Math.floor(Math.random()*60000));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ladeWennFaellig()});
</script>
