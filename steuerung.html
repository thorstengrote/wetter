<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haussteuerung</title>
<style>
:root{
  --bg:#0d131b; --flaeche:#141c27; --flaeche2:#1a2431; --linie:#253244;
  --text:#e8eef5; --leise:#8b97a6; --sehrleise:#5b6b7d;
  --pv:#ffd166; --haus:#63b3ff; --akku:#4fd6c9; --ein:#3ddc97; --netz:#ff7b6b; --akzent:#63b3ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:#0a1018;border-right:1px solid var(--linie);padding:18px 12px}
nav .marke{font-weight:750;font-size:16px;padding:0 10px 16px}
nav .marke small{display:block;color:var(--leise);font-weight:400;font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  color:var(--leise);text-decoration:none;margin-bottom:2px;cursor:pointer}
nav a.an{background:var(--flaeche2);color:var(--text)}
nav .gruppe{margin:18px 10px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sehrleise)}
.punkt{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
main{padding:22px 28px 40px;max-width:1240px;min-width:0}
h1{font-size:24px;margin:0 0 4px}
.unter{color:var(--leise);margin-bottom:18px}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:12px;padding:16px 18px;min-width:0}
.karte h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--leise);margin:0 0 12px;font-weight:650}
.raster{display:grid;gap:14px}
.zahl{font-size:26px;font-weight:750;line-height:1.1}
.zahl small{font-size:13px;color:var(--leise);font-weight:500}
.klein{font-size:12px;color:var(--leise)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;
  background:var(--flaeche2);border:1px solid var(--linie);color:var(--leise)}
.chip.gruen{color:var(--ein);border-color:#245c45}
.chip.gelb{color:var(--pv);border-color:#6b5a28}
.chip.blau{color:var(--haus);border-color:#28496b}
.chip.rot{color:var(--netz);border-color:#6a3330}
.stoerung{background:#2a1517;border:1px solid #6a3330;color:#ffb3aa;border-radius:10px;padding:10px 12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--linie);margin:4px 0 18px}
.tabs a{padding:8px 14px;color:var(--leise);border-bottom:2px solid transparent;cursor:pointer}
.tabs a.an{color:var(--text);border-color:var(--akzent)}
button{background:var(--flaeche2);color:var(--text);border:1px solid var(--linie);border-radius:8px;
  padding:7px 13px;font:inherit;cursor:pointer}
button.haupt{background:var(--akzent);color:#08111c;border-color:var(--akzent);font-weight:650}
button:disabled{opacity:.5}
table{border-collapse:collapse;width:100%}
td,th{padding:7px 8px;border-bottom:1px solid var(--linie);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--sehrleise);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.jetzt{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:14px}
.jetzt .t{font-size:12px;color:var(--leise);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.geraete{grid-template-columns:repeat(3,1fr)}
.geraet{display:flex;flex-direction:column;gap:9px}
.geraet .kopf{display:flex;justify-content:space-between;align-items:flex-start}
.geraet .name{font-weight:700;font-size:16px}
.knoepfe{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.plan svg{display:block;width:100%;height:auto}
.legende{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--leise);margin-top:10px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.feld{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linie)}
.feld:last-child{border-bottom:0}
.feld .n{font-weight:600}
.feld .e{grid-column:1/-1;font-size:12px;color:var(--leise)}
.eing{display:inline-flex;align-items:center;gap:6px}
input,select{background:#0b1119;color:var(--text);border:1px solid var(--linie);border-radius:7px;padding:6px 8px;font:inherit}
input[type=number],input.z{width:74px;text-align:right}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ein)}
.segment{display:inline-flex;border:1px solid var(--linie);border-radius:8px;overflow:hidden}
.segment a{padding:6px 12px;color:var(--leise);cursor:pointer}
.segment a.an{background:var(--ein);color:#08111c;font-weight:650}
.meldung{position:fixed;bottom:18px;right:18px;background:var(--flaeche2);border:1px solid var(--linie);
  border-radius:10px;padding:10px 14px;display:none}
.pin{min-height:100vh;display:flex;align-items:center;justify-content:center}
.pin .kasten{width:300px;text-align:center}
.pin .stellen{display:flex;gap:12px;justify-content:center;margin:22px 0}
.pin .stellen i{width:14px;height:14px;border-radius:50%;border:2px solid var(--leise)}
.pin .stellen i.v{background:var(--text);border-color:var(--text)}
.pin .tasten{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pin .tasten button{height:72px;border-radius:50%;font-size:24px}
.zu{position:fixed;top:14px;right:18px;z-index:5;display:none}
body.wand .zu{display:block}
@media (max-width:900px){
  .app{grid-template-columns:1fr} nav{display:none}
  .jetzt{grid-template-columns:repeat(2,1fr)} .geraete,.form{grid-template-columns:1fr}
  main{padding:16px}
}
</style>
</head>
<body>
<button class="zu" id="zu">Schließen</button>
<div id="wurzel"></div>
<div class="meldung" id="meldung"></div>
<script>
"use strict";
const WAND=new URLSearchParams(location.search).has("wand");
if(WAND) document.body.classList.add("wand");
document.getElementById("zu").onclick=()=>parent.postMessage("steuerung-zu","*");

const Q={sonne:"var(--ein)",akku:"var(--akku)",netz:"var(--netz)",kompressor:"var(--text)"};
const QT={sonne:"Sonne",akku:"Akku",netz:"Netz",kompressor:"Kompressor"};
const TAGE=["Mo","Di","Mi","Do","Fr","Sa","So"];
const z=(v,n=1)=>Number(v||0).toFixed(n).replace(".",",");
const uhr=d=>new Date(d).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const tag=d=>new Date(d).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
const hm=h=>`${String(Math.floor(h)).padStart(2,"0")}:${String(Math.round((h%1)*60)).padStart(2,"0")}`;
const dauerText=m=>m<60?`${Math.round(m)} min`:`${z(m/60)} h`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const FENSTER={"3":"Ben","5":"Wohnzimmer unten","15":"Wohnzimmer oben"};
let SENSOREN=null, FEUCHTE={}, HZ=null, HZK={}, HZZEIT=0, KF=null, LF=null;
let ST=null, PLAN={}, ansicht="uebersicht", geraetId=null, reiter="plan", pin="", entwurf=null;

function meldung(t){const m=document.getElementById("meldung");m.textContent=t;m.style.display="block";
  clearTimeout(meldung.u);meldung.u=setTimeout(()=>m.style.display="none",3500);}

async function api(pfad,daten){
  const o=daten===undefined?{cache:"no-store"}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(daten)};
  const r=await fetch(pfad,o);
  if(r.status===401){zeigePin();throw new Error("PIN");}
  if(!r.ok) throw new Error(await r.text());
  return r.status===204?null:r.json();
}

/* ---------- PIN ---------- */
function zeigePin(){
  ansicht="pin";
  const w=document.getElementById("wurzel");
  w.innerHTML=`<div class="pin"><div class="kasten">
    <div style="font-size:20px;font-weight:700">Haussteuerung</div>
    <div class="klein">Uedorf · Wandtablet</div>
    <div class="stellen">${[0,1,2,3].map(i=>`<i class="${i<pin.length?"v":""}"></i>`).join("")}</div>
    <div class="tasten">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("")}</div>
    <div class="klein" id="pinfehler" style="margin-top:16px">Dieser Rechner bleibt 30 Tage angemeldet.</div></div></div>`;
  w.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>taste(b.dataset.k));
}
async function taste(k){
  if(k==="⌫") pin=pin.slice(0,-1); else if(pin.length<4) pin+=k;
  zeigePin();
  if(pin.length===4){
    const r=await fetch("api/anmelden",{method:"POST",body:JSON.stringify({pin})});
    pin="";
    if(r.ok){ansicht="uebersicht";lade();}
    else{zeigePin();document.getElementById("pinfehler").textContent=r.status===429?"Zu viele Versuche, eine Minute warten.":"Falsche PIN.";}
  }
}
document.addEventListener("keydown",e=>{if(ansicht==="pin"&&/^[0-9]$|Backspace/.test(e.key))taste(e.key==="Backspace"?"⌫":e.key);});

/* ---------- Laden ---------- */
async function lade(){
  try{
    ST=await api("api/status");
    for(const g of ST.geraete||[]){
      PLAN[g.cfg.id]=(await api("api/plan?id="+g.cfg.id));
      if(g.cfg.sensor_id) FEUCHTE[g.cfg.id]=await api("api/feuchte?sensor="+encodeURIComponent(g.cfg.sensor_id));
    }
    if(!geraetId&&ST.geraete?.length) geraetId=ST.geraete[0].cfg.id;
    HZ=await api("api/heizung");
    KF=await api("api/kellerfenster");
    LF=await api("api/lueftung");
    if(ansicht==="heizung"&&Date.now()-HZZEIT>5*60e3){
      HZZEIT=Date.now();
      for(const r of HZ.raeume||[]) HZK[r.ventil.ain]=await api("api/heizung/verlauf?h=48&ain="+r.ventil.ain);
    }
    if(ansicht!=="pin"&&!((ansicht==="geraet"||ansicht==="lueftung")&&reiter==="einst")) zeichne();
  }catch(e){ if(e.message!=="PIN") meldung("Keine Verbindung zum Tablet"); }
}

/* ---------- Plan ---------- */
function tageAus(plan){
  const t=[];let akt=null;
  for(const s of plan.slots||[]){
    const d=new Date(s.zeit), k=d.toDateString();
    if(!akt||akt.k!==k){akt={k,d,slots:[]};t.push(akt);}
    akt.slots.push(s);
  }
  return t;
}
function planSvg(plan,kompakt){
  const tage=tageAus(plan);
  const b=1100,links=92,rechts=160,zeile=kompakt?30:46,oben=24;
  const iw=b-links-rechts,h=oben+Math.max(1,tage.length)*zeile+6,x=t=>links+t/24*iw;
  let s="";
  for(let t=0;t<=24;t+=3) s+=`<line x1="${x(t)}" y1="${oben-4}" x2="${x(t)}" y2="${h-4}" stroke="#1f2a38"/>
    <text x="${x(t)}" y="${oben-9}" fill="#5b6b7d" font-size="11" text-anchor="middle">${t}</text>`;
  const jetzt=new Date();
  tage.forEach((T,i)=>{
    const y=oben+i*zeile,hh=zeile-8;let pv=0,lauf=0;let d="",soc="";
    for(const sl of T.slots){
      const d0=new Date(sl.zeit),t0=d0.getHours()+d0.getMinutes()/60,t1=t0+0.5;
      if(sl.erlaubt) s+=`<rect x="${x(t0)}" y="${y}" width="${x(t1)-x(t0)+.3}" height="${hh}" fill="#1f2a38"/>`;
      const ph=Math.min(1,sl.pv/8)*hh;
      d+=`M${x(t0)} ${y+hh}V${y+hh-ph}H${x(t1)}V${y+hh}Z`;
      soc+=(soc?"L":"M")+x(t1).toFixed(1)+" "+(y+hh-sl.soc/100*hh).toFixed(1);
      pv+=sl.pv*0.5;
      if(sl.an){lauf+=30;s+=`<rect x="${x(t0)}" y="${y+hh*0.32}" width="${x(t1)-x(t0)+.4}" height="${hh*0.36}" fill="${Q[sl.quelle]||"#888"}"/>`;}
    }
    s=`<path d="${d}" fill="#ffd166" opacity=".16"/>`+s+`<path d="${soc}" fill="none" stroke="#ffd166" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>`;
    if(i===0){const t=jetzt.getHours()+jetzt.getMinutes()/60;s+=`<line x1="${x(t)}" y1="${y-2}" x2="${x(t)}" y2="${y+hh+2}" stroke="#e8eef5" stroke-opacity=".6"/>`;}
    s+=`<text x="${links-12}" y="${y+hh/2+4}" fill="${i===0?"#e8eef5":"#8b97a6"}" font-size="12" text-anchor="end">${tag(T.d)}</text>
        <text x="${b-rechts+12}" y="${y+hh/2+4}" fill="#c9d2dc" font-size="12">${lauf?dauerText(lauf):"–"}</text>
        <text x="${b-rechts+76}" y="${y+hh/2+4}" fill="#8b97a6" font-size="12">${z(pv)} kWh</text>`;
  });
  s+=`<text x="${b-rechts+12}" y="${oben-9}" fill="#5b6b7d" font-size="11">Laufzeit</text>
      <text x="${b-rechts+76}" y="${oben-9}" fill="#5b6b7d" font-size="11">PV</text>`;
  return `<svg viewBox="0 0 ${b} ${h}">${s}</svg>`;
}
const legende=`<div class="legende"><span><i style="background:#1f2a38"></i>erlaubte Laufzeit</span>
  <span><i style="background:#ffd166;opacity:.45"></i>erwartete Erzeugung</span>
  <span><i style="background:none;border-top:1px dashed #ffd166;border-radius:0;height:0;width:14px"></i>Hausakku</span>
  <span><i style="background:var(--ein)"></i>läuft mit Sonne</span><span><i style="background:var(--akku)"></i>aus dem Akku</span>
  <span><i style="background:var(--netz)"></i>vom Netz</span></div>`;
function planSumme(plan,leistung){
  let m=0,netz=0;for(const s of plan.slots||[]) if(s.an){m+=30;if(s.quelle==="netz")netz+=30;}
  return {m,netz,kwhNetz:netz/60*leistung};
}

/* ---------- Ansichten ---------- */
function rahmen(inhalt){
  const g=ST?.geraete||[];
  const stand=ST?.jetzt?uhr(ST.jetzt.zeit):"–";
  return `<div class="app"><nav>
    <div class="marke">Haussteuerung<small>Messung ${stand}</small></div>
    <a data-v="uebersicht" class="${ansicht==="uebersicht"?"an":""}">Übersicht</a>
    <div class="gruppe">Geräte</div>
    ${g.map(x=>`<a data-g="${x.cfg.id}" class="${ansicht==="geraet"&&geraetId===x.cfg.id?"an":""}">
      <span class="punkt" style="background:${x.an?"var(--ein)":"var(--sehrleise)"}"></span>${esc(x.cfg.name)}</a>`).join("")}
    <a data-v="tablet" class="${ansicht==="tablet"?"an":""}"><span class="punkt" style="background:var(--haus)"></span>Wandtablet</a>
    <div class="gruppe">Haus</div>
    <a data-v="heizung" class="${ansicht==="heizung"?"an":""}"><span class="punkt" style="background:#ff9f6b"></span>Heizung</a>
    <a data-v="lueftung" class="${ansicht==="lueftung"?"an":""}"><span class="punkt" style="background:${LF?.phase==="offen"?"var(--ein)":"var(--akku)"}"></span>Lüftung</a>
  </nav><main>${inhalt}</main></div>`;
}
function jetztLeiste(){
  const j=ST.jetzt||{},t=ST.tablet||{};
  const k=(n,f,w,u)=>`<div class="karte"><div class="t"><span class="punkt" style="background:${f}"></span>${n}</div><div class="zahl">${w}</div><div class="klein">${u}</div></div>`;
  const netz=j.netz||0;
  return `<div class="jetzt">
    ${k("Erzeugung","var(--pv)",`${z(j.pv,2)} <small>kW</small>`,`heute ${z(j.heute_kwh)} kWh`)}
    ${k("Haus","var(--haus)",`${z(j.haus,2)} <small>kW</small>`,"Verbrauch jetzt")}
    ${k("Hausakku","var(--akku)",`${Math.round(j.soc||0)} <small>%</small>`,(j.akku||0)>0.05?`lädt mit ${z(j.akku,2)} kW`:(j.akku||0)<-0.05?`gibt ${z(-j.akku,2)} kW ab`:"ruht")}
    ${k("Netz",netz>=0?"var(--ein)":"var(--netz)",`${z(Math.abs(netz),2)} <small>kW</small>`,netz>0.02?"Einspeisung":netz<-0.02?"Bezug":"ausgeglichen")}
    ${k("Wandtablet","var(--leise)",`${t.akku??"–"} <small>%</small>`,`Helligkeit tags ${t.hell_tag??"–"}`)}
  </div>`;
}
function geraetKarte(g){
  const p=PLAN[g.cfg.id]?.plan||{},sm=planSumme(p,g.leistung_kw);
  const modus={scharf:["scharf","gruen"],probe:["Probe","gelb"],aus:["aus",""]}[g.cfg.modus]||["?",""];
  return `<div class="karte geraet">
    <div class="kopf"><div><div class="name">${esc(g.cfg.name)}</div><div class="klein">Shelly ${esc(g.cfg.shelly_ip)} · ${z(g.leistung_kw,2)} kW</div></div>
      <span class="chip ${modus[1]}">${modus[0]}</span></div>
    ${g.stoerung?`<div class="stoerung"><b>${esc(g.stoerung)}</b><div class="klein" style="color:#ffb3aa">seit ${uhr(g.stoerung_seit)}, neuer Versuch ${uhr(g.wiederholt)}</div>
      <div class="knoepfe"><button data-h="geleert" data-id="${g.cfg.id}">Tank geleert</button></div></div>`:""}
    <div><span class="zahl">${g.an?(g.kompressor?"entfeuchtet":"läuft"):"aus"}</span> <span class="klein">&nbsp;${g.an&&!g.kompressor?"nur Lüfter · ":""}${esc(g.grund)}</span></div>
    ${raumluftZeile(g)}
    <div class="klein">Letzte 7 Tage ${dauerText(g.minuten_7t)} · geplant 7 Tage ${dauerText(sm.m)}${sm.netz?`, davon ${sm.netz} min vom Netz`:""}</div>
    <div class="knoepfe"><button data-h="an1h" data-id="${g.cfg.id}">1 h jetzt</button>
      <button data-h="heuteaus" data-id="${g.cfg.id}">Heute aus</button>
      ${g.hand?`<button data-h="normal" data-id="${g.cfg.id}">Hand beenden</button>`:""}
      <button class="haupt" data-g="${g.cfg.id}">Plan</button></div></div>`;
}
function raumluftZeile(g){
  if(!g.cfg.sensor_id) return "";
  if(!g.feuchte) return `<div class="klein">Raumluft: kein frischer Wert von ${esc(g.cfg.sensor_name)}, es gelten die Mindestregeln</div>`;
  const f=g.feuchte, farbe=g.nass?"var(--netz)":g.trocken?"var(--haus)":"var(--text)";
  const batt=f.batterie?` · Batterie <span style="color:${f.batterie<=15?"var(--netz)":"inherit"}">${f.batterie} %</span>`:"";
  return `<div class="klein">Raumluft <b style="color:${farbe}">${z(f.rh,0)} %</b> · ${z(f.temp)} °C${batt} · Grenzen ${g.cfg.feuchte_unten} bis ${g.cfg.feuchte_oben} %
    ${g.nass?" · zu feucht":g.trocken?" · trocken genug":""}${g.fenster_auf?" · Fenster offen":""}</div>`;
}
function feuchteSvg(g){
  const d=FEUCHTE[g.cfg.id]||[];if(d.length<2) return `<div class="klein">Noch keine Messwerte.</div>`;
  const b=1100,h=150,l=40,r=20,o=10,u=22,jetzt=Date.now(),von=jetzt-48*3600e3;
  const x=t=>l+(t-von)/(jetzt-von)*(b-l-r), y=v=>o+(1-(v-30)/50)*(h-o-u);
  let s="";
  for(const v of [40,50,60,70]) s+=`<line x1="${l}" x2="${b-r}" y1="${y(v)}" y2="${y(v)}" stroke="#1f2a38"/><text x="${l-6}" y="${y(v)+4}" fill="#5b6b7d" font-size="11" text-anchor="end">${v}</text>`;
  s+=`<rect x="${l}" y="${y(g.cfg.feuchte_oben)}" width="${b-l-r}" height="${y(30)-y(30)+0}" fill="none"/>
      <line x1="${l}" x2="${b-r}" y1="${y(g.cfg.feuchte_oben)}" y2="${y(g.cfg.feuchte_oben)}" stroke="var(--netz)" stroke-dasharray="4 4" opacity=".7"/>
      <line x1="${l}" x2="${b-r}" y1="${y(g.cfg.feuchte_unten)}" y2="${y(g.cfg.feuchte_unten)}" stroke="var(--haus)" stroke-dasharray="4 4" opacity=".7"/>`;
  for(let t=Math.ceil(von/21600e3)*21600e3;t<jetzt;t+=21600e3){const dt=new Date(t);
    s+=`<text x="${x(t)}" y="${h-6}" fill="#5b6b7d" font-size="11" text-anchor="middle">${dt.getHours()===0?tag(dt):dt.getHours()+" Uhr"}</text>`;}
  s+=`<path d="${d.map((p,i)=>(i?"L":"M")+x(new Date(p.zeit).getTime()).toFixed(1)+" "+y(Math.max(30,Math.min(80,p.rh))).toFixed(1)).join("")}" fill="none" stroke="var(--text)" stroke-width="1.6"/>`;
  return `<svg viewBox="0 0 ${b} ${h}" style="display:block;width:100%;height:auto">${s}</svg>`;
}
/* Kellerfenster: kein Rueckmelden der Antriebe, die Stellung ist der letzte Befehl. */

function hzStatus(v){
  if(v.fenster_offen) return ["Fenster offen","blau"];
  if(v.boost) return ["Boost","rot"];
  if(v.sommer) return ["Sommerbetrieb",""];
  if(v.urlaub) return ["Urlaub",""];
  if(v.soll<0) return ["aus",""];
  if(v.fordert) return ["fordert Wärme","rot"];
  if(v.warm_ohne_heizung) return ["warm ohne Heizung","gelb"];
  return ["zufrieden","gruen"];
}
const sollText=v=>v<0?"aus":v>=99?"voll":z(v)+" °C";
function hzKurve(ain){
  const d=HZK[ain]||[];if(d.length<2) return `<div class="klein" style="height:70px">Verlauf füllt sich alle 5 Minuten.</div>`;
  const b=320,h=80,jetzt=Date.now()/1000,von=jetzt-48*3600,x=t=>(t-von)/(jetzt-von)*b;
  const werte=d.flatMap(p=>[p.i,p.s>0&&p.s<99?p.s:p.i]);const lo=Math.floor(Math.min(...werte)-1),hi=Math.ceil(Math.max(...werte)+1);
  const y=v=>4+(1-(v-lo)/(hi-lo))*(h-8);
  let f="";for(let i=1;i<d.length;i++) if(d[i-1].f) f+=`<rect x="${x(d[i-1].z)}" y="0" width="${Math.max(1,x(d[i].z)-x(d[i-1].z))}" height="${h}" fill="#ff7b6b" opacity=".16"/>`;
  const ist=d.map((p,i)=>(i?"L":"M")+x(p.z).toFixed(1)+" "+y(p.i).toFixed(1)).join("");
  const soll=d.filter(p=>p.s>0&&p.s<99).map((p,i)=>(i?"L":"M")+x(p.z).toFixed(1)+" "+y(p.s).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${b} ${h}" style="display:block;width:100%;height:auto">${f}
    <path d="${soll}" fill="none" stroke="#8b97a6" stroke-dasharray="3 3"/><path d="${ist}" fill="none" stroke="#ffb38a" stroke-width="1.6"/>
    <text x="2" y="12" fill="#5b6b7d" font-size="10">${hi}°</text><text x="2" y="${h-3}" fill="#5b6b7d" font-size="10">${lo}°</text></svg>`;
}

    <div class="karte"><h2>Letzte Lüftungen</h2>${l.length?`<table><tr><th>Tag</th><th>Zeit</th><th class="r">Dauer</th><th class="r">Taupunkt drinnen</th><th class="r">draußen</th><th class="r">Raum</th><th>Ende</th></tr>
      ${l.map(x=>{const v=new Date(x.von),b=d(x.bis),m=((b||new Date())-v)/60000;
        return `<tr><td>${tag(v)}${x.probe?' <span class="chip gelb">Probe</span>':""}${x.bestaetigt?' <span class="chip gruen">bestätigt</span>':""}</td><td>${uhr(v)} bis ${b?uhr(b):"jetzt"}</td>
          <td class="r">${dauerText(m)}</td><td class="r">${z(x.taupunkt_innen)}${b?" → "+z(x.taupunkt_innen_ende):""} °C</td><td class="r">${z(x.taupunkt_aussen)} °C</td>
          <td class="r">${z(x.temp_innen)}${b?" → "+z(x.temp_innen_ende):""} °C</td><td class="klein">${esc(x.ende||x.grund)}</td></tr>`;}).join("")}</table>`
      :`<div class="klein">Noch keine Lüftung.</div>`}</div>`;
}
function lueftungEinst(){
  const c=entwurf||(entwurf=JSON.parse(JSON.stringify(LF.cfg)));
  const zahl=(k,einh,schritt=1)=>`<span class="eing"><input type="number" step="${schritt}" data-c="${k}" value="${c[k]}"> ${einh}</span>`;
  return `<div class="form">
    <div class="karte"><h2>Betrieb</h2>
      <div class="feld"><span class="n">Modus</span><span class="segment">${["aus","probe","scharf"].map(m=>`<a data-m="${m}" class="${c.modus===m?"an":""}">${{aus:"Aus",probe:"Probe",scharf:"Scharf"}[m]}</a>`).join("")}</span>
        <span class="e">Probe rechnet und protokolliert, fährt aber weder Fenster noch Ventil.</span></div>
      <div class="feld"><span class="n">Lüftungen am Tag</span>${zahl("max_je_tag","höchstens")}<span class="e">Jede heißt zweimal Motorlärm.</span></div>
      <div class="feld"><span class="n">Pause dazwischen</span>${zahl("abstand_std","h",0.5)}</div>
    </div>
    <div class="karte"><h2>Erlaubte Zeit</h2><table>${TAGE.map((t,i)=>`<tr><td style="width:36px">${t}</td>
      <td><span class="eing"><input class="z" data-zt="${i}" data-w="von" value="${hm(c.zeiten[i].von)}"> bis <input class="z" data-zt="${i}" data-w="bis" value="${hm(c.zeiten[i].bis)}"></span></td></tr>`).join("")}</table>
      <div class="klein" style="margin-top:8px">Außerhalb fährt die Automatik offene Kellerfenster zu, auch von Hand geöffnete.</div>
      <div class="feld"><span class="n">Ferien bis</span><span class="eing"><input type="date" data-c="ferien_bis" value="${esc(c.ferien_bis||"")}"></span>
        <span class="e">Bis einschließlich diesem Tag gelten die Sonntagszeiten, auch für den Entfeuchter. Feiertage in NRW erkennt die Steuerung selbst. Leer heißt keine Ferien.</span></div></div>
    <div class="karte"><h2>Feuchte</h2>
      <div class="feld"><span class="n">Öffnen ab Taupunktabstand</span>${zahl("abstand_k","K",0.5)}<span class="e">Taupunkt draußen so weit unter drinnen. Die Vorhersage irrt beim Taupunkt um 1,5 bis 2 K.</span></div>
      <div class="feld"><span class="n">Schließen unter</span>${zahl("schluss_k","K",0.5)}</div>
      <div class="feld"><span class="n">Nur lüften über</span>${zahl("ziel_rh","%")}<span class="e">Raumluft. 0 heißt: Untergrenze des Entfeuchters.</span></div>
      <div class="feld"><span class="n">Prüfen nach</span>${zahl("pruef_min","min")}<span class="e">Dann muss der Taupunkt drinnen gefallen sein, sonst zu und zwei Stunden Ruhe.</span></div>
    </div>
    <div class="karte"><h2>Temperatur und Wetter</h2>
      <div class="feld"><span class="n">Raum nicht kälter als</span>${zahl("min_innen","°C",0.5)}</div>
      <div class="feld"><span class="n">Draußen mindestens</span>${zahl("min_aussen","°C",0.5)}</div>
      <div class="feld"><span class="n">Böen höchstens</span>${zahl("max_boeen","km/h",5)}<span class="e">Regen ab 0,2 mm in der Stunde sperrt immer.</span></div>
      <div class="feld"><span class="n">Entfeuchter mit Sonne hat Vorrang unter</span>${zahl("sonne_vorrang_unter","°C",1)}<span class="e">Läuft er gerade mit Sonnenstrom, wird bei kälterer Luft nicht gelüftet, weil das Heizwärme kostet. -30 schaltet es ab.</span></div>
      <div class="feld"><span class="n">Kälte zählt gegen eine Stunde</span>${zahl("kaeltestrafe_k","K je Grad unter 12 °C",0.05)}<span class="e">Bevorzugt wärmere Stunden, damit der Raum weniger auskühlt.</span></div>
    </div>
    <div class="karte"><h2>Dauer</h2>
      <div class="feld"><span class="n">Höchstens</span>${zahl("max_min","min")}</div>
      <div class="feld"><span class="n">Unter 10 °C draußen höchstens</span>${zahl("max_min_kalt","min")}<span class="e">Kurz und kräftig, damit Wände und Möbel nicht auskühlen.</span></div>
    </div>
    <div class="karte"><h2>Heizung</h2>
      <div class="feld"><span class="n">Ventil beim Lüften auf</span>${zahl("ventil_soll","°C",0.5)}<span class="e">Danach zurück auf den alten Wert, außer die FRITZ!Box hat ihn inzwischen nach Wochenplan geändert.</span></div>
      <div class="feld"><span class="n">Ventil</span><span class="eing"><input data-c="ventil_name" value="${esc(c.ventil_name)}" style="width:140px"></span><span class="e">Teil des Namens in der FRITZ!Box.</span></div>
    </div></div>
    <div class="knoepfe" style="justify-content:flex-end;margin-top:16px"><button id="verwerfen">Verwerfen</button><button class="haupt" id="lspeichern">Speichern</button></div>`;
}
function tabletSicht(){
  const t=ST.tablet||{};
  return `<h1>Wandtablet</h1><div class="unter">MediaPad T5 · Wächter wandwacht</div>
    <div class="raster" style="grid-template-columns:1fr 1fr">
      <div class="karte"><h2>Akku</h2><div class="zahl">${t.akku??"–"} <small>%</small></div><div class="klein">${t.strom_ma>0?"lädt":"entlädt"} mit ${Math.abs(t.strom_ma||0)} mA</div></div>
      <div class="karte"><h2>Helligkeit tagsüber</h2>
        <div class="feld"><span class="n">5:00 bis 23:30</span><span class="eing"><input type="number" id="hell" min="20" max="255" value="${t.hell_tag}"> von 255</span>
          <span class="e">Nachts 51. Unter 20 % Akku dimmt der Wächter auf 51, unter 8 % auf 20. Gilt binnen einer Minute.</span></div>
        <div class="knoepfe" style="justify-content:flex-end"><button class="haupt" id="hellsetzen">Übernehmen</button></div></div>
    </div>`;
}
async function verlaufLaden(){
  const v=await api("api/verlauf?id="+geraetId),el=document.getElementById("verlauf");if(!el)return;
  const l=(v.laeufe||[]).slice().reverse();
  el.innerHTML=l.length?`<table><tr><th>Tag</th><th>Zeit</th><th class="r">Dauer</th><th>Strom</th><th>Grund</th></tr>
    ${l.map(x=>{const bis=x.bis&&!x.bis.startsWith("0001")?new Date(x.bis):null,m=((bis||new Date())-new Date(x.von))/60000;
      const q=Object.entries(x.min||{}).filter(e=>e[1]>0.5).map(([k,v])=>`<span style="color:${Q[k]}">${QT[k]} ${Math.round(v)}</span>`).join(" · ");
      return `<tr><td>${tag(x.von)}${x.probe?' <span class="chip gelb">Probe</span>':""}</td><td>${uhr(x.von)} bis ${bis?uhr(bis):"jetzt"}</td>
        <td class="r">${dauerText(m)}</td><td class="klein">${q||"–"}</td><td class="klein">${esc(x.grund)}</td></tr>`;}).join("")}</table>`
    :`<div class="klein">Noch kein Lauf.</div>`;
}

function zeichne(){
  if(!ST) return;
  const inhalt=ansicht==="geraet"?geraetSicht():ansicht==="tablet"?tabletSicht():ansicht==="heizung"?heizungSicht():ansicht==="lueftung"?lueftungSicht():uebersicht();
  const w=document.getElementById("wurzel");w.innerHTML=rahmen(inhalt);
  w.querySelectorAll("[data-v]").forEach(a=>a.onclick=()=>{ansicht=a.dataset.v;entwurf=null;if(ansicht==="lueftung")reiter="stand";
    if(ansicht==="heizung"){HZZEIT=0;lade();} zeichne();});
  w.querySelectorAll("[data-g]").forEach(a=>a.onclick=()=>{ansicht="geraet";geraetId=a.dataset.g;reiter="plan";entwurf=null;zeichne();});
  w.querySelectorAll("[data-r]").forEach(a=>a.onclick=()=>{reiter=a.dataset.r;entwurf=null;zeichne();});
  w.querySelectorAll("[data-h]").forEach(b=>b.onclick=async()=>{b.disabled=true;
    try{await api("api/hand",{id:b.dataset.id,aktion:b.dataset.h});meldung("Erledigt");await lade();}catch(e){meldung(e.message);}});
  w.querySelectorAll("[data-kf]").forEach(b=>b.onclick=async()=>{w.querySelectorAll("[data-kf]").forEach(x=>x.disabled=true);
    try{await api("api/kellerfenster",{richtung:b.dataset.kf});meldung("Gesendet");await lade();}catch(e){meldung(e.message);zeichne();}});
  w.querySelectorAll("[data-m]").forEach(a=>a.onclick=()=>{entwurf.modus=a.dataset.m;zeichne();});
  w.querySelectorAll("[data-c]").forEach(i=>i.onchange=()=>{const k=i.dataset.c;
    entwurf[k]=i.type==="checkbox"?i.checked:i.type==="number"?Number(i.value):i.value;});
  const sw=document.getElementById("sensorwahl");
  if(sw) sw.onchange=()=>{entwurf.sensor_id=sw.value;entwurf.sensor_name=sw.value?sw.options[sw.selectedIndex].text:"";};
  w.querySelectorAll("[data-fe]").forEach(i=>i.onchange=()=>{const f=new Set(entwurf.fenster||[]);
    i.checked?f.add(i.dataset.fe):f.delete(i.dataset.fe);entwurf.fenster=[...f];});
  if(ansicht==="geraet"&&reiter==="einst"&&SENSOREN===null){SENSOREN=[];api("api/sensoren").then(l=>{SENSOREN=l||[];zeichne();}).catch(()=>{});}
  w.querySelectorAll("[data-zt]").forEach(i=>i.onchange=()=>{const m=i.value.match(/^(\d{1,2}):?(\d{2})?$/);
    if(m) entwurf.zeiten[i.dataset.zt][i.dataset.w]=Number(m[1])+Number(m[2]||0)/60; else meldung("Uhrzeit wie 11:00");});
  const sp=document.getElementById("speichern");
  if(sp) sp.onclick=async()=>{try{await api("api/einstellungen",entwurf);entwurf=null;meldung("Gespeichert, gilt ab der nächsten Messung");reiter="plan";await lade();}catch(e){meldung(e.message);}};
  const ls=document.getElementById("lspeichern");
  if(ls) ls.onclick=async()=>{try{await api("api/lueftung",entwurf);entwurf=null;meldung("Gespeichert, gilt ab der nächsten Minute");reiter="stand";await lade();}catch(e){meldung(e.message);}};
  const vw=document.getElementById("verwerfen");if(vw) vw.onclick=()=>{entwurf=null;zeichne();};
  const hs=document.getElementById("hellsetzen");
  if(hs) hs.onclick=async()=>{try{await api("api/tablet",{hell_tag:Number(document.getElementById("hell").value)});meldung("Gilt binnen einer Minute");await lade();}catch(e){meldung(e.message);}};
  if(ansicht==="geraet"&&reiter==="verlauf") verlaufLaden();
}

/* Ansicht aus dem Adressanker, etwa steuerung#heizung, fuer Lesezeichen. */
if(["heizung","tablet","lueftung"].includes(location.hash.slice(1))) ansicht=location.hash.slice(1);
lade();
setInterval(lade,30000);
/* Auf der Wand meldet jede Beruehrung, dass noch jemand davor steht. */
if(WAND) ["pointerdown","keydown"].forEach(e=>document.addEventListener(e,()=>parent.postMessage("steuerung-aktiv","*")));
</script>
</body>
</html>
